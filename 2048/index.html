<style>
  .board2048 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    padding: 8px;
    border-radius: var(--r-md);
    width: min(420px, 100%);
    margin: 0 auto;
    aspect-ratio: 1;
    touch-action: none;
  }
  .tile {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: clamp(1.1rem, 5vw, 1.8rem);
    color: var(--fg);
    user-select: none;
    transition: background .1s, color .1s, border-color .1s;
  }
  /* Amber-scaled tile ramp */
  .t2    { background: #1a1a17; color: var(--muted); }
  .t4    { background: #1e1d18; color: var(--fg); }
  .t8    { background: #2a2318; color: var(--warn); border-color: rgba(245,197,66,0.25); }
  .t16   { background: #33271a; color: var(--warn); border-color: rgba(245,197,66,0.35); }
  .t32   { background: #3d2b1d; color: var(--accent); border-color: rgba(245,197,66,0.45); }
  .t64   { background: #4a3320; color: var(--accent); border-color: rgba(245,197,66,0.55); }
  .t128  { background: #2a3a28; color: var(--accent-2); border-color: rgba(138,255,193,0.35); }
  .t256  { background: #2d4a34; color: var(--accent-2); border-color: rgba(138,255,193,0.45); }
  .t512  { background: #335a3c; color: var(--accent-2); border-color: rgba(138,255,193,0.55); }
  .t1024 { background: #3a6a45; color: #0a0a0a; border-color: var(--accent-2); font-size: clamp(0.9rem, 4vw, 1.5rem); }
  .t2048 { background: var(--accent-2); color: #0a0a0a; border-color: var(--accent-2); font-size: clamp(0.9rem, 4vw, 1.5rem); box-shadow: 0 0 24px rgba(138,255,193,0.35); }
  .t4096, .t8192 { background: var(--accent); color: #0a0a0a; border-color: var(--accent); font-size: clamp(0.9rem, 4vw, 1.5rem); }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.12); } 100% { transform: scale(1); } }
  .tile.merged { animation: pop 0.18s ease-out; }

  /* chunky look: dark brown page, mauve board, cream and orange tiles */
  html body.fun.g-2048 { --fun-bg: #2b1f1d; --fun-btn: #8a5f63; --fun-chip: rgba(255,255,255,.1); }
  html body.fun.g-2048 .panel .board2048 { width: calc(100% + 22px); margin: 8px -11px 0; padding: 12px; gap: 12px; box-sizing: border-box; max-width: none; border: 0; border-radius: 22px; background: #8a6a6c; }
  html body.fun.g-2048 .panel .tile { border: 0; border-radius: 14px; background: #a07f81; color: #4a3436; font-weight: 400; font-size: clamp(1.6rem, 9vw, 2.6rem); box-shadow: none; }
  html body.fun.g-2048 .panel .t2, html body.fun.g-2048 .panel .t4 { background: #fff3e0; color: #4a3436; }
  html body.fun.g-2048 .panel .t8 { background: #fbb25c; color: #fff; } html body.fun.g-2048 .panel .t16 { background: #f89a4a; color: #fff; }
  html body.fun.g-2048 .panel .t32 { background: #f2794a; color: #fff; } html body.fun.g-2048 .panel .t64 { background: #e8553f; color: #fff; }
  html body.fun.g-2048 .panel .t128 { background: #f4cf4a; color: #fff; font-size: clamp(1.3rem, 7.5vw, 2.1rem); } html body.fun.g-2048 .panel .t256 { background: #f0c22f; color: #fff; font-size: clamp(1.3rem, 7.5vw, 2.1rem); }
  html body.fun.g-2048 .panel .t512 { background: #8fcf4a; color: #fff; font-size: clamp(1.3rem, 7.5vw, 2.1rem); }
  html body.fun.g-2048 .panel .t1024, html body.fun.g-2048 .panel .t2048, html body.fun.g-2048 .panel .t4096, html body.fun.g-2048 .panel .t8192 { background: #3fc9b0; color: #fff; font-size: clamp(1.1rem, 6.2vw, 1.8rem); box-shadow: none; }
  html body.fun.g-2048 .panel .board2048 { position: relative; }
  html body.fun.g-2048 .tile.ghost { box-shadow: none; }
  html body.fun.g-2048 .kbd { display: none; }
  /* the board sits in the middle of the space under the Options bar, not stuck to the top */

  html body.fun.g-2048 .panel .board2048 { margin: auto -11px; }

<template id="man-2048">
  <h2>Name</h2>
  <p>2048 — slide numbered tiles, merge matching pairs, reach <strong>2048</strong>.</p>

  <h2>Rules</h2>
  <ul>
    <li>Every move slides <strong>all</strong> tiles as far as they can go in that direction.</li>
    <li>When two tiles of the same value collide, they merge into one tile of double the value.</li>
    <li>A new <code>2</code> (or sometimes a <code>4</code>) appears in an empty cell after each move.</li>
    <li><strong>Difficulty:</strong> Normal is the classic game. Hard spawns far more 4s. Brutal also often drops the new tile in the spot that blocks you most. Each level keeps its own best score.</li>
    <li>You win when a <code>2048</code> tile is created. Keep going for higher scores.</li>
    <li>You lose when the board is full and no moves are possible.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Swipe</strong> up/down/left/right on the board (mobile).</li>
    <li>Keyboard: <span class="k">↑</span> <span class="k">↓</span> <span class="k">←</span> <span class="k">→</span> or <span class="k">W</span> <span class="k">A</span> <span class="k">S</span> <span class="k">D</span>.</li>
    <li><code>New game</code> resets the board. Best score persists across sessions.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Pick one corner and keep your largest tile parked there. Never break the ramp.</p>
</template>
