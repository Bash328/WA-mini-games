<template id="man-backgammon">
  <h2>Name</h2>
  <p>backgammon — race your checkers home, then bear them off.</p>

  <h2>Rules</h2>
  <ul>
    <li>Fifteen checkers each. <strong>Black</strong> moves from the top right round to the bottom right (its home); <strong>White</strong> goes the other way, to the top right. Black goes first.</li>
    <li>Roll two dice. Each die moves one checker that many points (one checker may use both). <strong>Doubles</strong> give four moves.</li>
    <li>A point with <strong>two or more enemy checkers is blocked</strong>. Land on a <strong>single</strong> enemy checker and you hit it: it goes to the <strong>bar</strong> (the middle) and its owner must bring it back in before doing anything else, onto an open point in your home board.</li>
    <li>You must play <strong>as many dice as you can</strong>; if only one die can be played it has to be the larger one. If you can't move at all, you pass.</li>
    <li>Once all 15 of your checkers are in your home board, you can <strong>bear off</strong>: a die removes a checker from that exact point, or from your furthest-back point if the die is bigger than any point you still hold.</li>
    <li>First to bear off all 15 wins. This is a single game: no gammons and no doubling cube.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap <code>Roll</code> for your dice. Tap a checker (or the bar) to see where it can go, then tap a highlighted point, or the tray on the right to bear off.</li>
    <li><code>↶ undo move</code> takes back moves within your turn. When all dice are played (or none can be), tap <code>Done</code>.</li>
    <li>Use the mode menu to play the computer or share one device.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts is <strong>Black</strong>. Your whole turn, all its moves, goes in one link: tap <code>Done</code>, then <code>Send on WhatsApp</code>.</li>
    <li>Over WhatsApp your own browser rolls your dice, so it runs on trust (like Pig). For dice nobody can touch, play <strong>Online</strong>: there the server rolls them.</li>
  </ul>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. The server rolls the dice and checks every move. If you can't move, it passes the turn for you.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Make points (two checkers together): they're safe and they block. Leave as few single checkers (blots) within reach of the enemy as you can, and keep your own pieces together when you have to come around the board.</p>
</template>
