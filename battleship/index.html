<style>
  /* Grid cells are buttons, so their rules are #id-prefixed (#bs) to beat the
     shared "body[class*='g-'] .panel button" rule. */
  .bs-wrap { width: min(380px, 100%); margin: 14px auto 0; }
  .bs-wrap.small { width: min(250px, 70%); }
  .bs-title { font-size: var(--fs-sm); color: var(--muted); letter-spacing: 1px; text-transform: uppercase; margin: 0 0 6px; font-weight: 500; }
  .bs-grid {
    display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; padding: 4px;
    background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
  }
  #bs .bs-cell {
    aspect-ratio: 1; width: 100%; min-height: 0; padding: 0; border-radius: 4px;
    border: 1px solid var(--border); background: #1d3a4a; color: var(--fg);
    font-family: inherit; font-weight: 700; font-size: 13px; line-height: 1; cursor: default;
    display: grid; place-items: center;
  }
  .bs-wrap.small #bs .bs-cell, #bs-sub .bs-cell { font-size: 10px; }
  #bs-main.clickable .bs-cell { cursor: pointer; }
  #bs .bs-cell.ship { background: #8fa3bf; border-color: #c0cde0; }
  #bs .bs-cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; background: #2d5a73; }
  #bs .bs-cell.hit { background: #c23b3b; border-color: #ff8a8a; color: #fff; }
  #bs .bs-cell.sunk { background: #6b1f1f; border-color: #c23b3b; color: #ffb0b0; }
  #bs .bs-cell.miss { background: #243b47; color: #7fb4cc; }
  #bs .bs-cell.last { box-shadow: inset 0 0 0 2px var(--accent); }
  #bs .bs-cell.dim { background: #4b5668; border-color: #6b778c; }
  #bs .bs-cell.sel-ship { background: #4dd9ac; border-color: #bff5e3; }
  #bs .bs-cell.bad { background: #8a2b2b; }

  #bs-tray { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 12px 0; }
  #bs-tray .bs-ship {
    min-height: 34px; padding: 4px 10px; font-size: var(--fs-xs); border-radius: 10px;
    border: 1px solid var(--border); background: var(--bg-2); color: var(--fg); cursor: pointer;
  }
  #bs-tray .bs-ship.sel { border-color: var(--accent); color: var(--accent); }
  #bs-tray .bs-ship.placed { opacity: 0.6; }
  #bs-tray .bs-ship.placed::after { content: " ✓"; color: var(--accent-2); }
  .bs-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0 0; }
  #bs-note, #bs-hint { text-align: center; color: var(--muted); font-size: var(--fs-sm); margin: 10px 0 0; min-height: 1.2em; }
  #bs-note strong { color: var(--fg); font-weight: 600; }
  #bs-cover { text-align: center; padding: 30px 10px; }
  #bs-cover p { color: var(--muted); margin: 0 0 14px; }

<template id="man-battleship">
  <h2>Name</h2>
  <p>battleship — hide your fleet, sink theirs.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each player secretly places 5 ships on a 10×10 grid: lengths 5, 4, 3, 3 and 2. Ships go straight across or down and can't overlap.</li>
    <li>Then take turns firing at one square of the enemy grid. You're told hit or miss, and when you've sunk a whole ship.</li>
    <li>First to sink all five enemy ships wins.</li>
  </ul>

  <h2>Placing your fleet</h2>
  <ul>
    <li>Pick a ship in the tray, tap a square to drop it there, and use <strong>rotate</strong> to flip it across or down. <strong>Random</strong> places everything for you.</li>
    <li>Tap a placed ship to pick it back up and move it.</li>
  </ul>

  <h2>Two players over WhatsApp</h2>
  <ul>
    <li>Player 1 places their fleet and sends the link. Player 2 places theirs and sends it back. After that you take turns firing, one link per shot.</li>
    <li>Fleets do technically ride along in the link's data (the same tradeoff as Hangman's word). The page never shows your opponent's ships until the game ends.</li>
  </ul>

  <h2>Same device &amp; vs computer</h2>
  <p class="muted">Same device: a cover screen appears between turns so each player's fleet stays hidden. Vs computer: you place your fleet, the computer hides its own and fires back after every shot.</p>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap a square</strong> on the enemy grid to aim, then press <strong>Fire!</strong>.</li>
    <li>Red is a hit, a dark red square is part of a sunk ship, and a blue dot is a miss.</li>
  </ul>
</template>
