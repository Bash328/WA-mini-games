<template id="man-blokus-duo">
  <h2>Name</h2>
  <p>blokus duo — fit as many of your 21 pieces on the board as you can.</p>

  <h2>Rules</h2>
  <ul>
    <li>A 14×14 board. Each player has 21 pieces: every shape that can be made from one to five squares (89 squares in all).</li>
    <li><strong>Orange</strong> goes first and the first piece must cover Orange's start square (the ringed square near the top left). Violet's first piece covers Violet's ringed square near the bottom right.</li>
    <li>Every later piece must <strong>touch one of your own pieces at a corner</strong> and may <strong>never share an edge</strong> with one of your own. Touching the opponent's pieces is fine, and blocking them is the point. The small dots show the corners you can hook onto.</li>
    <li>If you can't place a piece you are skipped, and the other player carries on. When neither of you can move the game ends.</li>
    <li><strong>Scoring:</strong> count the squares in the pieces you didn't place; fewer wins. Placing all 21 is worth −15, and −20 if your last piece was the single square.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts is <strong>Orange</strong>. After placing a piece, tap <code>Send on WhatsApp</code>. If your friend has no legal move, you simply go again, and the link says so.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap a piece in the tray, <code>↻ Rotate</code> or <code>⇋ Flip</code> it, then tap the board to see where it would go: <strong>green</strong> is legal, <strong>red</strong> is not. Tap the same spot again (or <code>Place piece</code>) to put it down. On a computer, hover to preview and press R to rotate, F to flip.</li>
    <li>Use the mode menu to play the computer or share one device; <code>↶ undo</code> is there in those modes.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Play your big, awkward pieces first and keep small ones for tight gaps. Spread toward your opponent's side early so you keep many corners to build from, and try to cut off their corners.</p>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. Your friend joins in their browser and you play in real time.</li>
  </ul>
</template>
