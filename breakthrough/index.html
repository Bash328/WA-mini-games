<template id="man-breakthrough">
  <h2>Name</h2>
  <p>breakthrough — a race across an 8×8 board, one square at a time.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each side starts with <strong>sixteen pieces on its two back rows</strong>. Red is at the bottom and moves up; Blue is at the top and moves down. Red moves first.</li>
    <li>On your turn move <strong>one piece one square straight forward</strong>, onto an empty square.</li>
    <li>Or move it <strong>one square diagonally forward</strong> onto an enemy piece, capturing it. A piece never moves sideways or backward, and a diagonal square can only be entered by a capture.</li>
    <li><strong>Win</strong> by putting any piece on the opponent's back rank: Red on the top row, Blue on the bottom row. You also win if your opponent has no legal move at all.</li>
    <li>So a link can never loop forever, <strong>60 moves in a row with no capture</strong> end the game in a draw.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap one of your pieces, then tap a marked square. A dot is a step forward; <strong>a ring means a capture</strong>.</li>
    <li>Tap the piece again, or tap empty space, to let it go.</li>
    <li>The square a piece came from and the square it reached stay marked in amber.</li>
    <li>Against the computer, pick <strong>Easy / Medium / Hard</strong> and whether you play Red (first) or Blue.</li>
    <li><code>undo</code> sits below the board against the computer and on one device. The round arrow in the header always starts a new game.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts the game is <strong>Red</strong> and makes the first move; your friend is <strong>Blue</strong>.</li>
    <li>After each move tap <code>Send on WhatsApp</code>. Your friend opens the link, sees your move marked, moves and sends one back. <code>Copy link</code> works for any other messenger.</li>
    <li>A link opened twice shows the latest move, so a refresh never loses the game.</li>
  </ul>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. You play in real time, with no link-passing. Rooms are deleted a day after the last move, or an hour after the game ends.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Two pieces side by side are hard to stop: one can capture diagonally while the other covers its partner. Look for a piece that is one step from the far rank, and block the enemy's run rather than chasing it. Every capture also resets the draw counter, so a stalled game stays live.</p>
</template>
