  /* ── the car park: a dark asphalt tray, parking-bay lines and chunky cars ───────────────── */
  .cp-board {
    position: relative;
    box-sizing: border-box;
    width: calc(100% + 22px);
    margin: 8px -11px 4px;
    aspect-ratio: 1;
    padding: 8px;
    border-radius: 26px;
    background: #0a0d10;
    box-shadow: 0 10px 0 rgba(0, 0, 0, .28);
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .cp-inner {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 18px;
    overflow: hidden;
    background: #2a3037;
  }
  .cp-grid {
    position: absolute;
    inset: 0;
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
  }
  .cp-cell { box-sizing: border-box; border-right: 1px dashed rgba(255, 255, 255, .10); border-bottom: 1px dashed rgba(255, 255, 255, .10); }
  .cp-cell:nth-child(6n) { border-right: 0; }
  .cp-cell:nth-child(n+31) { border-bottom: 0; }
  .cp-cars { position: absolute; inset: 0; }
  /* a soft yellow bay at the exit cell, under the cars */
  .cp-inner::after {
    content: "";
    position: absolute;
    right: 0;
    top: calc(100% / 3);
    width: calc(100% / 6);
    height: calc(100% / 6);
    background: linear-gradient(90deg, transparent, rgba(255, 191, 46, .3));
    pointer-events: none;
  }

  /* Cars are buttons, so this selector has to beat fun.css's fill/padding/shadow. */
  html body.fun.g-car-park .panel .cp-car {
    --lift: inset 0 -4px 0 rgba(0, 0, 0, .22), inset 0 2px 0 rgba(255, 255, 255, .18), 0 2px 4px rgba(0, 0, 0, .35);
    position: absolute;
    box-sizing: border-box;
    min-width: 0;
    min-height: 0;
    padding: 0;
    border: 0;
    border-radius: 13px;
    background: var(--car);
    color: #fff;
    box-shadow: var(--lift);
    transform: none;
    font-family: inherit;
    text-transform: none;
    cursor: pointer;
    touch-action: none;
    z-index: 2;
  }
  html body.fun.g-car-park .panel .cp-car:hover,
  html body.fun.g-car-park .panel .cp-car:active {
    background: var(--car);
    color: #fff;
    box-shadow: var(--lift);
    transform: none;
    filter: none;
  }
  html body.fun.g-car-park .panel .cp-car[data-red="1"] {
    --lift: inset 0 -4px 0 rgba(0, 0, 0, .25), inset 0 0 0 3px rgba(255, 255, 255, .88), 0 2px 6px rgba(0, 0, 0, .45);
    z-index: 3;
  }
  html body.fun.g-car-park .panel .cp-car[data-sel="1"] { outline: 3px solid #fff; outline-offset: 1px; z-index: 5; }
  html body.fun.g-car-park .panel .cp-car[data-hint="1"] { outline: 3px solid #ffbf2e; outline-offset: 2px; animation: cp-pulse .9s ease-in-out infinite; }
  html body.fun.g-car-park .panel .cp-car[data-bad="1"] { animation: cp-shake .28s ease; }
  .cp-cab {
    position: absolute;
    left: 18%;
    right: 18%;
    top: 25%;
    bottom: 25%;
    border-radius: 5px;
    background: rgba(255, 255, 255, .24);
    pointer-events: none;
  }
  .cp-car[data-red="1"] .cp-cab { background: rgba(255, 255, 255, .38); }

  /* the hint's destination: a dashed bay where the car will land */
  .cp-ghost {
    position: absolute;
    box-sizing: border-box;
    border: 3px dashed #ffbf2e;
    border-radius: 13px;
    background: rgba(255, 191, 46, .12);
    pointer-events: none;
    z-index: 1;
  }


  /* the exit gate sits in the right-hand frame, level with the red car's row */
  .cp-exit {
    position: absolute;
    right: 0;
    width: 8px;
    top: calc(8px + (100% - 16px) / 3);
    height: calc((100% - 16px) / 6);
    border-radius: 0 3px 3px 0;
    background: repeating-linear-gradient(45deg, #ffbf2e 0 4px, #111 4px 8px);
    box-shadow: 0 0 14px rgba(255, 191, 46, .55);
    z-index: 9;
    pointer-events: none;
  }
  .cp-exit::after {
    content: "";
    position: absolute;
    left: 1px;
    top: 50%;
    width: 6px;
    height: 6px;
    border-top: 2px solid #fff;
    border-right: 2px solid #fff;
    transform: translateY(-50%) rotate(45deg);
  }

  .cp-note {
    min-height: 1.6em;
    margin: 2px 0 0;
    text-align: center;
    color: rgba(255, 255, 255, .72);
    font-size: var(--fs-sm);
  }

  @keyframes cp-pulse { 50% { outline-color: #fff; } }
  @keyframes cp-shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }
  @media (prefers-reduced-motion: reduce) {

    html body.fun.g-car-park .panel .cp-car[data-bad="1"] { animation: none; }

  .cp-sprite {
    position: absolute; left: 50%; top: 50%; width: 100%; height: 100%; pointer-events: none;

<template id="man-car-park">
  <h2>Name</h2>
  <p>car park — a 6×6 Rush Hour puzzle. The red car is boxed in; slide the other cars out of its way and drive it through the yellow gate on the right.</p>

  <h2>Rules</h2>
  <ul>
    <li>Cars and trucks are 2 or 3 squares long. They only move along their own row or column — a horizontal car cannot go up or down.</li>
    <li>A car may not pass through another car, and may not leave the car park. It can slide as far as the empty space allows.</li>
    <li>One slide counts as one move, however many squares the car travels.</li>
    <li>Get the red car to the right edge of <strong>row 3</strong> and it drives out through the exit. That is the win.</li>
    <li>Every level has a solution. The <strong>par</strong> shown in the level menu is the fewest possible moves, found by a solver.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Drag a car</strong> along its row or column. It follows your finger, stops where another car or the edge is in the way, and settles on the nearest square when you let go. One slide, however far, is one move.</li>
    <li>Or tap a car, then tap a free square in its row or column to slide it exactly there.</li>
    <li>Keyboard: <span class="k">Tab</span> to a car, press <span class="k">Enter</span> (or Space) to select it, then the arrow keys slide it. <span class="k">Esc</span> clears the selection.</li>
    <li><code>Hint</code> highlights one car and its next move from the solver. <code>Undo</code> takes back a slide; <code>↻ reset</code> puts the same level back.</li>
    <li>The menu in <strong>Options</strong> picks any of the 42 levels. Completing one offers the next level; <strong>Next level</strong> in Options jumps ahead at any time.</li>
  </ul>

  <h2>Best</h2>
  <p class="muted">Your best is the fewest moves you have used on the current level. It is saved on this device, separately for each level. A lower par means an easier level.</p>
</template>
