<style>
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(560px, 100%);
    aspect-ratio: 1;
    margin: 0 auto;
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    overflow: hidden;
    touch-action: manipulation;
  }
  .sq {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.8rem, 8vw, 3.2rem);
    cursor: pointer;
    user-select: none;
    position: relative;
    line-height: 1;
  }
  /* Chess.com-style green + white board */
  .sq.light { background: #eeeed2; }
  .sq.dark  { background: #769656; }
  .sq.sel   { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
  .sq.last  { box-shadow: inset 0 0 0 3px rgba(245, 197, 66, 0.55); }
  .sq.hint::after {
    content: "";
    position: absolute;
    width: 28%; height: 28%;
    background: rgba(0, 0, 0, 0.22);
    border-radius: 50%;
  }
  .sq.cap::after {
    content: "";
    position: absolute;
    inset: 6%;
    border: 3px solid rgba(0, 0, 0, 0.35);
    border-radius: 50%;
  }
  .sq.w {
    color: #fff;
    -webkit-text-stroke: 1px #333;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }
  .sq.b {
    color: #000;
    -webkit-text-stroke: 0.5px #000;
    text-shadow: 0 1px 2px rgba(255,255,255,0.2);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  }


  /* chunky look: black-framed tan board edge to edge; the page turns blue while the bot thinks */
  html body.fun.g-chess { --fun-bg: #2f3555; --fun-btn: #5a63b8; --vs-bg: #1c2038; --vs-l: #ff7a7a; --vs-r: #3fd0c0; transition: background-color .35s; }
  html body.fun.g-chess:has(.turn.wait) { --fun-bg: #3d2d4f; }
  html body.fun.g-chess .turn { width: fit-content; max-width: 100%; box-sizing: border-box; min-height: 0; margin: 14px auto 18px; padding: 14px 20px; border-radius: 14px; font-size: 26px; }

  html body.fun.g-chess .panel .board { width: calc(100% + 22px); margin: 8px -11px; border: 6px solid #000; border-radius: 0; box-sizing: border-box; max-width: none; background: #000; }
  .sq.dark { background: #b08b5f; }
  .sq.light { background: #d7bc94; }
  html body.fun.g-chess:has(#turn-badge:not([hidden])) #info { display: none; }
  .sq.last { background: #8fa3a6; box-shadow: none; }
  .sq.sel { outline-color: #ffbf2e; }
  .sq.w { color: #fff; -webkit-text-stroke: 1.4px #000; text-shadow: none; filter: none; paint-order: stroke fill; }
  .sq.b { color: #000; -webkit-text-stroke: 0; text-shadow: none; filter: none; }

<template id="man-chess">
  <h2>Name</h2>
  <p>chess — full rules, against a friend over WhatsApp or a small minimax engine.</p>

  <h2>Rules</h2>
  <ul>
    <li>Standard chess: pieces move as they do in real chess, including <strong>castling</strong>, <strong>en passant</strong>, and <strong>pawn promotion</strong> (auto-queens).</li>
    <li>Deliver <strong>checkmate</strong> to win; the game ends in a draw on stalemate, insufficient material, or the 50-move rule.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts the game plays <strong>White</strong> and moves first.</li>
    <li>Tap a piece, tap where it goes, then <code>Send on WhatsApp</code>. Your friend opens the link, sees your last move outlined, and moves.</li>
    <li>This mode has no <strong>undo</strong>, and doesn't detect <strong>threefold repetition</strong> (draws by repeating a position) since no move history travels in the link — everything else works as normal.</li>
    <li><code>Flip board</code> is a per-device preference and isn't remembered from link to link, so Black may want to tap it after opening a link.</li>
  </ul>

  <h2>Chess puzzles</h2>
  <ul>
    <li>Switch the mode to <code>chess puzzles</code>. The computer plays the opponent's last move, then it's your turn to find the best continuation: a mate in 1, 2 or 3, or a tactic that wins material (a fork, pin, skewer, hanging piece, discovered attack ...). The puzzle tells you what to look for and which side you play.</li>
    <li>A wrong move is refused and you try again; the right one is answered by the opponent, and you keep going until it's solved. In a mating puzzle any move that checkmates counts.</li>
    <li><code>Today's puzzle</code> is the same for everyone each day. <code>Another puzzle</code> picks a different one. <code>Hint</code> points at the piece to move (press it again for the square); <code>Show solution</code> plays it out for you.</li>
    <li>The puzzles come from the <a href="https://database.lichess.org/#puzzles" target="_blank" rel="noopener">Lichess puzzle database</a> (public domain, CC0): thanks to Lichess and everyone whose games they are built from.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> one of your pieces to select it. Legal destinations are highlighted with dots (moves) or rings (captures).</li>
    <li><strong>Tap a highlighted square</strong> to move there. Tap the piece again to deselect.</li>
    <li>Switch the mode to <code>vs computer</code> to play solo. <code>Undo</code> takes back one full pair of moves there; choose <code>Easy / Medium / Hard</code> for engine strength.</li>
  </ul>

  <h2>Notes</h2>
  <p class="muted">The engine uses minimax with alpha-beta pruning and piece-square tables. At depth 3 it plays a decent casual game.</p>
</template>
