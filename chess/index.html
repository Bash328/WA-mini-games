<style>
  .board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    grid-template-rows: repeat(8, 1fr);
    width: min(560px, 100%);
    aspect-ratio: 1;
    margin: 0 auto;
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    overflow: hidden;
    touch-action: manipulation;
  }
  .sq {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.8rem, 8vw, 3.2rem);
    cursor: pointer;
    user-select: none;
    position: relative;
    line-height: 1;
  }
  /* Chess.com-style green + white board */
  .sq.light { background: #eeeed2; }
  .sq.dark  { background: #769656; }
  .sq.sel   { outline: 3px solid var(--accent); outline-offset: -3px; z-index: 1; }
  .sq.last  { box-shadow: inset 0 0 0 3px rgba(245, 197, 66, 0.55); }
  .sq.hint::after {
    content: "";
    position: absolute;
    width: 28%; height: 28%;
    background: rgba(0, 0, 0, 0.22);
    border-radius: 50%;
  }
  .sq.cap::after {
    content: "";
    position: absolute;
    inset: 6%;
    border: 3px solid rgba(0, 0, 0, 0.35);
    border-radius: 50%;
  }
  .sq.w {
    color: #fff;
    -webkit-text-stroke: 1px #333;
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.4));
  }
  .sq.b {
    color: #000;
    -webkit-text-stroke: 0.5px #000;
    text-shadow: 0 1px 2px rgba(255,255,255,0.2);
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.3));
  }

  select {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    padding: 8px 10px;
    font-family: inherit;
    font-size: var(--fs-sm);
    min-height: var(--tap);
  }

<body class="g-chess">
<main class="wrap">
  <div class="topbar">
    <h1>chess</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status">Your move.</p>
      <p class="status" id="info"></p>
      <button class="btn ghost tool-btn man-trigger" data-man="chess" data-man-title="CHESS(1)" type="button">
        how to <span class="q">?</span>
      </button>
    </div>
    <div id="wa-ui" class="wa-ui" hidden></div>
    <div class="board" id="board"></div>
    <div class="controls" style="justify-content:center">
      <button class="primary" id="reset">New game</button>
      <select id="mode" aria-label="Mode">
        <option value="whatsapp" selected>2 players · WhatsApp</option>
        <option value="ai">vs AI</option>
      </select>
      <button id="undo" hidden>Undo</button>
      <button id="flip">Flip board</button>
      <select id="level" aria-label="AI level" hidden>
        <option value="1">Easy (depth 1)</option>
        <option value="2" selected>Normal (depth 2)</option>
        <option value="3">Hard (depth 3)</option>
      </select>
      <select id="side" aria-label="Your side" hidden>
        <option value="w" selected>Play White</option>
        <option value="b">Play Black</option>
      </select>
    </div>
    <p class="footer-note">Tap a piece, then tap a destination. Pawns auto-promote to queen.</p>
  </div>
</main>

<template id="man-chess">
  <h2>Name</h2>
  <p>chess — full rules, against a friend over WhatsApp or a small minimax engine.</p>

  <h2>Rules</h2>
  <ul>
    <li>Standard chess: pieces move as they do in real chess, including <strong>castling</strong>, <strong>en passant</strong>, and <strong>pawn promotion</strong> (auto-queens).</li>
    <li>Deliver <strong>checkmate</strong> to win; the game ends in a draw on stalemate, insufficient material, or the 50-move rule.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts the game plays <strong>White</strong> and moves first.</li>
    <li>Tap a piece, tap where it goes, then <code>Send on WhatsApp</code>. Your friend opens the link, sees your last move outlined, and moves.</li>
    <li>This mode has no <strong>undo</strong>, and doesn't detect <strong>threefold repetition</strong> (draws by repeating a position) since no move history travels in the link — everything else works as normal.</li>
    <li><code>Flip board</code> is a per-device preference and isn't remembered from link to link, so Black may want to tap it after opening a link.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> one of your pieces to select it. Legal destinations are highlighted with dots (moves) or rings (captures).</li>
    <li><strong>Tap a highlighted square</strong> to move there. Tap the piece again to deselect.</li>
    <li>Switch the mode to <code>vs AI</code> to play solo. <code>Undo</code> takes back one full pair of moves there; choose <code>Easy / Normal / Hard</code> for engine strength.</li>
  </ul>

  <h2>Notes</h2>
  <p class="muted">The engine uses minimax with alpha-beta pruning and piece-square tables. At depth 3 it plays a decent casual game.</p>
</template>
