<style>
  .c4-wrap {
    width: min(560px, 100%);
    margin: 8px auto 0;
  }
  .c4-cols {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 2px;
    margin-bottom: 8px;
  }
  .c4-col-btn {
    background: transparent;
    border: 0;
    color: var(--dim);
    padding: 6px 0;
    font-size: var(--fs-lg);
    cursor: pointer;
    transition: color 0.12s, background 0.12s;
    min-height: var(--tap);
    border-radius: 8px;
  }
  @media (hover: hover) {
    .c4-col-btn:hover:not(:disabled) {
      color: var(--accent);
      background: rgba(245,184,0,0.08);
    }
  }
  .c4-col-btn:disabled { opacity: 0.2; cursor: not-allowed; }

  .c4-board {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 4px;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 6px;
    aspect-ratio: 7 / 6;
  }
  .c4-slot {
    border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  .c4-slot.p1 {
    background: var(--accent);
    border-color: var(--accent);
    animation: drop 0.28s cubic-bezier(0.5, 0, 0.2, 1);
  }
  .c4-slot.p2 {
    background: var(--accent-2);
    border-color: var(--accent-2);
    animation: drop 0.28s cubic-bezier(0.5, 0, 0.2, 1);
  }
  .c4-slot.win {
    box-shadow: 0 0 14px currentColor;
    animation: pulse 1.2s ease-in-out infinite;
  }
  .c4-slot.win.p1 { color: var(--accent); }
  .c4-slot.win.p2 { color: var(--accent-2); }
  body.g-connect-four .panel .c4-slot.last:not(.win) {
    outline: 2px dashed rgba(255,255,255,0.75);
    outline-offset: -6px;
  }
  .c4-key.p1 { color: var(--coral); }
  .c4-key.p2 { color: #f5c800; }
  @keyframes drop {
    from { transform: translateY(-200%); }
    to   { transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { filter: brightness(1); }
    50%      { filter: brightness(1.4); }
  }
  @media (prefers-reduced-motion: reduce) {
    .c4-slot.p1, .c4-slot.p2, .c4-slot.win { animation: none; }
  }

  .game-controls { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin: 8px 0 14px; }


  /* chunky look: the page turns blue while the bot thinks */
  html body.fun.g-connect-four { --fun-bg: #2f3555; --fun-btn: #5a63b8; --vs-bg: #1c2038; --vs-l: #ff7a7a; --vs-r: #3fd0c0; transition: background-color .35s; }
  html body.fun.g-connect-four:has(.turn.wait) { --fun-bg: #3d2d4f; }
  html body.fun.g-connect-four .turn { width: fit-content; max-width: 100%; box-sizing: border-box; min-height: 0; margin: 14px auto 18px; padding: 14px 20px; border-radius: 14px; font-size: 26px; }
  html body.fun.g-connect-four .turn .turn-dot { display: none; }

  html body.fun.g-connect-four .panel .c4-board { background: #2f45c4; border: 6px solid #000; border-radius: 18px; gap: 6px; padding: 8px; }
  html body.fun.g-connect-four .c4-slot { background: #1d2a85; border: 0; }
  /* shared.css fades a slot's colour in over .12s; behind the falling disc that showed the empty hole for a moment (a flash) when the disc landed */
  html body.fun.g-connect-four .panel .c4-slot { transition: none; }
  /* the fall + bounce is animated by game.js (dropAnim), not by this old short CSS drop */
  html body.fun.g-connect-four .c4-slot.p1:not(.win), html body.fun.g-connect-four .c4-slot.p2:not(.win) { animation: none; }
  html body.fun.g-connect-four .c4-slot.p1 { background: #ff4d46; } html body.fun.g-connect-four .c4-slot.p2 { background: #ffc933; }
  html body.fun.g-connect-four .panel .c4-col-btn { background: none; box-shadow: none; color: #fff; min-height: 44px; padding: 0; opacity: .9; }

<template id="man-connect-four">
  <h2>Name</h2>
  <p>connect-four — be first to connect four checkers in a line.</p>

  <h2>Rules</h2>
  <ul>
    <li>Board is 7 columns × 6 rows. Checkers drop from the top and stack from the bottom.</li>
    <li>Players alternate turns. First to align <strong>four in a row</strong> — horizontally, vertically, or diagonally — wins.</li>
    <li>If the board fills with no winner, it's a draw.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts the game is <strong>Red</strong> and drops first; your friend is <strong>Yellow</strong>.</li>
    <li>After each drop, tap <code>Send on WhatsApp</code>. Your friend opens the link, sees your checker outlined, drops theirs, and sends a link back.</li>
    <li><code>Copy link</code> works for any other messenger.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap / click</strong> the arrow above any column to drop your checker there.</li>
    <li><code>↻ new game</code> resets the board.</li>
    <li>Use the <code>Mode</code> selector to play the computer or pass-and-play locally. <code>↶ undo</code> is available in those modes.</li>
  </ul>

  <h2>Difficulty (vs computer)</h2>
  <ul>
    <li><strong>Easy</strong> — the computer searches depth 2 (1 full ply + reply). Beatable by a novice.</li>
    <li><strong>Medium</strong> — depth 4. Exploits obvious traps.</li>
    <li><strong>Hard</strong> — depth 6. Uses alpha-beta pruning and center-weighted evaluation. Tough.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Control the center column first — a checker there belongs to four winning lines. Watch for "odd threats" on row 1, 3, 5 if you move first.</p>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. Your friend joins in their browser and you play in real time, with no link-passing.</li>
    <li>If someone drops out they can rejoin with the same link. Rooms are deleted a day after the last move, or an hour after the game ends.</li>
  </ul>
</template>
