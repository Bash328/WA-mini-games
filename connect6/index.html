<style>
  .c6-wrap { width: 100%; margin: 6px 0 0; }
  .c6-board {
    display: grid;
    grid-template-columns: repeat(15, minmax(0, 1fr));
    grid-template-rows: repeat(15, minmax(0, 1fr));
    aspect-ratio: 1;
    width: calc(100% + 22px);
    margin: 4px -11px 8px;
    box-sizing: border-box;
    padding: 2.8%;
    background: #e2b96c;
    border: 6px solid #000;
    border-radius: 22px;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .25);
    overflow: hidden;
  }
  /* #board-prefixed so the shared "body[class*='g-'] .panel button" fill,
     radius, padding and chunky lip never show behind a crossing. */
  #board .c6-cell {
    position: relative;
    min-height: 0;
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: transparent;
    box-shadow: none;
    transform: none;
    filter: none;
    opacity: 1;
    font-size: 0;
    line-height: 0;
    cursor: pointer;
  }
  #board .c6-cell:hover { background: transparent; box-shadow: none; filter: none; }
  #board .c6-cell:active { transform: none; box-shadow: none; }
  #board .c6-cell:disabled { opacity: 1; cursor: default; }
  #board .c6-cell::before,
  #board .c6-cell::after {
    content: "";
    position: absolute;
    background: #4a3a1c;
    pointer-events: none;
  }
  #board .c6-cell::before { left: 0; right: 0; top: 50%; height: 1px; }
  #board .c6-cell::after { top: 0; bottom: 0; left: 50%; width: 1px; }
  #board .c6-cell.lft::before { left: 50%; }
  #board .c6-cell.rgt::before { right: 50%; }
  #board .c6-cell.top::after { top: 50%; }
  #board .c6-cell.bot::after { bottom: 50%; }
  .c6-stone { position: absolute; inset: 9%; border-radius: 50%; z-index: 1; pointer-events: none; }
  /* the five star points, until a stone covers one */
  #board .c6-cell.star:not(.b):not(.w):not(.pend) .c6-stone { inset: 40%; background: #4a3a1c; }
  #board .c6-cell.b .c6-stone {
    background: radial-gradient(circle at 35% 30%, #5c5c5c, #111 72%);
    border: 2px solid #000;
  }
  #board .c6-cell.w .c6-stone {
    background: radial-gradient(circle at 35% 30%, #fff, #e7e1d2 80%);
    border: 2px solid #000;
  }
  /* a faint stone where a click or tap would land */
  #board[data-turn="b"] .c6-cell:not(.b):not(.w):not(.pend):not(:disabled):hover .c6-stone {
    inset: 9%; background: #111; opacity: .35;
  }
  #board[data-turn="w"] .c6-cell:not(.b):not(.w):not(.pend):not(:disabled):hover .c6-stone {
    inset: 9%; background: #fff; opacity: .55;
  }
  /* the stone that is down but not sent yet: solid enough to read, ringed so it reads as a draft */
  #board .c6-cell.pend .c6-stone {
    inset: 9%;
    background: #111;
    border: 2px solid #000;
    opacity: .68;
    outline: 2px dashed #ffd34a;
    outline-offset: 1px;
  }
  #board .c6-cell.pend.pw .c6-stone { background: #fff; }
  #board .c6-cell.last .c6-stone { box-shadow: 0 0 0 3px #ff5a52; }
  #board .c6-cell.win .c6-stone { box-shadow: 0 0 0 3px #2fbf7f, 0 0 10px #2fbf7f; }
  .c6-hint {
    margin: 10px 0 0;
    min-height: 2.6em;
    text-align: center;
    color: rgba(255, 255, 255, .72);
    font-size: 14px;
    line-height: 1.3;
  }

<template id="man-connect6">
  <h2>Name</h2>
  <p>connect6 — six in a row, two stones at a time.</p>

  <h2>Rules</h2>
  <ul>
    <li>A <strong>15×15 board</strong>. Black moves first and places <strong>one stone</strong> on the opening turn.</li>
    <li>After that, <strong>every turn places two stones</strong>. They can go on any two empty points, next to each other or far apart.</li>
    <li>The first side to get <strong>six or more stones in a row</strong> — across, down or diagonally — wins. Seven or more counts just the same.</li>
    <li>A turn may place fewer than two stones only when the board is nearly full: with one empty point left that turn places one, and with two left it places both and fills the board.</li>
    <li>If the board fills with no six, it is a <strong>draw</strong>. Stones never move or get taken.</li>
    <li>This page uses 15×15 rather than the 19×19 tournament board so the points stay thumb-sized on a phone. With two stones a turn, a mis-tap is expensive, so the smaller board is the friendlier one.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap a point</strong> to put down your first stone. It shows as a dim stone with a dashed gold ring until the turn is sent.</li>
    <li><strong>Tap a second point</strong> and the whole turn plays at once. Tap the staged stone again to take it back before the second point goes down.</li>
    <li>The two stones of the last turn are ringed in red; a winning line glows green.</li>
    <li>Against the computer, pick <strong>Easy / Medium / Hard</strong> and whether you play Black (first) or White.</li>
    <li><code>undo</code> is below the board against the computer and on one device. The round arrow in the header starts a new game.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts the game is <strong>Black</strong> and places the opening stone; your friend is <strong>White</strong>.</li>
    <li>After each turn tap <code>Send on WhatsApp</code>. Your friend opens the link, sees your two stones ringed, plays their two and sends a link back.</li>
    <li><code>Copy link</code> works for any other messenger. A link opened twice shows the latest move, so a refresh never loses the game.</li>
  </ul>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. You play in real time, with no link-passing. Rooms are deleted a day after the last move, or an hour after the game ends.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Because a turn is two stones, a single threat is easy to answer: make two at once, on different lines, so one pair of stones cannot cover both. A five with two open ends can still be blocked by two stones, so the shapes that win are the ones with more than two ways to make six. Look for a point where your two stones would each complete a five, and block your opponent's pairs the same way.</p>
</template>
