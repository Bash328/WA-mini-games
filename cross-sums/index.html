<template id="man-cross-sums">
  <h2>Name</h2>
  <p>cross sums — also known as Kakuro. A crossword made of sums.</p>

  <h2>Rules</h2>
  <ul>
    <li>Fill every <strong>white square</strong> with a digit from 1 to 9.</li>
    <li>The numbers in the black squares are clues. The one at the <strong>top right</strong> is the total for the run of white squares going <strong>across</strong>; the one at the <strong>bottom left</strong> is for the run going <strong>down</strong>.</li>
    <li>The digits in a run must <strong>add up to its clue</strong>, and a digit can't <strong>repeat</strong> within a run (the same digit may appear in other runs).</li>
    <li>Every puzzle has exactly one solution. A few squares are filled in for you (the shaded ones) so it can be solved by reasoning alone.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap a white square, then a digit. When a square is selected, the line under the grid lists the ways each of its runs can be made (for example 17 in 2 squares can only be 8 + 9).</li>
    <li><code>Notes</code> turns the digit buttons into pencil marks: tap a digit to add or remove a small note. <code>Erase</code> clears a square. <code>Check</code> marks runs that already break a rule. <code>↶ undo</code> takes back your last entry.</li>
    <li>On a keyboard: type 1 to 9, Backspace to erase, arrow keys to move.</li>
    <li>The puzzle is the same for everyone each day, at each level. <code>↻ new</code> gives a random one.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Start with the runs that have only one or two ways to be made: 3 or 4 in two squares, 16 or 17 in two, 6 or 7 in three. Squares where an across run and a down run both allow only one digit are solved. Notes keep track of what's left.</p>
</template>
