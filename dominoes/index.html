<template id="man-dominoes">
  <h2>Name</h2>
  <p>dominoes — the classic draw game, a double-six set, 2 to 4 players.</p>

  <h2>Rules</h2>
  <ul>
    <li>28 tiles. With 2 or 3 players everyone takes <strong>7</strong>; with 4, <strong>5</strong>. The rest are the <strong>boneyard</strong>.</li>
    <li>The first round starts with whoever holds the <strong>highest double</strong> (or the highest tile if nobody has one); they must play it. After that the winner of the last round starts, with any tile.</li>
    <li>On your turn, play a tile with a number that matches <strong>one end</strong> of the line. If you can't, you <strong>draw</strong> from the boneyard until you can. If the boneyard is empty, you <strong>pass</strong>.</li>
    <li>The round ends when someone plays their <strong>last tile</strong>: they score all the pips left in the other players' hands. If nobody can play (a <strong>block</strong>), the player with the fewest pips left wins the round and scores the others' pips minus their own; a tie scores nothing.</li>
    <li>First to <strong>100</strong> points wins the game.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap a tile to lift it, then tap the end of the line you want it on (<code>Left</code> or <code>Right</code>). If a tile fits only one end, tap it twice. If a tile doesn't fit, you'll be told why.</li>
    <li><code>Draw</code> and <code>Pass</code> appear when they're your only choice. Against the computer, pick <strong>Easy / Medium / Hard</strong> and 1 to 3 computer players.</li>
  </ul>

  <h2>Playing online</h2>
  <ul>
    <li>Tap <strong>Online room</strong>, create a room and send the invite link. Up to 4 seats, and the host can add computer players to fill them.</li>
    <li>The server shuffles and deals and holds everyone's tiles: your browser is only ever sent your own. If you drop out for 90 seconds a computer plays for you until you come back.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Play your heavy tiles and doubles early (they cost the most if you get stuck), keep a spread of numbers so you always have a move, and watch what your opponents draw or pass on: they have none of that number.</p>
</template>
