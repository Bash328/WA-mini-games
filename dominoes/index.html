  .dm-opps { display: grid; grid-template-columns: repeat(auto-fit, minmax(104px, 1fr)); gap: 8px; margin: 8px 0; }
  .dm-opp { padding: 8px; border: 1px solid var(--border); border-radius: 12px; background: var(--bg-2); text-align: center; min-height: 82px; }
  .dm-opp.act { border-color: var(--accent); }
  .dm-opp .nm { font-weight: 600; font-size: var(--fs-sm); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dm-opp .st { font-size: 11px; color: var(--muted); min-height: 1.3em; }
  .dm-opp .st.warn { color: var(--coral); }
  .dm-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 3px; margin-top: 4px; }
  /* a domino: two halves, each a 3x3 grid of pips. Horizontal by default; .v stands it up (doubles in the line). --u is the half's size. */
  .dm { --u: 30px; display: inline-flex; flex-direction: row; background: #fbf7ee; border: 1px solid #cdbfa3; border-radius: 6px; box-shadow: 0 1px 2px rgba(0,0,0,.3); padding: 0; position: relative; box-sizing: content-box; }
  .dm.v { flex-direction: column; }
  .dm .h { width: var(--u); height: var(--u); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: calc(var(--u) * .14); box-sizing: border-box; }
  .dm .h i { border-radius: 50%; margin: 8%; }
  .dm .h i.on { background: #1d1a16; }
  .dm::after { content: ""; position: absolute; background: #cdbfa3; }
  .dm:not(.v)::after { left: 50%; top: 14%; bottom: 14%; width: 1px; }
  .dm.v::after { top: 50%; left: 14%; right: 14%; height: 1px; }
  .dm.back { background: repeating-linear-gradient(45deg, #6b3fb5, #6b3fb5 4px, #5a3299 4px, #5a3299 8px); border-color: #3d2270; }
  .dm.back .h { visibility: hidden; }
  .dm.sm { --u: 14px; border-radius: 3px; }
  .dm.md { --u: 22px; border-radius: 4px; }
  .dm.end { outline: 2px solid var(--accent); outline-offset: 1px; }
  .dm.hit { outline: 3px solid #2fbf7f; }
  .dm-line { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 3px; margin: 8px 0; padding: 10px; min-height: 76px; border: 1px solid var(--border-hi); border-radius: 14px; background: color-mix(in srgb, #2a6b4a 35%, var(--panel-2)); }
  .dm-line .note { color: var(--muted); font-size: var(--fs-sm); }
  .dm-info { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; font-size: var(--fs-sm); color: var(--muted); margin: 4px 0; }
  .dm-banner { text-align: center; margin: 8px 0; padding: 9px 12px; border-radius: 12px; border: 1px solid var(--border-hi); background: var(--bg-2); font-size: var(--fs-md); font-weight: 600; min-height: 42px; display: flex; align-items: center; justify-content: center; }
  .dm-banner.you { border-color: var(--accent); color: var(--accent); }
  .dm-log { text-align: center; color: var(--muted); font-size: var(--fs-sm); min-height: 2.6em; margin: 2px 0 6px; }
  .dm-hand { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 8px 0; min-height: 40px; }
  body.g-dominoes .panel .dm-tile { padding: 0; min-height: 0; min-width: 0; background: transparent; border: 0; border-radius: 0; box-shadow: none; }
  body.g-dominoes .panel .dm-tile .dm { --u: 34px; }
  body.g-dominoes .panel .dm-tile.sel .dm { outline: 3px solid var(--accent); outline-offset: 2px; transform: translateY(-6px); }
  body.g-dominoes .panel .dm-tile.dim .dm { opacity: .55; }
  .dm-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; min-height: 46px; }

  .dm-hint { text-align: center; color: var(--muted); font-size: var(--fs-sm); min-height: 1.6em; margin-top: 6px; }
  #dm { display: none; }
  #dm.on { display: block; }

<template id="man-dominoes">
  <h2>Name</h2>
  <p>dominoes — the classic draw game, a double-six set, 2 to 4 players.</p>

  <h2>Rules</h2>
  <ul>
    <li>28 tiles. With 2 or 3 players everyone takes <strong>7</strong>; with 4, <strong>5</strong>. The rest are the <strong>boneyard</strong>.</li>
    <li>The first round starts with whoever holds the <strong>highest double</strong> (or the highest tile if nobody has one); they must play it. After that the winner of the last round starts, with any tile.</li>
    <li>On your turn, play a tile with a number that matches <strong>one end</strong> of the line. If you can't, you <strong>draw</strong> from the boneyard until you can. If the boneyard is empty, you <strong>pass</strong>.</li>
    <li>The round ends when someone plays their <strong>last tile</strong>: they score all the pips left in the other players' hands. If nobody can play (a <strong>block</strong>), the player with the fewest pips left wins the round and scores the others' pips minus their own; a tie scores nothing.</li>
    <li>First to <strong>100</strong> points wins the game.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap a tile to lift it, then tap the end of the line you want it on (<code>Left</code> or <code>Right</code>). If a tile fits only one end, tap it twice. If a tile doesn't fit, you'll be told why.</li>
    <li><code>Draw</code> and <code>Pass</code> appear when they're your only choice. Against the computer, pick <strong>Easy / Medium / Hard</strong> and 1 to 3 computer players.</li>
  </ul>

  <h2>Playing online</h2>
  <ul>
    <li>Tap <strong>Online room</strong>, create a room and send the invite link. Up to 4 seats, and the host can add computer players to fill them.</li>
    <li>The server shuffles and deals and holds everyone's tiles: your browser is only ever sent your own. If you drop out for 90 seconds a computer plays for you until you come back.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Play your heavy tiles and doubles early (they cost the most if you get stuck), keep a spread of numbers so you always have a move, and watch what your opponents draw or pass on: they have none of that number.</p>
</template>
