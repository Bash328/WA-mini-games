<style>
  .db-board {
    display: grid;
    grid-template-columns: 10px repeat(4, 1fr 10px);
    grid-template-rows: 10px repeat(4, 1fr 10px);
    width: min(420px, 100%);
    aspect-ratio: 1;
    margin: 8px auto;
    background: var(--bg-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    padding: 6px;
  }
  .db-cell { display: flex; align-items: center; justify-content: center; min-width: 0; min-height: 0; }
  .db-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }
  /* #board-prefixed (an id) to reliably beat the shared, higher-specificity
     "body[class*='g-'] .panel button" rule elsewhere, which was otherwise
     forcing every edge to a 40px min-height (only horizontal ones showed
     it, since vertical ones size via height:100% instead) and painting
     over the drawn/last background colors regardless of state. */
  #board .db-edge { border: 0; padding: 0; cursor: pointer; background: transparent; border-radius: 3px; min-height: 0; min-width: 0; }
  #board .db-h { width: 100%; height: 6px; background: var(--border-hi); }
  #board .db-v { width: 6px; height: 100%; background: var(--border-hi); }
  #board .db-edge:disabled { cursor: default; }
  #board .db-edge:not(.drawn):not(:disabled):hover { background: var(--border-hi); }
  /* Drawn edges are disabled buttons, which the shared CSS fades; keep them solid. */
  #board .db-edge.drawn, #board .db-edge.drawn:disabled { background: var(--fg); opacity: 1; }
  /* each player's lines in their own colour (same colours as their boxes) */
  #board .db-edge.drawn.p1, #board .db-edge.drawn.p1:disabled { background: var(--p1); }
  #board .db-edge.drawn.p2, #board .db-edge.drawn.p2:disabled { background: var(--p2); }
  /* the most recent line is ringed, so it still reads as "last" in either colour */
  #board .db-edge.last, #board .db-edge.last:disabled { opacity: 1; box-shadow: 0 0 0 2px #f5c800; position: relative; z-index: 1; }
  #board .db-edge.last:not(.p1):not(.p2) { background: #f5c800; }
  .db-boxcell { border-radius: 2px; }
  /* Claimed boxes use the shared bright player colours (--p1 / --p2) and
     carry the player's number, so ownership never relies on colour alone. */
  .db-boxcell.owned { font-weight: 700; font-size: clamp(0.9rem, 4.5vw, 1.4rem); color: #1a1715; }
  .db-boxcell.owned.p1 { background: var(--p1); }
  .db-boxcell.owned.p2 { background: var(--p2); }
  .db-boxcell.owned.p1::after { content: "1"; }
  .db-boxcell.owned.p2::after { content: "2"; }
  #score .sc { font-weight: 700; }
  #score .sc.p1 { color: var(--p1); }
  #score .sc.p2 { color: var(--p2); }

  /* chunky look: full-width card, big black dots, turn pill. All colours are variables so a palette is one block. */
  body.fun.g-dots-and-boxes {
    --d-bg1: #2f3555; --d-bg2: #3d2d4f;          /* page: Player 1's move / Player 2's move */
    --d-vs1: #1c2038; --d-vs2: #28193a;          /* score bar */
    --d-board1: #e9e6f2; --d-board2: #efe6f0;    /* the card the dots sit on */
    --d-p1: #ff7a7a; --d-p2: #3fd0c0; --fun-btn: #5a63b8; --fun-chip: rgba(255,255,255,.1);  /* each player's lines and boxes */
    --fun-bg: var(--d-bg1); --vs-bg: var(--d-vs1); --vs-l: var(--d-p1); --vs-r: var(--d-p2);
    transition: background-color .35s;
  }
  body.fun.g-dots-and-boxes:has(.turn[data-p="2"]:not([hidden])) { --fun-bg: var(--d-bg2); --vs-bg: var(--d-vs2); }
  .db-board {
    grid-template-columns: 13px repeat(4, 1fr 13px); grid-template-rows: 13px repeat(4, 1fr 13px);
    width: calc(100% + 22px); margin: 8px -11px 0; padding: 22px 20px; box-sizing: border-box; max-width: none;
    background: var(--d-board1); border: 0; border-radius: 42px; transition: background-color .35s;
  }
  body.fun.g-dots-and-boxes:has(.turn[data-p="2"]:not([hidden])) #board { background: var(--d-board2); }
  #board .db-h { height: 13px; background: #fff; } #board .db-v { width: 13px; background: #fff; }
  #board .db-edge { border-radius: 6px; box-shadow: none; }
  .db-dot { width: 25px; height: 25px; background: #000; z-index: 2; position: relative; flex: none; }
  /* drawn lines are dark; the colour shows in the boxes people win */
  #board .db-edge.drawn, #board .db-edge.drawn:disabled,
  #board .db-edge.drawn.p1, #board .db-edge.drawn.p1:disabled,
  #board .db-edge.drawn.p2, #board .db-edge.drawn.p2:disabled { background: #2a2a33; }
  /* the latest line is ringed so it still stands out */
  #board .db-edge.drawn.last, #board .db-edge.drawn.last:disabled { box-shadow: 0 0 0 3px rgba(0,0,0,.45); position: relative; z-index: 1; }
  .db-boxcell.owned { font-size: 0; }
  .db-boxcell.owned.p1 { background: var(--d-p1); } .db-boxcell.owned.p2 { background: var(--d-p2); }
  .db-boxcell.owned::after { content: none !important; }

</style>

<template id="man-dots-and-boxes">
  <h2>Name</h2>
  <p>dots and boxes — draw lines, claim boxes.</p>

  <h2>Rules</h2>
  <ul>
    <li>A grid of dots, from 3×3 up to 6×6 boxes (4×4 is the default). The player who makes the first move picks the size with the <strong>Board size</strong> menu; it is locked once play starts. On your turn, draw one line between two adjacent dots.</li>
    <li>If your line completes the 4th side of a box (or two boxes at once, when a line borders both), you claim it — and you <strong>go again</strong>.</li>
    <li>When every line is drawn, whoever claimed more boxes wins. Equal counts are a draw.</li>
  </ul>

  <h2>Two players over WhatsApp</h2>
  <ul>
    <li>Whoever starts is <strong>Player 1</strong>.</li>
    <li>Tap a line to draw it. If it completes a box, you'll see "keep going" and can draw another line immediately — nothing is sent until your turn actually ends.</li>
  </ul>

  <h2>Same device</h2>
  <p class="muted">Pass the device when a turn ends (no completed box). A completed box keeps the same player going, same as over WhatsApp.</p>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> any undrawn line segment between two dots.</li>
  </ul>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. Your friend joins in their browser and you play in real time, with no link-passing.</li>
    <li>If someone drops out they can rejoin with the same link. Rooms are deleted a day after the last move, or an hour after the game ends.</li>
  </ul>
</template>
