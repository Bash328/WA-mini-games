<style>
  /* ---- the board: a cream field of points on a dark wooden frame ---- */
  .fn-wrap { width: 100%; margin: 6px 0 0; }
  .fn-board {
    width: calc(100% + 22px);
    margin: 4px -11px 8px;
    box-sizing: border-box;
    padding: 7px;
    background: #14251f;
    border-radius: 14px;
    box-shadow: 0 4px 0 rgba(0, 0, 0, .25);
  }
  #board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(9, minmax(0, 1fr));
    grid-template-rows: repeat(5, minmax(0, 1fr));
    aspect-ratio: 9 / 5;
    width: 100%;
    box-sizing: border-box;
    background: #f2e1bd;
    border-radius: 7px;
    overflow: hidden;
  }
  #board .fn-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #board .fn-lines line { stroke: #7d674a; stroke-width: .05; stroke-linecap: round; opacity: .8; }
  #board .fn-pt {
    position: relative;
    width: 100%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: transparent;
    box-shadow: none;
    transform: none;
    font-size: 0;
    opacity: 1;
    cursor: default;
  }
  /* the empty points, so the grid of intersections reads before a piece lands */
  #board .fn-pt::before {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 5px;
    height: 5px;
    margin: -2.5px 0 0 -2.5px;
    border-radius: 50%;
    background: rgba(96, 74, 48, .35);
    pointer-events: none;
  }
  #board .fn-pt.mine, #board .fn-pt.dest { cursor: pointer; }
  #board .fn-pt:disabled { opacity: 1; cursor: default; }
  #board .fn-pt:focus-visible { outline: 2px solid #ffbf2e; outline-offset: -3px; }
  #board .fn-pt.from { box-shadow: inset 0 0 0 2px rgba(64, 96, 76, .35); }
  #board .fn-pt.last { box-shadow: inset 0 0 0 3px rgba(214, 148, 20, .7); }
  /* a piece that can make a compulsory capture: a thin gold ring, quieter than the selection ring */
  #board .fn-pt[data-can] { box-shadow: inset 0 0 0 2px rgba(255, 191, 46, .75); }
  #board .fn-pt.sel { box-shadow: inset 0 0 0 3px #ffbf2e; }
  #board .fn-pt.dest::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 24%;
    height: 24%;
    margin: -12% 0 0 -12%;
    border-radius: 50%;
    background: #2f7d5c;
    pointer-events: none;
    z-index: 3;
  }
  #board .fn-pt.cap::after {
    width: 72%;
    height: 72%;
    margin: -36% 0 0 -36%;
    background: transparent;
    border: 3px solid #d99412;
    box-sizing: border-box;
  }
  /* a step where both the line ahead and the line behind can be taken */
  #board .fn-pt[data-both]::after { background: radial-gradient(circle, #d99412 0 22%, transparent 27%); }
  #board .fn-pc {
    position: absolute;
    inset: 11%;
    border-radius: 50%;
    box-sizing: border-box;
    border: 2px solid #16241d;
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, .3), 0 2px 0 rgba(0, 0, 0, .3);
    pointer-events: none;
    z-index: 2;
  }
  #board .fn-pc.p1 { background: radial-gradient(circle at 36% 30%, #ff9b8f, #e05348 78%); }
  #board .fn-pc.p2 { background: radial-gradient(circle at 36% 30%, #7ce8dc, #23a99c 78%); }
  .fn-hint {
    margin: 10px 0 0;
    min-height: 2.6em;
    text-align: center;
    color: rgba(255, 255, 255, .72);
    font-size: 14px;
    line-height: 1.3;
  }

<template id="man-fanorona">
  <h2>Name</h2>
  <p>fanorona &mdash; the Malagasy game of lines, approaches and withdrawals, on a 9 by 5 board.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each side starts with <strong>22 pieces</strong>. Blue holds the top two rows and the alternate middle points that begin on the left; Red holds the bottom two rows and the other four middle points. The centre point is empty, and <strong>Red moves first</strong>.</li>
    <li>A piece moves <strong>one point along a marked line</strong> onto an empty point. Rows and columns are lines everywhere. Diagonals are lines only at the alternate points where they are drawn: at those points a piece can also step diagonally, at the others only up, down, left or right.</li>
    <li><strong>Capturing is compulsory.</strong> If any capture is available, only capturing moves are allowed. Pieces that can make one are ringed in gold.</li>
    <li><strong>Approach:</strong> move to an empty point with enemy pieces on the line just beyond it. <strong>Withdrawal:</strong> move away from enemy pieces that were on the line just behind the point it left. In either case the whole unbroken line is taken, up to an empty point, your own piece, or the edge of the board.</li>
    <li>If both lines are open on the same step, only one line is taken: two buttons appear and you choose <strong>ahead</strong> or <strong>behind</strong>.</li>
    <li><strong>Chain captures:</strong> after a capture, if the same piece can capture again it does, and your turn continues with that piece. The turn ends when it has no capture left. The piece stays selected for the next jump.</li>
    <li><strong>Win</strong> by leaving your opponent with no pieces or no legal move. So a link can never loop forever, <strong>60 turns in a row without a capture</strong> end the game in a draw.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap one of your pieces, then tap a marked point. A dot is a step; <strong>a ring takes a line</strong>; a ring with a dot in it offers both directions.</li>
    <li>Tap the piece again, or tap empty space, to let it go.</li>
    <li>The point a piece came from and the point it reached stay marked in amber. A gold ring on a piece means it must capture.</li>
    <li>Against the computer, pick <strong>Easy / Medium / Hard</strong> and whether you play Red (first) or Blue.</li>
    <li><code>undo</code> sits below the board against the computer and on one device; it takes back your whole turn, chain included. The round arrow in the header always starts a new game.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts the game is <strong>Red</strong>; your friend is <strong>Blue</strong>.</li>
    <li>After your turn tap <code>Send on WhatsApp</code>. Your friend opens the link, moves and sends one back. <code>Copy link</code> works for any other messenger.</li>
    <li>A chain captures on the same turn: the link updates after each jump, so <strong>send it once the chain has finished</strong>. Opening it twice shows the latest jump.</li>
  </ul>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. You play in real time, with no link-passing. Rooms are deleted a day after the last move, or an hour after the game ends.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">The points with diagonal lines are worth more: a piece there has up to eight ways out. Look for a piece that can start a chain, and remember that a compulsory capture can be a trap &mdash; sometimes the only capture on the board pulls your piece out of the line you were holding. Neighbouring pieces cover each other; a long unbroken line is a gift to your opponent.</p>
</template>
