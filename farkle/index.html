<template id="man-farkle">
  <h2>Name</h2>
  <p>farkle — also called 10,000. Six dice, a score to chase, and one bad roll between you and the lot.</p>

  <h2>Rules</h2>
  <ul>
    <li>On your turn, <strong>roll</strong> the dice in play. After a roll you must <strong>set aside at least one scoring die</strong> (tap the dice, then <strong>Keep</strong>).</li>
    <li>Then either <strong>bank</strong> the turn's points into your score, or <strong>roll</strong> the dice that are left.</li>
    <li>A roll with <strong>no scoring die at all</strong> is a <strong>farkle</strong>: the turn's points are lost and the dice pass on.</li>
    <li>Set aside all six and it is <strong>hot dice</strong>: all six are rolled again and your turn continues.</li>
    <li>The first player to bank <strong>10,000</strong> or more wins.</li>
  </ul>

  <h2>Scoring</h2>
  <ul>
    <li><strong>1</strong> = 100, <strong>5</strong> = 50.</li>
    <li><strong>Three 1s</strong> = 1,000. <strong>Three 2s to 6s</strong> = 200 to 600 (the face × 100).</li>
    <li><strong>Four of a kind</strong> = 1,000, <strong>five</strong> = 2,000, <strong>six</strong> = 3,000.</li>
    <li><strong>A straight 1 to 6</strong> = 1,500. <strong>Three pairs</strong> = 1,500.</li>
    <li>A kept set has to score all through: you cannot tuck a 2 or a 3 in with a 1 to get it off the table.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Roll</strong> starts the turn and rolls the rest. When the dice are down, tap the scoring ones and press <strong>Keep</strong>.</li>
    <li><strong>Bank</strong> adds the turn's score to your total and ends the turn. It is only available after you have kept at least one die.</li>
    <li>Against the computer, choose 2 to 4 players and <strong>Easy / Medium / Hard</strong> in Options.</li>
  </ul>

  <h2>Playing online</h2>
  <ul>
    <li>Choose <strong>Online room</strong>, create a room and send the invite link. Up to four seats; the host can fill any with computer players and start the game.</li>
    <li>The server rolls every die and keeps the game: a phone only ever sends "roll", "keep these" or "bank". If you drop out for 90 seconds a computer plays your seat until you come back.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Keep every scoring die most of the time — it leaves fewer dice to farkle. Bank earlier when only a die or two would be rolled, and push harder when you are behind and someone is close to 10,000.</p>
</template>
