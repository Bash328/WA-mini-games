<template id="man-flow-free">
  <h2>Name</h2>
  <p>flow free — join every pair of dots and fill the whole grid with pipes.</p>

  <h2>Rules</h2>
  <ul>
    <li>Every colour has <strong>two dots</strong>. Draw one pipe from one dot to the other.</li>
    <li>A pipe runs between <strong>neighbouring cells</strong> (up, down, left or right) and may not pass through another pipe or another colour's dot.</li>
    <li>Join <strong>every pair</strong>, and use <strong>every cell</strong> of the grid. No cell is left empty and no pipe crosses another.</li>
    <li>Every board has a solution. Most have only one; the daily board is the same for everyone at each size.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Drag from a dot through the cells to its twin. Letting go part-way leaves the pipe there so you can carry on.</li>
    <li>Or tap a dot, then tap the cells one at a time to extend the pipe, and tap the twin dot to finish it.</li>
    <li>Tap a dot or a pipe to <strong>lift</strong> it (erase that colour). Drag from a pipe's middle to re-route it from that cell.</li>
    <li><code>Hint</code> shows one pair's route from the answer. <code>Undo</code> takes back the last stroke. <code>Restart</code> puts the same board back. The round arrow at the top starts a new random board; <code>Random</code> inside Options does the same.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Start with the pair whose route has the fewest choices, often one that has to hug an edge. Keep new pipes out of corners that another colour will need, and when two pairs compete for the last free cells, undo and route the longer one first.</p>
</template>
