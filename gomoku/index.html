<style>
  .gm-wrap { width: min(560px, 100%); margin: 8px auto 0; }
  /* The board: a wooden grid, one button per crossing. #board-prefixed to beat the
     shared "body[class*='g-'] .panel button" rule (background, radius, 40px min-height). */
  .gm-board {
    display: grid;
    grid-template-columns: repeat(15, minmax(0, 1fr)); grid-template-rows: repeat(15, minmax(0, 1fr));
    aspect-ratio: 1;
    padding: 2.2%;
    background: #d9b062;
    border: 1px solid #a07c3a;
    border-radius: var(--r-md);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25);
  }
  #board .gm-cell {
    position: relative; background: transparent; border: 0; border-radius: 0; padding: 0;
    min-height: 0; min-width: 0; cursor: pointer;
  }
  #board .gm-cell:hover { background: transparent; border: 0; }
  #board .gm-cell::before, #board .gm-cell::after { content: ""; position: absolute; background: #5b4524; pointer-events: none; }
  #board .gm-cell::before { left: 0; right: 0; top: 50%; height: 1px; }
  #board .gm-cell::after  { top: 0; bottom: 0; left: 50%; width: 1px; }
  #board .gm-cell.lft::before { left: 50%; }
  #board .gm-cell.rgt::before { right: 50%; }
  #board .gm-cell.top::after  { top: 50%; }
  #board .gm-cell.bot::after  { bottom: 50%; }
  .gm-stone { position: absolute; inset: 9%; border-radius: 50%; z-index: 1; pointer-events: none; }
  /* the five star points */
  #board .gm-cell.star:not(.b):not(.w) .gm-stone { inset: 38%; background: #5b4524; }
  #board .gm-cell.b .gm-stone { background: radial-gradient(circle at 35% 30%, #6b6b6b, #121212 70%); box-shadow: 0 1px 2px rgba(0,0,0,0.5); }
  #board .gm-cell.w .gm-stone { background: radial-gradient(circle at 35% 30%, #ffffff, #d4cfc2 80%); border: 1px solid #8f8777; box-shadow: 0 1px 2px rgba(0,0,0,0.35); }
  /* a faint stone where a click or a first tap would land */
  #board[data-turn="b"] .gm-cell:not(.b):not(.w):not(:disabled):hover .gm-stone,
  #board[data-turn="b"] .gm-cell.sel .gm-stone { inset: 9%; background: #121212; opacity: 0.4; }
  #board[data-turn="w"] .gm-cell:not(.b):not(.w):not(:disabled):hover .gm-stone,
  #board[data-turn="w"] .gm-cell.sel .gm-stone { inset: 9%; background: #ffffff; opacity: 0.6; }
  #board .gm-cell.sel .gm-stone { opacity: 0.75; outline: 2px dashed #5b4524; outline-offset: 2px; }
  #board .gm-cell.last .gm-stone { box-shadow: 0 0 0 2px #e8453c; }
  #board .gm-cell.win .gm-stone { box-shadow: 0 0 0 3px #2fbf7f, 0 0 10px #2fbf7f; }
  #board .gm-cell:disabled { cursor: default; }
  .gm-hint { margin: 10px 0 0; text-align: center; color: var(--muted); font-size: var(--fs-sm); }
</style>

    </div>
  </div>
</main>

<template id="man-gomoku">
  <h2>Name</h2>
  <p>gomoku — be first to line up five stones.</p>

  <h2>Rules</h2>
  <ul>
    <li>A 15×15 board. <strong>Black</strong> goes first; players take turns placing one stone on any empty crossing.</li>
    <li>The first to get <strong>five or more in a row</strong> — across, down or diagonally — wins.</li>
    <li>If the board fills with no five, it's a draw. Stones never move or get captured.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts the game is <strong>Black</strong> and places first; your friend is <strong>White</strong>.</li>
    <li>After each stone, tap <code>Send on WhatsApp</code>. Your friend opens the link, sees your last stone ringed in red, places theirs and sends a link back.</li>
    <li><code>Copy link</code> works for any other messenger.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>On a computer, click a crossing. On a phone, <strong>tap once to preview</strong> the stone and <strong>tap again to place it</strong>, so a fat finger never misplaces one.</li>
    <li>Use the mode menu to play the computer or share one device. <code>↶ undo</code> is there in those modes (against the computer it takes back your move and its reply).</li>
    <li>Against the computer, pick <strong>Easy / Medium / Hard</strong> and whether you play Black or White.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Black has the edge in this free-style version, so White must defend early. Build an <em>open three</em> (three in a row with both ends free): the opponent has to block at once, and two at the same time can't both be blocked.</p>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. Your friend joins in their browser and you play in real time, with no link-passing.</li>
    <li>If someone drops out they can rejoin with the same link. Rooms are deleted a day after the last move, or an hour after the game ends.</li>
  </ul>
</template>
