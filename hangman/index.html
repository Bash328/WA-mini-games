<style>
  #word {
    font-size: clamp(1.6rem, 7vw, 2.6rem);
    font-weight: 700;
    letter-spacing: 0.15em;
    text-align: center;
    margin: 18px 0 6px;
    word-break: break-all;
  }
  #misses { text-align: center; color: var(--muted); font-size: var(--fs-sm); margin-bottom: 10px; }
  #setup { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 16px 0; }
  #setup input {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    padding: 10px 12px;
    font-family: inherit;
    font-size: var(--fs-lg); /* 16px: anything smaller makes iOS Safari zoom in on focus and stay zoomed */
    min-height: var(--tap);
    text-align: center;
    text-transform: uppercase;
    width: min(280px, 100%);
  }
  #setup-error { color: var(--bad, #e35b5b); font-size: var(--fs-sm); min-height: 1.2em; }
  .hm-keyboard {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    width: min(420px, 100%);
    margin: 10px auto;
  }
  /* #keyboard-prefixed to beat the shared "body[class*='g-'] .panel
     button" rule (specificity 0-2-1 vs a plain class at 0-1-0 / 0-2-0),
     which was otherwise forcing a 10px radius instead of the intended
     3px and painting over the hit/miss highlight colors — same fix as
     dots-and-boxes's #board .db-edge. */
  #keyboard .hm-key {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--fg);
    font-family: inherit;
    font-weight: 700;
    padding: 8px 0;
    cursor: pointer;
    min-height: var(--tap);
  }
  .hm-key:disabled { cursor: default; }
  #keyboard .hm-key.hit { background: rgba(60,180,100,0.3); border-color: rgba(60,180,100,0.6); }
  #keyboard .hm-key.miss { background: rgba(200,60,60,0.25); border-color: rgba(200,60,60,0.55); opacity: 0.7; }


  /* chunky look: charcoal page, red gallows that fills in with every miss, grey keys */
  html body.fun.g-hangman { --fun-bg: #1c1d20; --fun-btn: #9a938e; --fun-chip: rgba(255,255,255,.09); }
  /* the stick man is the only one who taunts: no taunt strip on this page */
  html body.fun[data-fun-zone].g-hangman .panel .gk-slot { display: none !important; }
  /* when the man runs out of chances, his ghost floats up beside him and says the last line */
  html body.fun.g-hangman .hm-stage { position: relative; }
  /* the man's ghost (a round head, a wavy tail) leaves his body, and more spirits keep rising out of him */
  html body.fun.g-hangman .hm-ghosts { position: absolute; left: 0; top: 0; width: min(190px, 46%); aspect-ratio: 1; z-index: 2; pointer-events: none; }
  html body.fun.g-hangman .hm-ghosts[hidden] { display: none; }
  html body.fun.g-hangman .hm-g { position: absolute; transform: translateX(-50%); overflow: visible; filter: drop-shadow(0 0 7px rgba(255,255,255,.5)); }
  html body.fun.g-hangman .hm-g.big { left: 93%; top: 6%; width: 32px; height: 78px; transform: translateX(-50%); animation: hm-drift 2.6s ease-in-out infinite; }
  /* he floats beside the man, upright */
  @keyframes hm-drift { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) {
    html body.fun.g-hangman .hm-g,
    #man, .hm-eye, .hm-sweat, .hm-bubble, .hm-bubble::before, #hm-dust, #hm-dust-land, #hm-spark,
    .hm-gallows .pt, .hm-gallows .pt.on, #rope { animation: none !important; }
    .hm-stage .hm-face, .hm-stage .hm-skin { transition: none; }
    .hm-gallows .pt.on { stroke-dashoffset: 0; }
    .hm-stage[data-mood="saved"] .pt { opacity: 1; visibility: visible; stroke-dashoffset: 0; }
    .hm-stage[data-mood="saved"] #rope { transform: scaleY(.04); opacity: 0; }
    #hm-dust-land, #hm-spark { opacity: 0; }
    .hm-stage[data-mood="terrified"] #man { transform: none; }
    .hm-stage[data-mood="saved"] #man { transform: translateY(22px); }
    .hm-stage[data-mood="dead"] #man { transform: rotate(2.8deg) translateY(2px); }
  }
  html body.fun.g-hangman .hm-bubble.ghost { background: #e9e4f7; }
  html body.fun.g-hangman .hm-bubble.ghost::before { border-right-color: #e9e4f7; }
  @keyframes hm-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  html body.fun.g-hangman .hm-stage { display: flex; align-items: flex-start; gap: 6px; margin: 2px 0 0; }
  html body.fun.g-hangman .hm-gallows { display: block; flex: 0 0 auto; width: min(190px, 46%); aspect-ratio: 1; margin: 0; }
  /* the hanged man talks: a speech bubble to the right of the gallows, tail pointing at his head */
  html body.fun.g-hangman .hm-bubble { position: relative; flex: 1 1 0; min-width: 0; align-self: flex-start; margin: 4% 0 0 14px; padding: 12px 14px; border-radius: 20px; background: #fff; color: #2b2d33; font-size: 18px; line-height: 1.25; text-wrap: balance; animation: hm-pop .26s ease-out; }
  html body.fun.g-hangman .hm-bubble::before { content: ""; position: absolute; left: -12px; top: 22px; border: 8px solid transparent; border-right: 14px solid #fff; border-left: 0; }
  html body.fun.g-hangman .hm-bubble[hidden] { display: none; }
  html body.fun.g-hangman .hm-bubble.beg { background: #ffe9a8; animation: hm-pop .26s ease-out, hm-beg 2.4s ease-in-out .28s infinite; }
  html body.fun.g-hangman .hm-bubble.beg::before { border-right-color: #ffe9a8; }
  .hm-stage[data-mood="terrified"] .hm-bubble::before { animation: hm-tail .16s linear infinite alternate; }
  @keyframes hm-pop { 0% { transform: scale(.82) translateY(3px); opacity: 0; } 65% { transform: scale(1.03) translateY(0); opacity: 1; } 100% { transform: scale(1); } }
  @keyframes hm-beg { 0%, 100% { transform: translateX(0) rotate(0); } 25% { transform: translateX(-1px) rotate(-.3deg); } 75% { transform: translateX(1px) rotate(.3deg); } }
  @keyframes hm-tail { from { transform: translateY(-1px); } to { transform: translateY(1px); } }
  /* ---- the man himself: drawn on, breathing, reacting, and pulling faces ---- */
  .hm-gallows { touch-action: manipulation; cursor: default; outline: none; }
  .hm-stage[data-head="1"] .hm-gallows { cursor: pointer; }
  .hm-gallows[aria-disabled="true"] { cursor: default; }
  .hm-gallows:focus-visible { outline: 2px solid #fff; outline-offset: 4px; border-radius: 14px; }
  .hm-gallows .fr { stroke: #e2403a; stroke-width: 7; stroke-linecap: round; fill: none; }
  .hm-gallows .ground { stroke: #8a5a3c; stroke-width: 7; stroke-linecap: round; }
  #rope { stroke: #e2403a; stroke-width: 7; stroke-linecap: round; fill: none; transform-box: view-box; transform-origin: 128px 18px; }
  #hm-shadow { fill: #000; opacity: .12; transform-box: fill-box; transform-origin: center; transition: opacity .3s ease, transform .3s ease; }
  #hm-outline { stroke: #fff; stroke-width: 4; stroke-linecap: round; fill: none; stroke-dasharray: 4 7; opacity: 0; transition: opacity .25s ease; }
  .hm-stage[data-misses="0"] #hm-outline { opacity: .13; }
  .hm-gallows .pt { stroke: #fff; stroke-width: 6; stroke-linecap: round; fill: none; opacity: 0; visibility: hidden; stroke-dasharray: var(--len, 100); stroke-dashoffset: var(--len, 100); }
  .hm-gallows .pt.on { opacity: 1; visibility: visible; animation: hm-draw .34s ease-out forwards; }
  @keyframes hm-draw { to { stroke-dashoffset: 0; } }
  .hm-gallows .hm-head-pt { stroke-width: 5.4; transform: rotate(-90deg); transform-box: fill-box; transform-origin: center; }   /* the ring is drawn from the top, clockwise */
  .hm-skin { fill: #fff1d6; opacity: 0; transition: opacity .25s ease .3s; }                                   /* the face fills in once the ring is drawn */
  .hm-stage:not([data-misses="0"]) .hm-skin, .hm-stage[data-mood="saved"] .hm-skin { opacity: 1; }
  #man { transform-box: view-box; transform-origin: 128px 40px; animation: hm-breathe 5.4s ease-in-out infinite; }
  @keyframes hm-breathe { 0%, 100% { transform: rotate(-.35deg); } 50% { transform: rotate(.35deg); } }

  .hm-face { opacity: 0; transition: opacity .2s ease .32s; }
  .hm-stage:not([data-misses="0"]) .hm-face { opacity: 1; }
  .hm-stage[data-mood="saved"] .hm-face { opacity: 1; }
  .hm-eye { transform-box: fill-box; transform-origin: center; animation: hm-blink 5.6s infinite; }
  .hm-eye-white { fill: #fff; stroke: #2b2d33; stroke-width: 1.7; }
  .hm-pupil { fill: #2b2d33; transform: translate(var(--look-x, 0px), var(--look-y, 0px)); transition: transform .18s ease-out; }
  @keyframes hm-blink { 0%, 91%, 100% { transform: scaleY(1); } 93%, 95% { transform: scaleY(.12); } }
  .hm-eyes { transform-box: fill-box; transform-origin: center; transition: transform .2s ease; }
  .hm-brows { opacity: 0; stroke: #2b2d33; stroke-width: 2.7; stroke-linecap: round; fill: none; transition: opacity .2s ease; }
  .hm-brows-raised, .hm-brows-angry, .hm-brows-flat, .hm-eyes-happy, .hm-blush, .hm-tear { opacity: 0; }
  .hm-eyes-happy path { stroke: #2b2d33; stroke-width: 2.7; stroke-linecap: round; fill: none; }
  .hm-blush ellipse { fill: #ff8fa0; opacity: .8; }
  .hm-tear { fill: #9fd8ff; }
  .hm-sweat { opacity: 0; fill: #9fd8ff; stroke: #2b2d33; stroke-width: 1; }
  .hm-mouth { opacity: 0; stroke: #2b2d33; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; fill: none; transition: opacity .15s ease; }
  .hm-mouth-gasp { fill: #3b2626; stroke: none; }
  .hm-mouth-wail { fill: #3b2626; stroke: none; }
  .hm-mouth-grin { fill: #3b2626; stroke: #3b2626; stroke-width: 1.6; }
  .hm-mouth-o { fill: none; }
  .hm-xeyes { opacity: 0; stroke: #2b2d33; stroke-width: 2.7; stroke-linecap: round; fill: none; }
  @keyframes hm-sweat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(3px); } }

  /* the miss-count mood is the resting face; a spoken line's face wins below */
  .hm-stage[data-mood="calm"] .hm-mouth-calm { opacity: 1; }
  .hm-stage[data-mood="worried"] .hm-mouth-worried { opacity: 1; }
  .hm-stage[data-mood="worried"] .hm-brows-sad,
  .hm-stage[data-mood="scared"] .hm-brows-sad,
  .hm-stage[data-mood="terrified"] .hm-brows-sad { opacity: 1; }
  .hm-stage[data-mood="scared"] .hm-mouth-gasp,
  .hm-stage[data-mood="terrified"] .hm-mouth-wail { opacity: 1; }
  .hm-stage[data-mood="scared"] .hm-sweat,
  .hm-stage[data-mood="terrified"] .hm-sweat { opacity: 1; animation: hm-sweat 1.8s ease-in-out infinite; }
  .hm-stage[data-mood="scared"] .hm-eye { animation-duration: 3s; }
  .hm-stage[data-mood="dead"] .hm-mouth-dead { opacity: 1; }
  .hm-stage[data-mood="dead"] .hm-xeyes { opacity: 1; }
  .hm-stage[data-mood="dead"] .hm-eye,
  .hm-stage[data-mood="dead"] .hm-brows,
  .hm-stage[data-mood="dead"] .hm-sweat,
  .hm-stage[data-mood="dead"] .hm-mouth-calm,
  .hm-stage[data-mood="dead"] .hm-mouth-worried,
  .hm-stage[data-mood="dead"] .hm-mouth-gasp { opacity: 0; }
  .hm-stage[data-mood="saved"] .hm-eyes-normal { opacity: 0; }
  .hm-stage[data-mood="saved"] .hm-eyes-happy,
  .hm-stage[data-mood="saved"] .hm-blush { opacity: 1; }
  .hm-stage[data-mood="saved"] .hm-brows-raised { opacity: 1; }
  .hm-stage[data-mood="saved"] .hm-mouth-grin { opacity: 1; }
  .hm-stage[data-mood="saved"] .hm-sweat { opacity: 0; animation: none; }

  /* a line's expression replaces the resting face: all parts off, then the
     ones that belong to this face back on. */
  .hm-stage[data-face] .hm-mouth,
  .hm-stage[data-face] .hm-brows,
  .hm-stage[data-face] .hm-eyes-happy,
  .hm-stage[data-face] .hm-blush,
  .hm-stage[data-face] .hm-tear,
  .hm-stage[data-face] .hm-xeyes { opacity: 0; }
  .hm-stage[data-face] .hm-sweat { opacity: 0; animation: none; }
  .hm-stage[data-face] .hm-eyes-normal { opacity: 1; }
  .hm-stage[data-face] .hm-eyes { transform: none; }
  .hm-stage[data-face="calm"] .hm-mouth-calm,
  .hm-stage[data-face="worried"] .hm-mouth-worried { opacity: 1; }
  .hm-stage[data-face="worried"] .hm-brows-sad { opacity: 1; }
  .hm-stage[data-face="scared"] .hm-mouth-gasp,
  .hm-stage[data-face="terrified"] .hm-mouth-wail { opacity: 1; }
  .hm-stage[data-face="scared"] .hm-brows-sad,
  .hm-stage[data-face="terrified"] .hm-brows-sad { opacity: 1; }
  .hm-stage[data-face="scared"] .hm-sweat,
  .hm-stage[data-face="terrified"] .hm-sweat,
  .hm-stage[data-face="pleading"] .hm-sweat,
  .hm-stage[data-face="nervous"] .hm-sweat { opacity: 1; animation: hm-sweat 1.8s ease-in-out infinite; }
  .hm-stage[data-face="scared"] .hm-eyes { transform: scale(1.1); }
  .hm-stage[data-face="terrified"] .hm-eyes { transform: scale(1.16); }
  .hm-stage[data-face="pleading"] .hm-mouth-wobble,
  .hm-stage[data-face="pleading"] .hm-tear { opacity: 1; }
  .hm-stage[data-face="pleading"] .hm-brows-sad { opacity: 1; }
  .hm-stage[data-face="pleading"] .hm-eyes { transform: scale(1.2); }
  .hm-stage[data-face="smug"] .hm-mouth-smirk { opacity: 1; }
  .hm-stage[data-face="smug"] .hm-brows-raised { opacity: 1; }
  .hm-stage[data-face="smug"] .hm-eyes { transform: scaleY(.55); }
  .hm-stage[data-face="annoyed"] .hm-mouth-flat { opacity: 1; }
  .hm-stage[data-face="annoyed"] .hm-brows-angry { opacity: 1; }
  .hm-stage[data-face="annoyed"] .hm-eyes { transform: scaleY(.66); }
  .hm-stage[data-face="deadpan"] .hm-mouth-flat { opacity: 1; }
  .hm-stage[data-face="deadpan"] .hm-brows-flat { opacity: 1; }
  .hm-stage[data-face="shocked"] .hm-mouth-o { opacity: 1; }
  .hm-stage[data-face="shocked"] .hm-brows-raised { opacity: 1; }
  .hm-stage[data-face="shocked"] .hm-eyes { transform: scale(1.16); }
  .hm-stage[data-face="hopeful"] .hm-mouth-calm { opacity: 1; }
  .hm-stage[data-face="hopeful"] .hm-brows-raised { opacity: 1; }
  .hm-stage[data-face="proud"] .hm-mouth-grin,
  .hm-stage[data-face="saved"] .hm-mouth-grin { opacity: 1; }
  .hm-stage[data-face="proud"] .hm-brows-raised,
  .hm-stage[data-face="saved"] .hm-brows-raised,
  .hm-stage[data-face="relieved"] .hm-brows-raised { opacity: 1; }
  .hm-stage[data-face="proud"] .hm-eyes-happy,
  .hm-stage[data-face="saved"] .hm-eyes-happy,
  .hm-stage[data-face="relieved"] .hm-eyes-happy { opacity: 1; }
  .hm-stage[data-face="proud"] .hm-eyes-normal,
  .hm-stage[data-face="saved"] .hm-eyes-normal,
  .hm-stage[data-face="relieved"] .hm-eyes-normal { opacity: 0; }
  .hm-stage[data-face="proud"] .hm-blush,
  .hm-stage[data-face="saved"] .hm-blush { opacity: 1; }
  .hm-stage[data-face="relieved"] .hm-mouth-calm { opacity: 1; }
  .hm-stage[data-face="nervous"] .hm-mouth-wobble { opacity: 1; }
  .hm-stage[data-face="nervous"] .hm-brows-sad { opacity: 1; }
  .hm-stage[data-face="nervous"] .hm-eyes { transform: scaleY(.82); }
  .hm-stage[data-face="saved"] .hm-tear { opacity: 1; }
  .hm-stage[data-face="dead"] .hm-xeyes { opacity: 1; }
  .hm-stage[data-face="dead"] .hm-mouth-dead { opacity: 1; }

  /* the face controls the body language too */
  .hm-stage[data-face="proud"] #man,
  .hm-stage[data-face="smug"] #man,
  .hm-stage[data-face="relieved"] #man,
  .hm-stage[data-face="hopeful"] #man,
  .hm-stage[data-face="annoyed"] #man { animation: hm-talk 1.7s ease-in-out infinite; }
  .hm-stage[data-face="pleading"] #man,
  .hm-stage[data-face="nervous"] #man { animation: hm-fidget .8s ease-in-out infinite; }
  .hm-stage[data-face="scared"] #man { animation: hm-shiver .3s linear infinite; }
  .hm-stage[data-face="terrified"] #man { animation: hm-shiver .15s linear infinite; }
  @keyframes hm-talk { 0%, 100% { transform: rotate(-.3deg); } 40% { transform: rotate(.5deg) translateY(-1px); } }
  @keyframes hm-fidget { 0%, 100% { transform: rotate(-.5deg); } 50% { transform: rotate(.7deg) translateY(.5px); } }

  .hm-stage[data-react="hit"] #man { animation: hm-hit .5s ease-out; }
  @keyframes hm-hit { 0% { transform: rotate(0); } 30% { transform: rotate(-.9deg) translateY(-3px); } 100% { transform: rotate(0); } }
  .hm-stage[data-react="miss"] #man { animation: hm-miss .32s ease-in-out; }
  @keyframes hm-miss { 0%, 100% { transform: rotate(0); } 20% { transform: rotate(2deg); } 40% { transform: rotate(-2deg); } 60% { transform: rotate(1.2deg); } 80% { transform: rotate(-.6deg); } }
  .hm-stage[data-react="poke"] #man { animation: hm-poke .4s ease-in-out; }
  @keyframes hm-poke { 0%, 100% { transform: rotate(0); } 30% { transform: rotate(-2deg); } 65% { transform: rotate(2deg); } }
  .hm-stage[data-mood="terrified"]:not([data-face]) #man { animation: hm-shiver .15s linear infinite; }
  @keyframes hm-shiver { 0%, 100% { transform: rotate(-.7deg); } 50% { transform: rotate(.7deg); } }
  /* a save: he pulls the missing parts together, the noose lets go, and he
     drops to the ground with a hop instead of dangling half-built. */
  .hm-stage[data-mood="saved"] .pt { opacity: 1; visibility: visible; animation: hm-draw .28s ease-out forwards; }
  .hm-stage[data-mood="saved"] .pt:nth-child(2) { animation-delay: .03s; }
  .hm-stage[data-mood="saved"] .pt:nth-child(3) { animation-delay: .06s; }
  .hm-stage[data-mood="saved"] .pt:nth-child(4) { animation-delay: .09s; }
  .hm-stage[data-mood="saved"] .pt:nth-child(5) { animation-delay: .12s; }
  .hm-stage[data-mood="saved"] .pt:nth-child(6) { animation-delay: .15s; }
  .hm-stage[data-mood="saved"] #hm-outline { opacity: 0; }
  .hm-stage[data-mood="saved"] #hm-spark { animation: hm-sparkle .9s ease-out .55s both; }
  .hm-stage[data-mood="saved"] #hm-dust-land { animation: hm-puff .55s ease-out .8s; }
  .hm-stage[data-mood="saved"] #man { animation: hm-saved .75s cubic-bezier(.2, .8, .2, 1) .25s forwards; }
  @keyframes hm-saved { 0% { transform: rotate(-.4deg) translateY(0); } 24% { transform: rotate(.8deg) translateY(22px); } 40% { transform: rotate(-1.2deg) translateY(8px); } 58% { transform: rotate(1deg) translateY(22px); } 76% { transform: rotate(-.6deg) translateY(13px); } 100% { transform: rotate(0) translateY(22px); } }
  .hm-stage[data-mood="saved"] #rope { animation: hm-rope-free .5s ease-out .15s forwards; }
  @keyframes hm-rope-free { to { transform: scaleY(.04); opacity: 0; } }
  .hm-stage[data-mood="dead"] #man { animation: hm-limp .75s ease-out forwards; }
  @keyframes hm-limp { to { transform: rotate(2.8deg) translateY(2px); } }
  @keyframes hm-sparkle { 0% { opacity: 0; transform: scale(.35); } 40% { opacity: 1; } 100% { opacity: 0; transform: scale(1.35); } }

  #hm-dust { transform-box: fill-box; transform-origin: center; opacity: 0; fill: #e8d9c5; }
  #hm-dust.on { animation: hm-puff .5s ease-out; }
  #hm-dust-land { transform-box: fill-box; transform-origin: center; opacity: 0; fill: #e8d9c5; }
  #hm-spark { transform-box: fill-box; transform-origin: center; opacity: 0; }

  html body.fun.g-hangman #word { font-size: clamp(1.8rem, 9vw, 2.8rem); font-weight: 400; color: #fff; margin: 14px 0 4px; letter-spacing: .12em; }

  }

<template id="man-hangman">
  <h2>Name</h2>
  <p>hangman — set a word, guess it letter by letter.</p>

  <h2>Rules</h2>
  <ul>
    <li>Player 1 sets a secret word (3-20 letters). Player 2 guesses one letter at a time.</li>
    <li>A correct guess fills in every matching blank. A wrong guess costs one of 6 misses.</li>
    <li>Player 2 wins by completing the word before running out of misses. Otherwise Player 1 wins.</li>
  </ul>

  <h2>Two players over WhatsApp</h2>
  <ul>
    <li>Whoever starts is <strong>Player 1</strong> and sets the word — after that, every turn belongs to <strong>Player 2</strong>, who keeps guessing link after link until the game ends.</li>
    <li>The word does technically ride along in the link's data (same as Minesweeper's mine positions) — the page just never displays it to Player 2 before the game is decided, which is what makes blind link-passing work for a real game.</li>
  </ul>

  <h2>Same device</h2>
  <p class="muted">Player 1 types the word, then hands the device to Player 2 without looking — the page never shows the word until the game ends.</p>

  <h2>The stick man</h2>
  <p class="muted">The man in the noose is Splinter. He is drawn one part per miss, reacts to good and bad guesses, and gets nervous when the rope tightens. His face matches what he is saying — smug when he is right, pleading when he is scared, proud when you rescue him. Tap him once his head is drawn — or focus him and press Enter — if you want his opinion. If you save him he pulls the missing parts together, the noose lets go, and he hops down to the ground.</p>

  <h2>Controls</h2>
  <ul>
    <li><strong>Type</strong> the secret word once as Player 1. <strong>Tap a letter</strong> to guess it as Player 2.</li>
  </ul>
</template>
