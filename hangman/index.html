<style>
  #word {
    font-size: clamp(1.6rem, 7vw, 2.6rem);
    font-weight: 700;

  #misses { text-align: center; color: var(--muted); font-size: var(--fs-sm); margin-bottom: 10px; }
  #setup { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 16px 0; }
  #setup input {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    padding: 10px 12px;
    font-family: inherit;
    font-size: var(--fs-lg); /* 16px: anything smaller makes iOS Safari zoom in on focus and stay zoomed */

    text-align: center;
    text-transform: uppercase;
    width: min(280px, 100%);
  }
  #setup-error { color: var(--bad, #e35b5b); font-size: var(--fs-sm); min-height: 1.2em; }
  .hm-keyboard {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 5px;
    width: min(420px, 100%);
    margin: 10px auto;
  }
  /* #keyboard-prefixed to beat the shared "body[class*='g-'] .panel
     button" rule (specificity 0-2-1 vs a plain class at 0-1-0 / 0-2-0),
     which was otherwise forcing a 10px radius instead of the intended
     3px and painting over the hit/miss highlight colors — same fix as
     dots-and-boxes's #board .db-edge. */
  #keyboard .hm-key {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    color: var(--fg);
    font-family: inherit;
    font-weight: 700;
    padding: 8px 0;
    cursor: pointer;
    min-height: var(--tap);
  }
  .hm-key:disabled { cursor: default; }
  #keyboard .hm-key.hit { background: rgba(60,180,100,0.3); border-color: rgba(60,180,100,0.6); }
  #keyboard .hm-key.miss { background: rgba(200,60,60,0.25); border-color: rgba(200,60,60,0.55); opacity: 0.7; }


  /* chunky look: charcoal page, red gallows that fills in with every miss, grey keys */
  html body.fun.g-hangman { --fun-bg: #1c1d20; --fun-btn: #9a938e; --fun-chip: rgba(255,255,255,.09); }
  /* the stick man is the only one who taunts: no taunt strip on this page */
  html body.fun[data-fun-zone].g-hangman .panel .gk-slot { display: none !important; }
  /* when the man runs out of chances, his ghost floats up beside him and says the last line */
  html body.fun.g-hangman .hm-stage { position: relative; }
  /* the man's ghost (a round head, a wavy tail) leaves his body, and more spirits keep rising out of him */
  html body.fun.g-hangman .hm-ghosts { position: absolute; left: 0; top: 0; width: min(190px, 46%); aspect-ratio: 1; z-index: 2; pointer-events: none; }
  html body.fun.g-hangman .hm-ghosts[hidden] { display: none; }
  html body.fun.g-hangman .hm-g { position: absolute; transform: translateX(-50%); overflow: visible; filter: drop-shadow(0 0 7px rgba(255,255,255,.5)); }
  html body.fun.g-hangman .hm-g.big { left: 93%; top: 6%; width: 32px; height: 78px; transform: translateX(-50%); animation: hm-drift 2.6s ease-in-out infinite; }
  /* he floats beside the man, upright */
  @keyframes hm-drift { 0%, 100% { transform: translateX(-50%) translateY(0); } 50% { transform: translateX(-50%) translateY(-6px); } }
  @media (prefers-reduced-motion: reduce) { html body.fun.g-hangman .hm-g { animation: none !important; } }
  html body.fun.g-hangman .hm-bubble.ghost { background: #e9e4f7; }
  html body.fun.g-hangman .hm-bubble.ghost::before { border-right-color: #e9e4f7; }
  @keyframes hm-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  html body.fun.g-hangman .hm-stage { display: flex; align-items: flex-start; gap: 6px; margin: 2px 0 0; }
  html body.fun.g-hangman .hm-gallows { display: block; flex: 0 0 auto; width: min(190px, 46%); aspect-ratio: 1; margin: 0; }
  /* the hanged man talks: a speech bubble to the right of the gallows, tail pointing at his head */
  html body.fun.g-hangman .hm-bubble { position: relative; flex: 1 1 0; min-width: 0; align-self: flex-start; margin: 4% 0 0 14px; padding: 12px 14px; border-radius: 20px; background: #fff; color: #2b2d33; font-size: 18px; line-height: 1.25; text-wrap: balance; animation: hm-pop .22s ease-out; }
  html body.fun.g-hangman .hm-bubble::before { content: ""; position: absolute; left: -12px; top: 22px; border: 8px solid transparent; border-right: 14px solid #fff; border-left: 0; }
  html body.fun.g-hangman .hm-bubble[hidden] { display: none; }
  html body.fun.g-hangman .hm-bubble.beg { background: #ffe9a8; } html body.fun.g-hangman .hm-bubble.beg::before { border-right-color: #ffe9a8; }
  @keyframes hm-pop { from { transform: scale(.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .hm-gallows .fr { stroke: #e2403a; stroke-width: 7; stroke-linecap: round; fill: none; }
  .hm-gallows .ground { stroke: #8a5a3c; stroke-width: 7; stroke-linecap: round; }
  .hm-gallows .pt { stroke: #fff; stroke-width: 6; stroke-linecap: round; fill: none; display: none; }
  .hm-gallows .pt.on { display: inline; }
  html body.fun.g-hangman #word { font-size: clamp(1.8rem, 9vw, 2.8rem); font-weight: 400; color: #fff; margin: 14px 0 4px; letter-spacing: .12em; }
  html body.fun.g-hangman #misses { color: rgba(255,255,255,.7); font-size: 16px; min-height: 1.4em; margin-bottom: 6px; }
  html body.fun.g-hangman .hm-keyboard { width: 100%; gap: 6px; grid-template-columns: repeat(7, 1fr); }
  html body.fun.g-hangman #keyboard .hm-key { background: #9a938e; color: #fff; border: 0; border-radius: 8px; min-height: 46px; padding: 0; font-size: 22px; font-weight: 400; box-shadow: none; opacity: 1; }
  html body.fun.g-hangman #keyboard .hm-key.hit { background: #6ac43a; }

  html body.fun.g-hangman #setup { margin: 8px 0; }
  html body.fun.g-hangman #setup-error { color: #ff8a7a; }

<template id="man-hangman">
  <h2>Name</h2>
  <p>hangman — set a word, guess it letter by letter.</p>

  <h2>Rules</h2>
  <ul>
    <li>Player 1 sets a secret word (3-20 letters). Player 2 guesses one letter at a time.</li>
    <li>A correct guess fills in every matching blank. A wrong guess costs one of 6 misses.</li>
    <li>Player 2 wins by completing the word before running out of misses. Otherwise Player 1 wins.</li>
  </ul>

  <h2>Two players over WhatsApp</h2>
  <ul>
    <li>Whoever starts is <strong>Player 1</strong> and sets the word — after that, every turn belongs to <strong>Player 2</strong>, who keeps guessing link after link until the game ends.</li>
    <li>The word does technically ride along in the link's data (same as Minesweeper's mine positions) — the page just never displays it to Player 2 before the game is decided, which is what makes blind link-passing work for a real game.</li>
  </ul>

  <h2>Same device</h2>
  <p class="muted">Player 1 types the word, then hands the device to Player 2 without looking — the page never shows the word until the game ends.</p>

  <h2>Controls</h2>
  <ul>
    <li><strong>Type</strong> the secret word once as Player 1. <strong>Tap a letter</strong> to guess it as Player 2.</li>
  </ul>
</template>
