<template id="man-hashiwokakero">
  <h2>Name</h2>
  <p>hashiwokakero — Japanese for "let us build bridges". Every circle is an island.</p>

  <h2>Rules</h2>
  <ul>
    <li>The <strong>number on an island</strong> is how many bridges must meet there (1 to 8).</li>
    <li>Two islands can be joined when they are in the <strong>same row or column</strong> with no other island between them. A pair can have <strong>one bridge or two</strong>, never more.</li>
    <li>Bridges run only straight across or straight up and down, and they <strong>may not cross</strong>.</li>
    <li>When you finish, <strong>every island must be joined into one network</strong>.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap an island: it glows, and the islands it can reach light up. Tap a lit island to put <strong>one bridge</strong> there; tap it again for a <strong>second bridge</strong>; once more to take them both away.</li>
    <li><code>Hint</code> shows one bridge from the solution as a dashed line. <code>Check</code> marks islands with too many or too few bridges. <code>↶ undo</code> takes back your last bridge; <code>restart</code> clears the board and the clock.</li>
    <li>The puzzle is the same for everyone each day, at each level. The round <code>↻</code> button in the header gives a random one; the level chips under Options pick 5×5, 7×7 or 9×9.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Start with islands that have only one possible direction, or with a 1 or a 2. An 8 needs two bridges in every direction it can see. Islands in the middle of a long line are best left for later: they usually get their bridges from both sides.</p>
</template>
