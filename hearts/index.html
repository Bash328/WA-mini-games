<template id="man-hearts">
  <h2>Name</h2>
  <p>hearts — the classic four-player card game. The lowest score wins.</p>

  <h2>Rules</h2>
  <ul>
    <li>Four players, thirteen cards each. Before most hands you <strong>pass three cards</strong>: left, then right, then across, then nobody (and repeat).</li>
    <li>The holder of the <strong>two of clubs</strong> leads it. On every trick you must follow the suit that was led if you can.</li>
    <li>Every <strong>heart</strong> is 1 point and the <strong>queen of spades</strong> is 13. You want as few points as possible.</li>
    <li>You may not lead a heart until one has been played ("broken"), and on the first trick you may not play a heart or the queen if you can avoid it.</li>
    <li>Taking all 26 points in a hand (<strong>shooting the moon</strong>) gives everyone else 26 and you nothing.</li>
    <li>After each hand the points go on the scores. As soon as someone reaches 100 the game ends, and the <strong>lowest</strong> score wins.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Passing:</strong> tap three cards, then tap <strong>Pass</strong>. The computer players hand theirs over at the same time.</li>
    <li><strong>Playing:</strong> tap a card that is highlighted. A card that can't be played stays dim; tapping it tells you why.</li>
  </ul>

  <h2>Against the computer</h2>
  <ul>
    <li>Easy plays any legal card. Medium follows suit cheaply and keeps a safe lead. Hard also guards the queen of spades and dumps her when a hand is void.</li>
  </ul>

  <h2>Playing online</h2>
  <ul>
    <li>Tap <strong>Online room</strong>, create a room and send the invite link. Hearts always has four seats: friends take them, and computers fill any that are still empty when the game starts.</li>
    <li>The server deals and holds the hands — your browser is only ever sent your own cards. If you drop out for 90 seconds a computer plays for you until you come back.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Pass high hearts and the queen of spades when they are not guarded. Keep short suits so you can shed points on someone else's trick, and remember that winning a trick with hearts in it is usually a bad idea.</p>
