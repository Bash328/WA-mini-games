<template id="man-hex">
  <h2>Name</h2>
  <p>hex — build an unbroken chain of stones between your two sides.</p>

  <h2>Rules</h2>
  <ul>
    <li>An 11×11 board of hexagons. <strong>Red</strong> must connect the <strong>top and bottom</strong> edges; <strong>Blue</strong> must connect the <strong>left and right</strong> edges. Your two sides are drawn in your colour.</li>
    <li>Players take turns placing one stone on any empty hexagon. Stones never move or get captured. Red goes first.</li>
    <li>Each hexagon touches six neighbours, so a chain can bend. The first player whose stones form a complete chain wins.</li>
    <li><strong>There are no draws</strong>: when the board is full, exactly one of you has a chain, and blocking your opponent is the same as connecting yourself.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts is <strong>Red</strong>. After each stone, tap <code>Send on WhatsApp</code>; your friend opens the link, sees your last stone outlined, and replies.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap or click a hexagon to place your stone. Use the mode menu to play the computer or share one device; <code>↶ undo</code> is there in those modes.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">The first player has a real edge, so the centre matters. Two stones with two empty hexagons between them are an unbreakable "bridge": if your opponent takes one gap, you take the other. Build with bridges and you can connect faster than they can block.</p>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. Your friend joins in their browser and you play in real time.</li>
  </ul>
</template>
