<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="../ga.js"></script>
<title>letter boxed · games</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Letter Boxed — spell words around the box, never two letters in a row from the same side, and use all twelve letters in as few words as you can. A new daily puzzle, three levels.">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../shared.css">
<style>
  .lb-box { position: relative; width: min(380px, 100%); aspect-ratio: 1; margin: 8px auto; user-select: none; touch-action: manipulation; }
  .lb-box svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .lb-sq { fill: none; stroke: var(--fg); stroke-width: .8; }
  .lb-dot { fill: var(--fg); }
  .lb-old { stroke: color-mix(in srgb, var(--accent) 45%, transparent); stroke-width: 1.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .lb-now { stroke: var(--accent); stroke-width: 1.8; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  body.g-letter-boxed .panel .lb-l {
    position: absolute; width: 14%; height: 14%; min-height: 0; min-width: 0; padding: 0; transform: translate(-50%, -50%);
    border-radius: 50%; font-size: clamp(16px, 5.4vw, 24px); font-weight: 700; text-transform: uppercase; letter-spacing: 0;
    background: var(--panel-2); border: 2px solid var(--border-hi); color: var(--fg); display: flex; align-items: center; justify-content: center;
  }
  body.g-letter-boxed .panel .lb-l.used { background: color-mix(in srgb, var(--accent) 22%, var(--panel-2)); border-color: var(--accent); }
  body.g-letter-boxed .panel .lb-l.cur { background: var(--accent); color: var(--bg); border-color: var(--accent); }
  body.g-letter-boxed .panel .lb-l:disabled { opacity: .3; }
  .lb-word { text-align: center; font-size: 30px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; min-height: 1.5em; margin: 6px 0 2px; }
  .lb-word .lock { opacity: .45; }
  .lb-msg { text-align: center; color: var(--muted); font-size: var(--fs-sm); min-height: 1.6em; }
  .lb-msg.bad { color: var(--coral); }
  .lb-chain { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; min-height: 36px; margin: 6px 0; }
  .lb-chain span { padding: 4px 10px; border-radius: 999px; border: 1px solid var(--border-hi); background: var(--panel-2); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
  .lb-keys { display: flex; gap: 8px; justify-content: center; margin: 8px 0; }
  .lb-keys .btn { min-height: 46px; flex: 1; max-width: 140px; }
  .lb-hint { text-align: center; font-size: var(--fs-sm); min-height: 1.6em; color: var(--muted); }
</style>
<script>try{var t=localStorage.getItem("games:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body class="g-letter-boxed">
<main class="wrap">
  <div class="topbar">
    <h1>letter boxed</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status">Loading the word list…</p>
      <p class="status">Words: <span id="count">0</span> · Best: <span id="best">—</span></p>
      <button class="btn ghost tool-btn man-trigger" data-man="letter-boxed" data-man-title="LETTER-BOXED(1)" type="button">
        how to <span class="q">?</span>
      </button>
    </div>
    <div class="game-controls">
      <div class="chips" id="chips" role="tablist" aria-label="Difficulty">
        <button class="chip" data-diff="easy" role="tab" type="button">Easy</button>
        <button class="chip" data-diff="medium" role="tab" type="button">Medium</button>
        <button class="chip" data-diff="hard" role="tab" type="button">Hard</button>
      </div>
      <button class="btn ghost tool-btn" id="new-btn" type="button"><span class="glyph">↻</span> new</button>
    </div>
    <div class="lb-box" id="box" data-board></div>
    <div class="lb-word" id="word" aria-live="polite"></div>
    <div class="lb-msg" id="msg"></div>
    <div class="lb-chain" id="chain"></div>
    <div class="lb-keys">
      <button class="btn" id="del-btn" type="button">Delete</button>
      <button class="btn primary" id="enter-btn" type="button">Enter</button>
    </div>
    <div class="lb-hint" id="hint"></div>
    <div class="toolbar">
      <button class="btn ghost tool-btn" id="undo-btn" type="button"><span class="glyph">↶</span> undo word</button>
      <button class="btn ghost tool-btn" id="hint-btn" type="button">hint</button>
      <button class="btn ghost tool-btn" id="reset-btn" type="button"><span class="glyph">↻</span> reset</button>
    </div>
  </div>
</main>

<template id="man-letter-boxed">
  <h2>Name</h2>
  <p>letter boxed — use all twelve letters around the box.</p>

  <h2>Rules</h2>
  <ul>
    <li>Twelve letters sit on the four sides of the box, three to a side.</li>
    <li>Spell a word by tapping its letters one after another. <strong>Two letters in a row can never come from the same side</strong>, and the same letter may be used more than once.</li>
    <li>Words are at least 3 letters. Each new word has to <strong>start with the last letter of the word before</strong>, and you can't use a word twice.</li>
    <li><strong>Win</strong> by using every one of the twelve letters. Fewer words is better: there is always a way in two.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap letters (or type them on a keyboard), then <code>Enter</code>. <code>Delete</code> (or Backspace) removes the last letter. Letters you can't use next are dimmed.</li>
    <li><code>↶ undo word</code> takes back your last word. <code>hint</code> shows a word that solves it, one word at a time. <code>↻ reset</code> clears your words.</li>
    <li>The puzzle is the same for everyone each day, at each level. <code>↻ new</code> gives a random one. <strong>Easy</strong> boxes accept lots of common words; <strong>Hard</strong> ones need a rarer word.</li>
  </ul>

  <h2>Word list</h2>
  <p class="muted">About 55,000 words, a trimmed ENABLE list (public domain) keeping the ones people actually use. If a real word is refused, it just isn't in the list.</p>
</template>

</html>
