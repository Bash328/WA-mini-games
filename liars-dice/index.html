<template id="man-liars-dice">
  <h2>Name</h2>
  <p>liar's dice — also called Perudo. Bluff, count and call it.</p>

  <h2>Rules</h2>
  <ul>
    <li>2 to 4 players, <strong>5 dice each</strong>. Everyone rolls under a cup: you see <strong>only your own dice</strong>.</li>
    <li>On your turn, either <strong>bid</strong> or call <strong>dudo</strong> ("I doubt it").</li>
    <li>A bid is a claim about <strong>all the dice on the table</strong>, everyone's: "at least 4 dice show 3". The next bid has to go up: <strong>more dice</strong>, or the <strong>same number of a higher face</strong>.</li>
    <li><strong>Ones are wild.</strong> When the dice are counted for a bid on 2 to 6, every 1 counts too. (A bid on 1s counts only 1s.)</li>
    <li>To bid on 1s you may <strong>halve</strong> the number (rounded up). To go from 1s back to another face you must <strong>double it and add one</strong>. The opening bid can't be on 1s.</li>
    <li><strong>Dudo:</strong> everyone shows their dice and they're counted. If the bid was true or better, <strong>the caller loses a die</strong>. If it was a lie, <strong>the bidder loses a die</strong>.</li>
    <li>Whoever lost a die starts the next round. At no dice you're out. <strong>Last player with dice wins.</strong></li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Set the number with <code>−</code> and <code>+</code>, tap a face, then <code>Bid</code>. Faces you can't bid on right now are dimmed. <code>Dudo!</code> calls the last bid.</li>
    <li>Against the computer, pick <strong>Easy / Medium / Hard</strong> and 1 to 3 computer players.</li>
  </ul>

  <h2>Playing online</h2>
  <ul>
    <li>Tap <strong>Online room</strong>, create a room and send the invite link. Up to 4 seats. The host can add computer players to fill them, and starts the game.</li>
    <li>The server rolls the dice and keeps them: your browser is only ever sent your own. If you drop out for 90 seconds a computer plays for you until you come back.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">With 10 dice on the table, about a third of them show any given face (once the wild ones count). Open with what you hold, nudge the bid up one step at a time, and call dudo when a bid asks for far more than your own dice and the odds can support.</p>
</template>
