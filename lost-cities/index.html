<template id="man-lost-cities">
  <h2>Name</h2>
  <p>lost cities — the two-player expedition card game. Five colours, five expeditions each, and one trip down a very expensive river.</p>

  <h2>The deck</h2>
  <ul>
    <li>Five colours: <strong>yellow, blue, white, green and red</strong>. Each colour has the numbers <strong>2 to 10</strong> and <strong>three handshakes</strong>.</li>
    <li>That is 60 cards. You and your opponent each get <strong>8</strong>; the other <strong>44</strong> wait in the deck.</li>
  </ul>

  <h2>Your turn</h2>
  <ul>
    <li><strong>Play one card</strong> onto one of your own expeditions, or <strong>discard one card</strong> face up onto its colour's discard pile. Then <strong>draw one card</strong>: the top of the deck, or the top of any discard pile.</li>
    <li>A number may only be played if it is <strong>higher than the top number</strong> already on that expedition. An empty expedition takes any number.</li>
    <li>A <strong>handshake</strong> may only be played <strong>before the first number</strong> of an expedition. You may stack several handshakes there. Once a number is down, that expedition can no longer take a handshake.</li>
    <li>Discard piles are shared. You may take a card the other player just discarded — or the one you just discarded yourself.</li>
  </ul>

  <h2>Scoring</h2>
  <ul>
    <li>Each expedition with cards scores <strong>(the sum of its numbers - 20) x (1 + its handshakes)</strong>. An expedition with no cards scores 0.</li>
    <li>An expedition that does not reach 20 is <strong>negative</strong>, and a handshake makes a negative expedition more negative too. Sum the five.</li>
    <li>The round ends as soon as the <strong>deck is empty</strong>. Your unplayed hand does not score. The higher total wins; a tie is a draw.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Playing:</strong> tap a card, then <strong>Play</strong> or <strong>Discard</strong>. Cards that fit are outlined; tapping a card that does not fit tells you why.</li>
    <li><strong>Drawing:</strong> after you play or discard, the deck and every non-empty discard pile light up. Tap one, or tap <strong>Draw from deck</strong>.</li>
  </ul>

  <h2>Against the computer</h2>
  <ul>
    <li><strong>Easy</strong> plays and discards almost at random. <strong>Medium</strong> extends its expeditions and keeps useful low cards. <strong>Hard</strong> values handshakes, starts expeditions only when they can grow, and dumps dead high cards early.</li>
  </ul>

  <h2>Playing online</h2>
  <ul>
    <li>Lost Cities always has <strong>two seats</strong>. Tap <strong>Online room</strong>, create a room and send the invite link to a friend.</li>
    <li>The server deals and holds the hands — your browser is only ever sent your own cards. If you drop out for 90 seconds a computer plays for you until you come back.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Only start an expedition you can grow: a lone 2 costs 18 points. Play a handshake early on a colour where you hold several high numbers, but remember it doubles a loss as readily as a win. Low cards are worth keeping; high cards with no lower cards to lead into them are the first things to throw away.</p>
</template>
