<style>
  /* ---------- the chunky look: a deep blue table with a cream cross board ---------- */
  html body.fun.g-ludo { --fun-bg: #27306b; --fun-btn: #e0524c; --fun-chip: rgba(255,255,255,.12); --accent: #ffd34a; --ld-red: #e0524c; --ld-yellow: #f2c14e; --ld-blue: #4a86e8; --ld-green: #2fb44a; --ld-cream: #f7f1e3; --ld-line: rgba(30,25,15,.2); }
  #ld { display: none; container-type: inline-size; position: relative; margin: 0 -11px; padding: 0 11px; overflow: hidden; }
  #ld.on { display: block; }

  /* the four player tabs */
  .ld-players { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 1.2cqw; height: 11cqw; margin-bottom: 1.6cqw; }
  .ld-player { min-width: 0; display: flex; align-items: center; justify-content: center; gap: 1.2cqw; padding: 0 1.2cqw; border-radius: 2.6cqw; background: rgba(0,0,0,.26); line-height: 1; overflow: hidden; }
  .ld-player .dot { width: 3.2cqw; height: 3.2cqw; flex: none; border-radius: 50%; background: var(--pc); box-shadow: 0 0 0 .35cqw rgba(255,255,255,.3); }
  .ld-player .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 3cqw; color: rgba(255,255,255,.8); }
  .ld-player .hm { flex: none; font-size: 3.2cqw; color: rgba(255,255,255,.55); }
  .ld-player.you { background: rgba(255,255,255,.16); }
  .ld-player.you .nm { color: #fff; }
  .ld-player.now { outline: .5cqw solid var(--accent); outline-offset: -.5cqw; }
  .ld-player.now .hm { color: var(--accent); }
  .ld-player.win { background: var(--accent); }
  .ld-player.win .nm, .ld-player.win .hm { color: #2a1a00; }

  /* the 15x15 cross board */
  .ld-board { position: relative; width: 100%; aspect-ratio: 1 / 1; border-radius: 4.5cqw; background: var(--ld-cream); overflow: hidden; box-shadow: 0 1cqw 0 rgba(0,0,0,.28); }
  .ld-cells { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(15, 1fr); grid-template-rows: repeat(15, 1fr); }
  .ld-cell { position: relative; box-sizing: border-box; }
  .ld-cell.track { background: #fffdf6; box-shadow: inset 0 0 0 .1cqw var(--ld-line); }
  .ld-cell.safe::after { content: ""; position: absolute; left: 50%; top: 50%; width: 26%; height: 26%; transform: translate(-50%, -50%) rotate(45deg); background: #c4b797; border-radius: .15cqw; }
  .ld-cell.entry-red { background: var(--ld-red); }
  .ld-cell.entry-yellow { background: var(--ld-yellow); }
  .ld-cell.entry-blue { background: var(--ld-blue); }
  .ld-cell.entry-green { background: var(--ld-green); }
  .ld-cell.home-red { background: color-mix(in srgb, var(--ld-red) 28%, #fffdf6); }
  .ld-cell.home-yellow { background: color-mix(in srgb, var(--ld-yellow) 34%, #fffdf6); }
  .ld-cell.home-blue { background: color-mix(in srgb, var(--ld-blue) 28%, #fffdf6); }
  .ld-cell.home-green { background: color-mix(in srgb, var(--ld-green) 28%, #fffdf6); }

  .ld-yard { position: absolute; width: 40%; height: 40%; border-radius: 3.4cqw; overflow: hidden; }
  .ld-yard-in { position: absolute; inset: 11%; border-radius: 2.4cqw; background: rgba(255,255,255,.34); box-shadow: inset 0 0 0 .5cqw rgba(255,255,255,.38); }
  .ld-yard.yard-red { left: 0; top: 60%; background: var(--ld-red); }
  .ld-yard.yard-yellow { left: 0; top: 0; background: var(--ld-yellow); }
  .ld-yard.yard-blue { left: 60%; top: 0; background: var(--ld-blue); }
  .ld-yard.yard-green { left: 60%; top: 60%; background: var(--ld-green); }
  .ld-spot { position: absolute; width: 15%; aspect-ratio: 1; border-radius: 50%; background: rgba(255,255,255,.55); transform: translate(-50%, -50%); }
  .ld-home { position: absolute; left: 40%; top: 40%; width: 20%; height: 20%; border-radius: 1.4cqw; background: conic-gradient(from 45deg, var(--ld-green) 0 25%, var(--ld-red) 0 50%, var(--ld-yellow) 0 75%, var(--ld-blue) 0 100%); box-shadow: inset 0 0 0 .5cqw rgba(0,0,0,.12); }
  .ld-home::after { content: ""; position: absolute; left: 50%; top: 50%; width: 34%; height: 34%; border-radius: 50%; background: rgba(255,255,255,.8); transform: translate(-50%, -50%); }

  /* tokens */
  .ld-tokens { position: absolute; inset: 0; pointer-events: none; }
  html body.g-ludo .panel .ld-token { position: absolute; width: calc(100% / 15 * 0.74); aspect-ratio: 1; min-width: 0; min-height: 0; padding: 0; margin: 0; border: .34cqw solid #fff; border-radius: 50%; background: var(--tok); color: #fff; box-shadow: 0 .28cqw 0 rgba(0,0,0,.3); transform: translate(-50%, -50%); cursor: default; pointer-events: auto; font-size: 0; letter-spacing: 0; text-transform: none; z-index: 2; transition: left .28s cubic-bezier(.2,.9,.3,1), top .28s cubic-bezier(.2,.9,.3,1), box-shadow .15s, transform .12s; }
  html body.g-ludo .panel .ld-token.tok-red { --tok: var(--ld-red); }
  html body.g-ludo .panel .ld-token.tok-yellow { --tok: var(--ld-yellow); }
  html body.g-ludo .panel .ld-token.tok-blue { --tok: var(--ld-blue); }
  html body.g-ludo .panel .ld-token.tok-green { --tok: var(--ld-green); }
  html body.g-ludo .panel .ld-token.movable { cursor: pointer; box-shadow: 0 0 0 .6cqw var(--accent), 0 .28cqw 0 rgba(0,0,0,.3); }
  html body.g-ludo .panel .ld-token:hover, html body.g-ludo .panel .ld-token:focus-visible { background: var(--tok); color: #fff; }
  html body.g-ludo .panel .ld-token::before { content: ""; position: absolute; inset: 28%; border-radius: 50%; background: rgba(255,255,255,.72); }
  html body.g-ludo .panel .ld-token.movable:active { transform: translate(-50%, -50%) scale(.9); }
  html body.g-ludo .panel .ld-token.movable::after { content: ""; position: absolute; inset: 22%; border-radius: 50%; background: rgba(255,255,255,.8); }
  html body.g-ludo .panel .ld-token.done { box-shadow: 0 0 0 .4cqw #fff, 0 .28cqw 0 rgba(0,0,0,.3); }

  /* die, roll and the line under the board */
  .ld-controls { display: flex; align-items: center; gap: 3cqw; height: 22cqw; margin-top: 2cqw; }
  .ld-die { width: 18cqw; height: 18cqw; flex: none; border-radius: 3.4cqw; background: #fff; color: #1b1b1d; box-shadow: 0 .8cqw 0 rgba(0,0,0,.25); display: flex; align-items: center; justify-content: center; }
  .ld-die svg { width: 100%; height: 100%; display: block; }
  .ld-die .ld-q { font-size: 8cqw; line-height: 1; color: #b9b2a5; }
  html body.g-ludo .panel button.ld-roll { flex: 1; min-width: 0; height: 16cqw; min-height: 0; padding: 0 3cqw; border-radius: 4cqw; font-size: 5.4cqw; letter-spacing: .04em; background: var(--fun-btn); box-shadow: 0 1cqw 0 #9c322c; }
  html body.g-ludo .panel button.ld-roll:disabled { background: #233150 !important; box-shadow: none !important; color: rgba(255,255,255,.62) !important; opacity: 1; }
  .ld-note { min-height: 4.2cqw; font-size: 3.1cqw; line-height: 1.15; text-align: center; color: rgba(255,255,255,.62); padding: 0 2cqw; }
  /* dark-edged cross board and compact score bar as in the reference, on a slate blue page (the user's pick over the reference's coral) */
  html body.fun.g-ludo {
    --fun-bg: #3a4f7a;
    --fun-chip: rgba(255,255,255,.22);
    --fun-btn: #d9574b;
    --ld-yellow: #f7c21e;
    --ld-blue: #22b6e8;
    --ld-red: #ff5a5a;
    --ld-green: #5cc84a;
  }
  body.g-ludo { background: var(--fun-bg); }
  body.g-ludo .wrap { max-width: 430px; padding-inline: 8px; }
  body.g-ludo .panel { background: transparent; border: 0; box-shadow: none; padding: 0 !important; }
  body.g-ludo .topbar { margin-bottom: 0; }
  body.g-ludo .topbar .man-trigger { display: none; }
  body.g-ludo .topbar .back { background: #c97862; box-shadow: none; }

  /* YOU 0 VS BOT 0, with the difficulty on its little tab */
  .ld-vs {
    grid-column: 2; grid-row: 1; justify-self: center; position: relative;
    width: min(230px, 100%); height: 48px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    background: #6e4646; border-radius: 12px; color: #fff; text-transform: uppercase;
  }
  .ld-vs .ld-tab {
    position: absolute; left: 50%; top: -8px; transform: translateX(-50%);
    padding: 0 14px; height: 14px; line-height: 14px; background: #6e4646;
    border-radius: 8px 8px 0 0; font-size: 9px; color: rgba(255,255,255,.72); letter-spacing: .06em; white-space: nowrap;
  }
  .ld-vs .ld-side { display: flex; flex-direction: column; align-items: center; font-weight: 400; line-height: 1; }
  .ld-vs .ld-side small { font-size: 10px; letter-spacing: .04em; }
  .ld-vs .ld-side i { font-style: normal; font-size: 25px; line-height: 1.05; }
  .ld-vs .ld-side.you small, .ld-vs .ld-side.you i { color: #f39a9a; }
  .ld-vs .ld-side.bot small, .ld-vs .ld-side.bot i { color: #76e2ea; }
  .ld-vs em { font-style: normal; font-size: 19px; font-weight: 700; padding: 0 4px; }

  /* keep the shared Options button, but as a small gear in the header */
  body.g-ludo .gk-optwrap { position: fixed !important; top: 76px !important; right: 12px !important; left: auto !important; width: 44px; height: 44px; z-index: 30; }
  body.g-ludo .gk-optbtn { width: 44px; height: 44px; min-height: 0; padding: 0; border-radius: 50%; background: var(--fun-chip); font-size: 0; overflow: hidden; justify-content: center; }
  body.g-ludo .gk-optbtn span { display: none; }
  body.g-ludo .gk-optbtn .gk-gear { width: 22px; height: 22px; }
  body.g-ludo .gk-opts { top: 52px; right: 0; left: auto; }
  body.g-ludo #gk-slot { display: none; }

  body.g-ludo .ld-players, body.g-ludo .ld-note, body.g-ludo .row { display: none !important; }
  body.g-ludo .panel > .row, body.g-ludo .panel > .game-controls, body.g-ludo .panel > .toolbar { display: none; }
  #ld { margin: 88px -8px 0; padding: 0 8px; }

  /* the board: straight edges, saturated yards, thin dark grid */
  .ld-board { border: 3px solid #392a2a; border-radius: 0; background: #fff; box-shadow: none; }
  .ld-cells { border-radius: 0; }
  .ld-cell.track { background: #fff; box-shadow: inset 0 0 0 .12cqw #4c3a2f; }
  .ld-cell.safe::after { background: #c9a23a; border-radius: 0; }
  .ld-yard { border-radius: 0; }
  .ld-yard-in { inset: 12%; border-radius: 2.2cqw; background: rgba(255,255,255,.9); box-shadow: none; }
  .ld-spot { width: 13%; border: .45cqw solid rgba(0,0,0,.14); background: rgba(255,255,255,.34); }
  .ld-home { border-radius: 0; box-shadow: inset 0 0 0 .5cqw #392a2a; }
  .ld-home::after { width: 22%; height: 22%; background: #f7f1e3; }
  html body.g-ludo .panel .ld-token { border: .55cqw solid #2b1f1f; box-shadow: 0 .22cqw 0 rgba(0,0,0,.3); }
  html body.g-ludo .panel .ld-token::before { inset: 30%; background: rgba(255,255,255,.55); }

  .ld-controls { height: 21cqw; margin-top: 2.4cqw; gap: 2.4cqw; }
  .ld-die { width: 17cqw; height: 17cqw; border-radius: 3cqw; background: #fff; box-shadow: 0 .7cqw 0 #d0c7b6; }
  .ld-die .ld-q { width: 42%; height: 42%; font-size: 0; background: #e35b4f; clip-path: polygon(50% 0, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0 50%, 39% 39%); }
  html body.g-ludo .panel button.ld-roll { height: 17cqw; border-radius: 3cqw; font-size: 6cqw; background: #d9574b; box-shadow: 0 1cqw 0 #a53a32; }

  /* ---- the reference board: saturated lanes, star start squares, a four-triangle centre, double-disc tokens,
          a dark frame, and the dice row centred under it ---- */
  #ld { margin: clamp(88px, calc(100svh - 690px), 150px) -8px 0; padding: 0 4px; }
  .ld-board { border: 1.6cqw solid #3a3a44; }
  .ld-cell.track { background: #fff; box-shadow: inset 0 0 0 .12cqw rgba(60,60,80,.3); }
  .ld-cell.home-red { background: var(--ld-red); }
  .ld-cell.home-yellow { background: var(--ld-yellow); }
  .ld-cell.home-blue { background: var(--ld-blue); }
  .ld-cell.home-green { background: var(--ld-green); }
  .ld-cell[class*="home-"] { box-shadow: inset 0 0 0 .12cqw rgba(60,60,80,.3); }
  /* start squares: the colour's tint with its star; the other safe squares carry a grey star */
  .ld-cell.safe::after, .ld-cell[class*="entry-"]::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 66%; height: 66%; transform: translate(-50%, -50%); border-radius: 0; background: #c3c4cc;
    clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
  }
  .ld-cell.entry-red { background: color-mix(in srgb, var(--ld-red) 30%, #fff); --star: var(--ld-red); }
  .ld-cell.entry-yellow { background: color-mix(in srgb, var(--ld-yellow) 30%, #fff); --star: var(--ld-yellow); }
  .ld-cell.entry-blue { background: color-mix(in srgb, var(--ld-blue) 30%, #fff); --star: var(--ld-blue); }
  .ld-cell.entry-green { background: color-mix(in srgb, var(--ld-green) 30%, #fff); --star: var(--ld-green); }
  .ld-cell[class*="entry-"]::after { background: var(--star); }

  .ld-yard-in { inset: 19%; border-radius: 21%; background: rgba(255,255,255,.34); }
  .ld-spot { width: 19%; border: 0; background: rgba(255,255,255,.45); }
  /* the centre: four triangles pointing at the middle, in the colour of the lane they close */
  .ld-home {
    background:
      linear-gradient(45deg, transparent calc(50% - .17cqw), rgba(40,40,55,.45) 0 calc(50% + .17cqw), transparent 0),
      linear-gradient(135deg, transparent calc(50% - .17cqw), rgba(40,40,55,.45) 0 calc(50% + .17cqw), transparent 0),
      conic-gradient(from 315deg, var(--ld-blue) 0 25%, var(--ld-green) 0 50%, var(--ld-red) 0 75%, var(--ld-yellow) 0 100%);
    box-shadow: inset 0 0 0 .2cqw rgba(40,40,55,.45);
  }
  .ld-home::after { display: none; }

  /* a token is two overlapping discs with a heavy outline: the button itself is empty, ::before is the disc behind, ::after the one in front */
  html body.g-ludo .panel .ld-token { width: calc(100% / 15 * 0.9); border: 0; background: transparent; box-shadow: none; }
  html body.g-ludo .panel .ld-token::before, html body.g-ludo .panel .ld-token::after { content: ""; position: absolute; inset: 0; box-sizing: border-box; border: .6cqw solid #17171d; border-radius: 50%; }
  /* the disc under the token is the token's own colour, lightly shaded (it read as black on phones when mixed with black) */
  html body.g-ludo .panel .ld-token::before { transform: translateX(-36%); background: linear-gradient(rgba(0,0,0,.14), rgba(0,0,0,.14)), var(--tok); }
  html body.g-ludo .panel .ld-token::after { background: var(--tok); }
  html body.g-ludo .panel .ld-token.movable::after { inset: 0; background: var(--tok); box-shadow: 0 0 0 .7cqw var(--accent); }
  html body.g-ludo .panel .ld-token.done { box-shadow: none; }
  html body.g-ludo .panel .ld-token.done::after { box-shadow: 0 0 0 .4cqw #fff; }
  html body.g-ludo .panel .ld-token:hover::after, html body.g-ludo .panel .ld-token:focus-visible::after { background: var(--tok); }

  /* the dice row, centred: a die with a dark frame and a narrower ROLL button with a big label */
  .ld-controls { height: 15cqw; margin-top: 2.2cqw; gap: 11cqw; justify-content: center; }
  .ld-die { width: 15cqw; height: 15cqw; border: 1.1cqw solid #3a3d48; border-radius: 3cqw; box-shadow: none; }
  html body.fun.g-ludo .panel button.ld-roll { flex: 0 0 55cqw; min-height: 0; padding: 0; height: 15cqw; border-radius: 2.6cqw; font-size: 8.6cqw; letter-spacing: .02em; background: #d3594d; box-shadow: 0 1cqw 0 #a8453b; }

  /* the gear stays in the page column, and its menu opens across it */
  body.g-ludo .gk-optwrap { right: calc(max(0px, 50vw - 215px) + 12px) !important; }
  html body.fun.g-ludo[data-fun-zone] .gk-menu { position: fixed; top: 126px; left: max(8px, calc(50vw - 207px)); right: max(8px, calc(50vw - 207px)); }

  @media (max-width: 360px) { .ld-vs { width: 210px; } }
  /* PC side panels: this page is tall, so its board column is shorter than the standard one (measured: fits at 1280x900, 1366x768, 1440x900, 1920x1080) */
  @media (min-width: 1000px) and (min-height: 560px) { html body.fun.g-ludo[data-desk-panels] { --deskboard: clamp(300px, calc(100svh - 411px), 700px); } }
</style>
<script>try{var t=localStorage.getItem("games:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>

<body class="g-ludo fun" data-desk-panels data-fun-zone data-fun-reset>

<template id="man-ludo">
  <h2>Name</h2>
  <p>ludo — the classic cross-board race. Two to four players, four tokens each; first to bring all four home wins.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each player starts with four tokens in their yard. Roll a <strong>6</strong> to bring one out onto your coloured entry square.</li>
    <li>A token travels right around the loop, then up its own coloured column and into the home in the middle. You need the <strong>exact</strong> roll to finish.</li>
    <li>Land on an opponent on an ordinary square and their token goes back to their yard. Entry squares and the star squares are safe.</li>
    <li>A <strong>6</strong> earns another roll. Three 6s in a row forfeit the turn. If no token can move, the turn passes.</li>
    <li>If several tokens share a square, tap the one you want. There are no blockades.</li>
  </ul>

  <h2>Modes</h2>
  <ul>
    <li><strong>vs computer:</strong> choose 2, 3 or 4 players and Easy, Medium or Hard. You are red at the bottom left.</li>
    <li><strong>Online room:</strong> create a room for 2 to 4 people and send the invite link. The host can add computers to fill empty seats. The server rolls the die, so nobody can cheat it.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Getting tokens out is the slowest part, so a 6 is nearly always worth using for that. Watch the squares just in front of your tokens: an opponent six steps behind can send you home. The safe star squares are good places to wait.</p>
</template>
