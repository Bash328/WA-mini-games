<style>
  /* chunky look: tall board, you on the left + bottom store, them on the right + top store */
  html body.fun.g-mancala { --fun-bg: #2f3555; --fun-btn: #5a63b8; --fun-chip: rgba(255,255,255,.1); --vs-bg: #1c2038; --vs-l: #00c2ee; --vs-r: #ff5f56; }
  .mk-board {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1.05fr repeat(6, 1fr) 1.05fr;
    gap: 7px 6px; padding: 12px 14px; box-sizing: border-box;
    height: min(680px, calc(100dvh - 250px)); min-height: 440px; aspect-ratio: 298 / 680; width: auto; max-width: 100%; margin: 6px auto 0;
    background: #ffc473; border: 8px solid #000; border-radius: 52px;
    box-shadow: inset 0 0 0 6px #eeae5b, 14px 16px 0 rgba(0,0,0,.1);
  }
  /* #board-prefixed to beat the shared "body[class*='g-'] .panel button" rules */
  #board .mk-cell {
    position: relative; display: flex; align-items: center; padding: 0; min-height: 0; min-width: 0; border: 0; border-radius: 0;
    background: transparent; box-shadow: none; text-transform: none; cursor: pointer; color: inherit;
  }
  #board .mk-cell:disabled { cursor: default; opacity: 1; }
  #board .mk-pit.p1 { justify-content: flex-start; } #board .mk-pit.p2 { justify-content: flex-end; }
  .mk-cell .pit {
    position: relative; height: 90%; aspect-ratio: 1; border-radius: 50%; border: 6px solid #000; box-sizing: border-box; overflow: hidden;
    background: radial-gradient(circle at 30% 25%, #26cdf5, #00b4e4 60%, #0aa5d2);
  }
  #board .mk-pit.p2 .pit { background: radial-gradient(circle at 30% 25%, #ff7a70, #ff5f56 60%, #ee4f47); }
  .mk-cell .seed {
    position: absolute; width: 31%; aspect-ratio: 1; border-radius: 50%; background: #ffeec2; border: 3px solid #000; box-sizing: border-box;
    transform: translate(-50%, -50%); box-shadow: 1px 2px 0 rgba(0,0,0,.3);
  }
  #board .mk-pit { gap: 8px; }
  #board .mk-pit.p2 { flex-direction: row-reverse; justify-content: flex-start; }
  .mk-cell .num { font-size: 34px; line-height: 1; color: #c96a2d; opacity: .9; }
  #board .mk-pit.p1 .num { transform: rotate(90deg); }
  #board .mk-pit.p2 .num { transform: rotate(-90deg); }
  /* the two stores */
  #board .mk-store { grid-column: 1 / span 2; justify-content: center; border: 7px solid #000; border-radius: 40px; font-size: 30px; color: #fff; }
  #board .mk-store.p2 { grid-row: 1; background: linear-gradient(#ee4f47 0 18%, #ff6258 18%); }
  #board .mk-store.p1 { grid-row: 8; background: linear-gradient(#0aa5d2 0 18%, #00c2ee 18%); }
  #board .mk-store .store-n { text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  .mk-cell.last .pit { box-shadow: 0 0 0 4px #fff; }
  .mk-cell:not(:disabled):hover .pit { filter: brightness(1.1); }
  body.fun .gk-top-r { gap: 8px; }

<template id="man-mancala">
  <h2>Name</h2>
  <p>mancala (kalah) — sow seeds, fill your store.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each player has 6 pits and a store to their right. Every pit starts with 4 seeds.</li>
    <li>On your turn, pick one of your own non-empty pits. Pick up all its seeds and drop one in each pit going counter-clockwise, including your own store — but <strong>skip your opponent's store</strong>.</li>
    <li>Land your last seed in your <strong>own store</strong>: go again.</li>
    <li>Land your last seed in an <strong>empty pit on your own side</strong>: capture that seed plus everything in the pit directly opposite, into your store.</li>
    <li>When a player has no seeds left to move, the game ends — their opponent sweeps their own remaining seeds into their store. Most seeds in your store wins; equal is a draw.</li>
  </ul>

  <h2>Two players over WhatsApp</h2>
  <ul>
    <li>Whoever starts is <strong>Player 1</strong> (bottom row).</li>
    <li>Tap one of your pits to sow it. A store-landing move keeps your turn — you'll see "keep going" instead of a send button.</li>
  </ul>

  <h2>Same device</h2>
  <p class="muted">Pass the device when a turn ends. An extra turn (landing in your store) works the same way as over WhatsApp.</p>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> any of your own non-empty pits to sow it. Only your pits are tappable on your turn.</li>
  </ul>
</template>
