<style>
  .mem {
    display: grid;
    gap: 6px;
    width: min(460px, 100%);
    margin: 0 auto;
  }
  /* Note: game.js uses `.card` for memory tiles; hub also uses `.card`.
     Scoping to `.mem .card` avoids any cross-bleed. */
  .mem .card {
    aspect-ratio: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.4rem, 6vw, 2rem);
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
    min-height: 0;
    padding: 0;
  }
  .mem .card:hover { background: var(--panel); }
  .mem .card.flip { background: var(--panel); border-color: var(--border-hi); }
  .mem .card.match { border-color: var(--accent-2); }
  .mem .card .face { opacity: 0; transition: opacity 0.15s; }
  .mem .card.flip .face, .mem .card.match .face { opacity: 1; }


  /* chunky look: plum page, yellow tiles that turn white to show the fruit */
  html body.fun.g-memory { --fun-bg: #5e2a40; --fun-btn: #a8506f; --fun-chip: rgba(255,255,255,.1); }
  html body.fun.g-memory .panel .mem { width: 100%; gap: 10px; margin: 8px auto 0; }
  html body.fun.g-memory .panel .mem .card { background: #ffbf2e; border: 0; border-radius: 14px; box-shadow: 0 4px 0 #c98a00; transform: rotate(-1.5deg); transition: transform .15s, background .15s; }
  html body.fun.g-memory .panel .mem .card:nth-child(3n) { transform: rotate(2deg); }
  html body.fun.g-memory .panel .mem .card:nth-child(4n+1) { transform: rotate(-3deg); }
  html body.fun.g-memory .panel .mem .card:nth-child(5n+2) { transform: rotate(1deg); }
  html body.fun.g-memory .panel .mem .card:hover { background: #ffc94d; }
  html body.fun.g-memory .panel .mem .card.flip, html body.fun.g-memory .panel .mem .card.match { background: #fff; box-shadow: 0 4px 0 #c9b9c0; transform: rotate(0deg); }
  html body.fun.g-memory .panel .mem .card.match { opacity: .55; }
</style>

</main>

<template id="man-memory">
  <h2>Name</h2>
  <p>memory — flip pairs, clear the board. Head-to-head over WhatsApp, or solo against the clock.</p>

  <h2>Rules</h2>
  <ul>
    <li>All cards start face-down. Each symbol appears exactly twice.</li>
    <li>Flip two cards on your turn. If they match, they stay up; otherwise they flip back.</li>
    <li>Clear every pair to finish the game.</li>
  </ul>

  <h2>Two players over WhatsApp</h2>
  <ul>
    <li>Whoever starts is <strong>Player 1</strong>. Flip two cards; a <strong>match keeps your turn</strong> — keep flipping until you miss or clear the board.</li>
    <li>A miss ends your turn: tap <code>Send on WhatsApp</code> so your friend can take theirs.</li>
    <li>When every pair is matched, whoever matched <strong>more pairs</strong> wins. Equal counts are a draw.</li>
    <li>Pick the board size before the first flip; it's fixed after that.</li>
    <li>The card layout is rebuilt from a number inside the link. The page never shows it, but a determined friend could decode the link and work out where every card is, so play this one with friends you trust.</li>
  </ul>

  <h2>Solo</h2>
  <ul>
    <li>Clear the board in as few moves and as little time as possible. Best time is stored per board size.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap / click</strong> a card to flip it.</li>
    <li><code>New game</code> shuffles a fresh board. Size dropdown switches between 4×4, 6×6, 8×8.</li>
  </ul>
</template>
