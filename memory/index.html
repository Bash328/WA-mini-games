<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Google tag (gtag.js) — the library fetch is deferred to window load.
     This is the standard snippet with the async loader tag removed: gtag()
     queue in dataLayer and GA4 replays them once the library arrives, so
     no hits are lost. Keeps a third-party DNS + TLS handshake off the
     critical path in the WhatsApp in-app browser, where most first
     paints happen. charset moved first so it stays well inside the
     1024-byte window browsers scan for it. -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-RFN70FPWB1');
  addEventListener("load", function () {
    var s = document.createElement("script");
    s.async = true;
    s.src = "https://www.googletagmanager.com/gtag/js?id=G-RFN70FPWB1";
    document.head.appendChild(s);
  });
</script>
<title>memory · games</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Memory Match — take turns flipping pairs with a friend over WhatsApp, or race the clock solo.">
<meta property="og:title" content="Memory Match · two players over WhatsApp">
<meta property="og:description" content="Flip two cards on your turn. A match keeps your turn; a miss passes it on.">
<meta property="og:type" content="website">
<link rel="icon" type="image/svg+xml" href="../favicon.svg">
<link rel="apple-touch-icon" href="../favicon.svg">
<link rel="manifest" href="../manifest.json">
<link rel="stylesheet" href="../shared.css">
<link rel="stylesheet" href="../manpage.css">
<link rel="stylesheet" href="../soft.css">
<link rel="stylesheet" href="../async-share.css">
<style>
  .mem {
    display: grid;
    gap: 6px;
    width: min(460px, 100%);
    margin: 0 auto;
  }
  /* Note: game.js uses `.card` for memory tiles; hub also uses `.card`.
     Scoping to `.mem .card` avoids any cross-bleed. */
  .mem .card {
    aspect-ratio: 1;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.4rem, 6vw, 2rem);
    cursor: pointer;
    user-select: none;
    transition: transform 0.15s, background 0.15s, border-color 0.15s;
    min-height: 0;
    padding: 0;
  }
  .mem .card:hover { background: var(--panel); }
  .mem .card.flip { background: var(--panel); border-color: var(--border-hi); }
  .mem .card.match { border-color: var(--accent-2); }
  .mem .card .face { opacity: 0; transition: opacity 0.15s; }
  .mem .card.flip .face, .mem .card.match .face { opacity: 1; }

  select {
    background: var(--panel-2);
    color: var(--fg);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    padding: 8px 10px;
    font-family: inherit;
    font-size: var(--fs-sm);
    min-height: var(--tap);
  }
</style>
</head>
<body class="g-memory">
<main class="wrap">
  <div class="topbar">
    <h1>memory</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status">Flip two. Match all pairs.</p>
      <p class="status" id="stats">Moves: <span id="moves">0</span> · Time: <span id="time">0</span>s · Best: <span id="best">—</span></p>
      <p class="status" id="score" hidden></p>
      <button class="btn ghost tool-btn man-trigger" data-man="memory" data-man-title="MEMORY(1)" type="button">
        how to <span class="q">?</span>
      </button>
    </div>
    <div id="wa-ui" class="wa-ui" hidden></div>
    <div class="mem" id="board"></div>
    <div class="controls" style="justify-content:center">
      <button class="primary" id="reset">New game</button>
      <select id="mode" aria-label="Mode">
        <option value="whatsapp" selected>2 players · WhatsApp</option>
        <option value="solo">Solo</option>
      </select>
      <select id="size" aria-label="Board size">
        <option value="4">4×4</option>
        <option value="6" selected>6×6</option>
        <option value="8">8×8</option>
      </select>
    </div>
  </div>
</main>

<template id="man-memory">
  <h2>Name</h2>
  <p>memory — flip pairs, clear the board. Head-to-head over WhatsApp, or solo against the clock.</p>

  <h2>Rules</h2>
  <ul>
    <li>All cards start face-down. Each symbol appears exactly twice.</li>
    <li>Flip two cards on your turn. If they match, they stay up; otherwise they flip back.</li>
    <li>Clear every pair to finish the game.</li>
  </ul>

  <h2>Two players over WhatsApp</h2>
  <ul>
    <li>Whoever starts is <strong>Player 1</strong>. Flip two cards; a <strong>match keeps your turn</strong> — keep flipping until you miss or clear the board.</li>
    <li>A miss ends your turn: tap <code>Send on WhatsApp</code> so your friend can take theirs.</li>
    <li>When every pair is matched, whoever matched <strong>more pairs</strong> wins. Equal counts are a draw.</li>
    <li>Pick the board size before the first flip; it's fixed after that.</li>
  </ul>

  <h2>Solo</h2>
  <ul>
    <li>Clear the board in as few moves and as little time as possible. Best time is stored per board size.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap / click</strong> a card to flip it.</li>
    <li><code>New game</code> shuffles a fresh board. Size dropdown switches between 4×4, 6×6, 8×8.</li>
  </ul>
</template>

<script src="../gamekit.js"></script>
<script src="../vendor/lz-string.min.js"></script>
<script src="../async-share.js"></script>
<script src="game.js"></script>
<script defer src="../manpage.js"></script>
<script>window.addEventListener("load", () => Manpage.autoOpen("memory"));</script>
</body>
</html>
