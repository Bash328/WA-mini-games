<style>
  .ms {
    display: grid;
    gap: 2px;
    background: var(--bg-2);

    border-radius: var(--r-md);
    width: fit-content;
    max-width: 100%;
    margin: 0 auto;

    touch-action: manipulation;
  }
  /* Cells fill the grid tracks sized in game.js; the font size is set on the board. */
  .c {
    min-width: 0;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: var(--r-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    cursor: pointer;
    user-select: none;
    font-family: var(--font-mono);
    color: var(--fg);
    transition: background 0.08s, border-color 0.08s;
  }
  .c:hover { background: var(--panel); border-color: var(--border-hi); }
  .c.open {
    background: var(--bg);
    border-color: var(--border);
    cursor: default;
  }
  .c.open:hover { background: var(--bg); }
  .c.flag { background: rgba(245, 197, 66, 0.12); color: var(--accent); border-color: rgba(245, 197, 66, 0.4); }
  .c.mine { background: rgba(255, 107, 107, 0.18); color: var(--danger); border-color: var(--danger); }
  /* Amber-scale number colors */
  .n1 { color: #8ec9ff; }
  .n2 { color: var(--accent-2); }
  .n3 { color: var(--warn); }
  .n4 { color: var(--accent); }
  .n5 { color: #e08aff; }
  .n6 { color: #5fe0d2; }
  .n7 { color: var(--fg); }
  .n8 { color: var(--danger); }

  /* WhatsApp mode: underline tiles in the colour of the player who opened them */

  body.g-minesweeper .panel .c.last { outline: 2px solid var(--fg); outline-offset: -2px; }

<template id="man-minesweeper">
  <h2>Name</h2>
  <p>minesweeper — clear the board without setting off a mine. Head-to-head over WhatsApp, or solo.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each cell is either empty or contains a hidden mine.</li>
    <li>Revealing a numbered cell tells you how many mines touch it (8 neighbors).</li>
    <li>Revealing a blank (zero) cell auto-opens its neighbors in a flood.</li>
    <li>The first reveal is always safe.</li>
  </ul>

  <h2>Two players over WhatsApp</h2>
  <ul>
    <li>Take turns revealing <strong>one tile</strong>, then send the link. Whoever starts is Player 1.</li>
    <li>Reveal a mine and you <strong>lose immediately</strong>.</li>
    <li>If every safe tile gets revealed, whoever opened <strong>more tiles</strong> wins — a flood counts for the player who set it off. Equal counts are a draw.</li>
    <li>Tiles are underlined in the colour of the player who opened them. No flags in this mode.</li>
    <li>Pick the size before the first move; it's fixed after that.</li>
    <li>The mine layout is rebuilt from a number inside the link. The page never shows it, but a determined friend could decode the link and work out where every mine is, so play this one with friends you trust.</li>
  </ul>

  <h2>Solo</h2>
  <ul>
    <li>Reveal <strong>every</strong> non-mine cell to win. Reveal a mine to lose.</li>
    <li><strong>Long-press</strong> or <strong>right-click</strong> to place / remove a flag.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap / left-click</strong> a cell to reveal it.</li>
    <li><code>New game</code> re-deals. The size dropdown changes board size and mine count.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">If a number equals the count of flagged neighbors, all remaining neighbors are safe. If a number equals the count of unknown neighbors, they're all mines.</p>
</template>
