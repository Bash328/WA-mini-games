<style>
  .sk-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(6, 1fr);
    gap: 0;
    width: min(420px, 100%);
    aspect-ratio: 1;
    margin: 8px auto;
    border: 2px solid var(--accent);
    background: var(--bg-2);
  }
  .sk-cell {
    position: relative;
    border: 1px solid var(--border);
    background: var(--panel);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: clamp(1.6rem, 8vw, 2.3rem);
    font-weight: 500;
    color: var(--fg);
    cursor: pointer;
    user-select: none;
    min-width: 0;
  }
  /* Thick box boundaries (2×3 boxes: rows 0,1,2 break between 1-2, 3-4; cols 0..5 break at 2-3). */
  .sk-cell[data-r="1"], .sk-cell[data-r="3"] { border-bottom: 2px solid var(--accent); }
  .sk-cell[data-c="2"] { border-right: 2px solid var(--accent); }
  .sk-cell.given { color: var(--muted); background: var(--bg-2); font-weight: 700; }
  .sk-cell.sel { outline: 2px solid var(--accent); outline-offset: -2px; z-index: 1; }
  .sk-cell.peer { background: var(--panel-2); }
  .sk-cell.same-num { color: var(--accent); }
  .sk-cell.conflict { color: var(--danger); }
  .sk-cell .notes {
    position: absolute;
    inset: 3px;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    grid-template-rows: repeat(2, 1fr);
    font-size: clamp(0.7rem, 3vw, 0.85rem);
    font-weight: 600;
    color: var(--muted);
    pointer-events: none;
  }
  .sk-cell .notes span { display: flex; align-items: center; justify-content: center; }

  /* Number keys: one row of six large targets. */
  .sk-pad {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    width: min(420px, 100%);
    margin: 12px auto 0;
  }
  .sk-pad button {
    padding: 0;
    min-height: 56px;
    font-size: 1.5rem;
    font-weight: 700;
  }
  .sk-pad button.done { opacity: 0.3; }

  /* Pencil / Undo / Erase: icon over label, equal thirds. */
  .sk-actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    width: min(420px, 100%);
    margin: 10px auto 0;
  }
  .sk-act {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 8px 4px;
    min-height: 58px;
    font-family: inherit;
    font-size: var(--fs-sm);
    font-weight: 600;
  }
  .sk-act svg { width: 20px; height: 20px; flex: none; }
  .sk-act:disabled { opacity: 0.35; cursor: default; }

  .game-controls { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }

  /* chunky look: deep teal page, a white grid in a heavy black frame, blue digits that are yours. The grid and keys are themed
     by the --sk-* variables of shared.css, so the new look is just new values for them. */
  html body.fun.g-mini-sudoku.g-mini-sudoku { --fun-bg: #1f3b3b; --fun-btn: #4f8a86; --fun-chip: rgba(255,255,255,.1);
    --sk-grid: #fff; --sk-line: #2f3a46; --sk-cell: #fff; --sk-cell-b: #d5dbe3; --sk-digit: #1f6fe0; --sk-given: #f1f4f8; --sk-given-fg: #2f3a46;
    --sk-peer: #e6f0ff; --sk-given-peer: #dfe9f8; --sk-note: #6b7788; --sk-btn: #fff; --sk-btn-b: transparent; --sk-btn-hover: #f0f3f8; --sk-btn-hover-b: transparent; --sk-act: rgba(255,255,255,.12); }
  html body.fun.g-mini-sudoku.g-mini-sudoku .panel .sk-grid { width: calc(100% + 22px); margin: 8px -11px; box-sizing: border-box; max-width: none; border: 6px solid #000; border-radius: 22px; overflow: hidden; }
  html body.fun.g-mini-sudoku.g-mini-sudoku .panel .sk-cell { font-weight: 400; min-height: 0; font-size: clamp(1.4rem, 7vw, 2rem); }
  html body.fun.g-mini-sudoku.g-mini-sudoku .panel .sk-cell.given { font-weight: 400; }
  html body.fun.g-mini-sudoku.g-mini-sudoku .panel .sk-cell.same-num { background: #ffe8a3; color: #2f3a46; }
  html body.fun.g-mini-sudoku.g-mini-sudoku .panel .sk-cell.sel { background: #ffd23f; outline: 0; box-shadow: inset 0 0 0 3px #e0a800; }
  html body.fun.g-mini-sudoku.g-mini-sudoku .panel .sk-cell.conflict { color: #e8353a; }
  html body.fun.g-mini-sudoku.g-mini-sudoku .sk-pad { width: 100%; gap: 5px; grid-template-columns: repeat(auto-fit, minmax(0, 1fr)); }
  html body.fun.g-mini-sudoku.g-mini-sudoku .panel .sk-pad button { min-width: 0; min-height: 52px; border: 0; border-radius: 12px; background: #fff; color: #2f3a46; font-size: 1.5rem; font-weight: 400; box-shadow: 0 4px 0 #b9c2cc; }
  html body.fun.g-mini-sudoku.g-mini-sudoku .panel .sk-pad button.done { opacity: .3; }
  html body.fun.g-mini-sudoku.g-mini-sudoku .sk-actions { width: 100%; }
  html body.fun.g-mini-sudoku.g-mini-sudoku .panel .sk-act { background: rgba(255,255,255,.12); box-shadow: none; border: 0; border-radius: 16px; font-size: 14px; color: #fff; }
  html body.fun.g-mini-sudoku.g-mini-sudoku .panel .sk-act[aria-pressed="true"] { background: #ffbf2e; color: #5a3a00; }
  html body.fun.g-mini-sudoku.g-mini-sudoku .ok { color: #7dffa8; } html body.fun.g-mini-sudoku.g-mini-sudoku .bad { color: #ff8a7a; }
  /* PC side panels: this page is tall, so its board column is shorter than the standard one (measured: fits at 1280x900, 1366x768, 1440x900, 1920x1080) */
  @media (min-width: 1100px) and (min-height: 700px) { html body.fun.g-mini-sudoku[data-desk-panels] { --deskboard: clamp(300px, calc(100svh - 291px), 700px); } }
</style>

<template id="man-mini-sudoku">
  <h2>Name</h2>
  <p>mini-sudoku — 6×6 sudoku with 2×3 boxes.</p>

  <h2>Rules</h2>
  <ul>
    <li>Fill every empty cell with a digit from <strong>1 to 6</strong>.</li>
    <li>No digit may repeat in any <strong>row</strong>, any <strong>column</strong>, or any <strong>2×3 box</strong> (boxes are outlined in amber).</li>
    <li>Pre-filled cells (dim) are fixed and can't be changed.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap a cell</strong> to select it, then tap a number in the pad to place it.</li>
    <li>Tap <code>Pencil</code> to turn pencil-mark mode on or off; while it's on, number taps toggle small candidate notes instead of placing a value.</li>
    <li><code>Erase</code> clears the selected cell (its number and any notes).</li>
    <li>Keyboard: arrow keys move, <span class="k">1</span>–<span class="k">6</span> place a digit, <span class="k">P</span> toggles pencil, <span class="k">Del</span>/<span class="k">Backspace</span> clears.</li>
    <li><code>Undo</code> takes back your last entry (<span class="k">Ctrl</span>/<span class="k">⌘</span>+<span class="k">Z</span> on a keyboard). <code>↻ reset</code> clears all your entries.</li>
    <li><code>↻ new</code> generates a fresh puzzle at the current difficulty.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong> — ~22 clues given. <strong>Medium</strong> — ~18 clues. <strong>Hard</strong> — ~14 clues.</li>
    <li>Every puzzle has exactly one solution.</li>
  </ul>
</template>
