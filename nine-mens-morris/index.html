<style>
  /* the board: a 7x7 grid of points, with the 16 mill lines drawn under them */
  /* the wrap breaks out of the page padding; the board is centred inside it and
     shrinks on short screens so its bottom edge stays above the fold */
  .nmm-wrap { width: calc(100% + 22px); margin: 10px -11px 0; }
  .nmm-board {
    position: relative; display: grid;
    grid-template-columns: repeat(7, minmax(0, 1fr));
    grid-template-rows: repeat(7, minmax(0, 1fr));
    width: min(100%, max(264px, calc(100svh - 300px))); margin: 0 auto;
    aspect-ratio: 1; box-sizing: border-box; overflow: hidden;
    background: #e8d3a8; border: 6px solid #000; border-radius: 22px;
  }
  .nmm-lines { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .nmm-lines line { stroke: #755733; stroke-width: .07; stroke-linecap: round; }

  /* every point is a button the size of its whole grid cell, so it is easy to tap */
  html body.fun.g-nine-mens-morris #board .nmm-pt {
    position: relative; z-index: 1; display: flex; align-items: center; justify-content: center;
    width: 100%; height: 100%; min-width: 0; min-height: 0; margin: 0; padding: 0;
    border: 0; border-radius: 50%; background: transparent; box-shadow: none;
    color: inherit; font-size: 0; transform: none; cursor: default;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  html body.fun.g-nine-mens-morris #board .nmm-pt:hover,
  html body.fun.g-nine-mens-morris #board .nmm-pt:active {
    background: transparent; color: inherit; border: 0; box-shadow: none; transform: none; filter: none;
  }
  html body.fun.g-nine-mens-morris #board .nmm-pt:disabled { opacity: 1; }
  html body.fun.g-nine-mens-morris #board .nmm-pt.mine,
  html body.fun.g-nine-mens-morris #board .nmm-pt.dest,
  html body.fun.g-nine-mens-morris #board .nmm-pt.take,
  html body.fun.g-nine-mens-morris #board .nmm-pt.place { cursor: pointer; }
  #board .nmm-pt::before {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 15%; aspect-ratio: 1; border-radius: 50%; background: #6b4f2f; opacity: .55;
  }
  #board .nmm-pt.last::before { background: #ffbf2e; opacity: 1; box-shadow: 0 0 0 4px rgba(255,191,46,.28); }
  #board .nmm-pt.from::before { background: #ffbf2e; opacity: .7; }
  #board .nmm-pt.dest::after {
    content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 22%; aspect-ratio: 1; border-radius: 50%; background: #2f6b47; opacity: .9;
  }

  #board .nmm-pc {
    position: relative; z-index: 1; width: 74%; height: 74%; box-sizing: border-box;
    border: 3px solid #14100c; border-radius: 50%;
    display: grid; place-items: center; pointer-events: none;
  }
  #board .nmm-pc::after {
    content: ""; width: 40%; height: 40%; box-sizing: border-box; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.72);
  }
  #board .nmm-pc.p1 { background: #e05248; }
  #board .nmm-pc.p2 { background: #4a7fd8; }

  #board .nmm-pt.last .nmm-pc { outline: 2px dashed rgba(255,255,255,.9); outline-offset: 2px; }

<template id="man-nine-mens-morris">
  <h2>Name</h2>
  <p>nine men's morris â€” three rings, nine pieces each, and one spare move to trap a friend.</p>

  <h2>Rules</h2>
  <ul>
    <li>The board has <strong>24 points</strong>: three concentric squares joined at the middle of each side. <strong>Red</strong> has the first turn, <strong>Blue</strong> the second, and each has <strong>nine pieces</strong>.</li>
    <li><strong>Placement.</strong> Take turns putting one piece on an empty point. A straight row of three of your pieces is a <strong>mill</strong>: at once remove one of your opponent's pieces. You may not take a piece that is in a mill unless every opponent piece is in a mill.</li>
    <li>After all eighteen pieces are placed, each turn <strong>moves one piece</strong> to an empty point next to it. A piece may never land on another piece.</li>
    <li><strong>Flying.</strong> A player with exactly three pieces left may move to any empty point, not only a neighbouring one.</li>
    <li><strong>Win</strong> by reducing your opponent to fewer than three pieces, or by leaving them with no legal move on their turn. This version has no draw rule: play on until one side is trapped.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Placing:</strong> tap any empty point.</li>
    <li><strong>Moving:</strong> tap one of your pieces, then a marked point. Tap it again to put it back down.</li>
    <li><strong>After a mill:</strong> tap a ringed opponent piece to remove it. Pieces in mills are not ringed unless every piece is in one.</li>
    <li>Mills glow gold; the last piece moved is ringed in white. <code>undo</code> is there in the computer and same-device modes.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts the game is <strong>Red</strong> and moves first; your friend is <strong>Blue</strong>.</li>
    <li>Make your move, then tap <code>Send on WhatsApp</code>. If your move made a mill, choose the piece to remove first: both parts of the turn are yours, then send the link. <code>Copy link</code> works for any other messenger.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Every mill costs you a piece of your own shape: watch which lines you leave open. Blocking an opponent's mill is often worth more than making one, and in the endgame keep a spare point to move to â€” being shut in loses just as surely as being two pieces short.</p>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. You play in real time, with no link-passing. Rooms are deleted a day after the last move, or an hour after the game ends.</li>
  </ul>
</template>
