<style>
  .ng { display: grid; width: min(460px, 100%); margin: 8px auto; touch-action: none; user-select: none; -webkit-user-select: none; }
  .ng-corner { min-width: 28px; }
  .ng-clue { display: flex; font-size: clamp(0.65rem, 3vw, 0.85rem); font-weight: 600; color: var(--fg); }
  .ng-clue span { padding: 1px 2px; line-height: 1.1; }
  .ng-col { flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 3px; }
  .ng-row { flex-direction: row; align-items: center; justify-content: flex-end; padding-right: 6px; gap: 1px; }
  .ng-clue.done { color: var(--dim); opacity: .5; }
  /* a heavier line every five cells, to count by */
  .ng-col.sep, .ng-cell.vsep { border-right: 2px solid var(--border-hi); }
  .ng-row.sep, .ng-cell.hsep { border-bottom: 2px solid var(--border-hi); }
  .ng-cell { aspect-ratio: 1; background: var(--panel-2); border: 1px solid var(--border); cursor: pointer; position: relative; min-width: 0; }
  .ng-cell.vsep { border-right: 2px solid var(--border-hi); }
  .ng-cell.hsep { border-bottom: 2px solid var(--border-hi); }
  .ng-cell.on { background: var(--fg); border-color: var(--fg); }
  .ng-cell.mk::before, .ng-cell.mk::after { content: ""; position: absolute; left: 22%; right: 22%; top: 50%; height: 2px; background: var(--dim); }
  .ng-cell.mk::before { transform: rotate(45deg); }
  .ng-cell.mk::after { transform: rotate(-45deg); }
  .ng-tools { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: min(460px, 100%); margin: 10px auto 0; }
  .ng-tools .btn { min-height: 48px; font-weight: 600; }
  .ng-tools .btn.active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .game-controls { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }

  /* chunky look: deep violet page, white clues, a white grid, solid dark cells */

  html body.fun.g-nonogram .ng-clue.done { color: rgba(255,255,255,.4); opacity: 1; }
  html body.fun.g-nonogram .ng-cell { background: #fff; border: 1px solid #d8d2ea; }
  html body.fun.g-nonogram .ng-col.sep, html body.fun.g-nonogram .ng-cell.vsep { border-right: 3px solid #34285a; }
  html body.fun.g-nonogram .ng-row.sep, html body.fun.g-nonogram .ng-cell.hsep { border-bottom: 3px solid #34285a; }
  html body.fun.g-nonogram .ng-cell.on { background: #2f3a46; border-color: #2f3a46; }
  html body.fun.g-nonogram .ng-cell.mk::before, html body.fun.g-nonogram .ng-cell.mk::after { background: #b5a9d6; }
  html body.fun.g-nonogram .ng-tools { width: 100%; }

<template id="man-nonogram">
  <h2>Name</h2>
  <p>nonogram — colour in cells using number clues to reveal a hidden picture.</p>

  <h2>Rules</h2>
  <ul>
    <li>The numbers beside each <strong>row</strong> and above each <strong>column</strong> say how many filled cells in a row there are, in order. <strong>3 1</strong> means a run of three filled cells, a gap of at least one, then a single filled cell.</li>
    <li>Fill cells so every row and column matches its clues. A clue turns grey and crossed out once its line matches.</li>
    <li>Every puzzle can be solved by logic alone, with no guessing, and has exactly one answer.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a cell to fill it, tap again to clear it. <strong>Drag</strong> across cells to fill a whole run.</li>
    <li>Switch to <code>✕ Mark empty</code> to note cells you know are blank. Marks don't count toward the answer. Keyboard: <span class="k">X</span> swaps the tool.</li>
    <li><code>Undo</code> takes back your last stroke (<span class="k">Ctrl</span>/<span class="k">⌘</span>+<span class="k">Z</span>). <code>↻ reset</code> clears the grid; <code>↻ new</code> makes a fresh puzzle.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Start with the biggest clues: a clue of 8 in a 10-cell line must fill the middle six cells whatever happens. Then work out from the edges, marking cells you know are empty.</p>
</template>
