  .on-board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-template-rows: repeat(5, minmax(0, 1fr)); aspect-ratio: 1; gap: 2px; padding: 3px; background: #5a4a34; border-radius: var(--r-md); }

<template id="man-onitama">
  <h2>Name</h2>
  <p>onitama — a duel where the cards decide how your pieces move.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each side has <strong>four pawns and one master</strong> (the piece with the crown). Red starts at the bottom and goes first.</li>
    <li>Five move cards are in play: <strong>two in each hand</strong> and one beside the board. A card is a picture of where a piece may step; it is always shown from the point of view of whoever holds it.</li>
    <li>On your turn, play one of your two cards: move any piece by one of that card's steps, onto an empty square or onto an enemy piece to capture it. You may not land on your own piece.</li>
    <li>The card you used goes beside the board, and you take the card that was waiting there. Your opponent can use the card you just played on their next move after that, so every move also hands them something.</li>
    <li><strong>Win</strong> by capturing the enemy master, or by moving your own master onto the enemy temple (the dashed circle in the middle of their back row).</li>
    <li>If you have no legal move at all, you still have to give up one card: tap the card you want to pass.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap a piece, then tap a dotted square (a ring means it captures). To pick the card first, tap a card, then a piece.</li>
    <li>If two of your cards both reach the square you tapped, tap the card you want to spend.</li>
    <li>Use the mode menu to play the computer or share one device. <code>↶ undo</code> is there in those modes.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts the game is <strong>Red</strong>, goes first and deals the five cards; your friend is <strong>Blue</strong>.</li>
    <li>After each move, tap <code>Send on WhatsApp</code>. Your friend opens the link, sees your last move marked, moves and sends one back. <code>Copy link</code> works for any other messenger.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Look at what you are handing over, not just what you are taking: the card you play goes beside the board and your opponent will pick it up. Keep your master protected by pawns that can answer a capture, and watch for a card that lets the enemy master jump to your temple.</p>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. You play in real time, with no link-passing. Rooms are deleted a day after the last move, or an hour after the game ends.</li>
  </ul>
</template>
