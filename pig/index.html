<style>
  .pig-main { max-width: 420px; margin: 0 auto; }
  .pig-scores { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .pig-card { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 8px; border: 2px solid var(--border); border-radius: 14px; background: var(--bg-2); }
  .pig-card.on { border-color: var(--accent); }
  .pig-card.won { border-color: var(--forest); background: color-mix(in srgb, var(--forest) 14%, transparent); }
  .pig-name { font-size: var(--fs-sm); color: var(--muted); }
  .pig-num { font-size: 44px; font-weight: 700; line-height: 1; color: var(--fg); }
  .pig-bar { width: 100%; height: 6px; border-radius: 3px; background: var(--border); overflow: hidden; }
  .pig-bar i { display: block; height: 100%; background: var(--accent); transition: width .3s; }

<template id="man-pig">
  <h2>Name</h2>
  <p>pig — a dice game of nerve. First to 100 wins.</p>

  <h2>Rules</h2>
  <ul>
    <li>On your turn, <strong>roll</strong> a die as many times as you like, adding each roll to your <strong>turn total</strong>.</li>
    <li>Roll a <strong>1</strong> and you score nothing this turn: the turn total is lost and it's the other player's go.</li>
    <li>Or <strong>hold</strong> to bank your turn total into your score and end your turn.</li>
    <li>The first player to reach <strong>100</strong> points wins.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts is <strong>Player 1</strong>. A whole turn is one link: roll and hold (or bust), then tap <code>Send on WhatsApp</code>.</li>
    <li>Your friend sees what you rolled, takes their own turn, and sends a link back.</li>
    <li>Your browser makes your rolls, so this one runs on trust: there's no referee checking the dice.</li>
  </ul>

  <h2>Against the computer</h2>
  <ul>
    <li><strong>Easy</strong> banks as soon as it has 12. <strong>Medium</strong> holds at 20, the classic rule of thumb. <strong>Hard</strong> reads the score: it presses on when you're close to winning and plays safe when it's well ahead.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Over a whole game, holding at about 20 is hard to beat: the chance of rolling a 1 before you get there is about the same as what you'd lose. Take bigger risks only when you're behind and the other side is near 100.</p>
</template>
