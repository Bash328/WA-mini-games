<template id="man-quoridor">
  <h2>Name</h2>
  <p>quoridor — race to the far side, and build walls to slow the other pawn down.</p>

  <h2>Rules</h2>
  <ul>
    <li>A 9×9 board. <strong>Red</strong> starts at the bottom and goes first, <strong>Blue</strong> at the top. The first pawn to reach the far row wins.</li>
    <li>Each turn you do <strong>one</strong> of two things: step your pawn one square (up, down, left or right), or place one of your <strong>10 walls</strong>.</li>
    <li>A wall is two squares long and lies in the groove between squares. Pawns can't pass through walls.</li>
    <li>Walls can't cross or overlap another wall, and you may <strong>never block a pawn completely</strong>: there always has to be a way through to its goal.</li>
    <li>If the other pawn is right next to yours, you <strong>jump over it</strong>. If there is a wall (or the edge) behind it, you step diagonally past it instead.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li><strong>Move:</strong> tap a dotted square to step there.</li>
    <li><strong>Wall:</strong> tap <code>Wall</code>, then tap a spot where four squares meet. The wall shows lying along the groove. Tap the same spot again, or <code>Rotate</code>, to turn it; the ghost turns red when the spot isn't allowed. Then tap <code>Place</code>.</li>
    <li>Use the mode menu to play the computer or share one device. <code>↶ undo</code> is there in those modes.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts the game is <strong>Red</strong>; your friend is <strong>Blue</strong> and sees the board turned so that their pawn starts at the bottom.</li>
    <li>After your move, tap <code>Send on WhatsApp</code>. Your friend opens the link, sees your last move marked, moves and sends one back.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Count the steps each pawn needs. A wall is worth placing when it costs your opponent more steps than it costs you. Don't spend all your walls early: late in the race one well-placed wall can decide it.</p>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. You play in real time, with no link-passing. Rooms are deleted a day after the last move, or an hour after the game ends.</li>
  </ul>
</template>
