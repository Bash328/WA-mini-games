<template id="man-reversi">
  <h2>Name</h2>
  <p>reversi (othello) — flip your opponent's discs to your color.</p>

  <h2>Rules</h2>
  <ul>
    <li>Board is 8×8. Black opens with 4 discs already placed in the center.</li>
    <li>On your turn, place a disc so it flanks one or more of your opponent's discs in a straight line (any of 8 directions) with one of your own discs at the other end — all flanked discs flip to your color.</li>
    <li>If you have no legal move, your turn is skipped automatically. If neither player has a legal move, the game ends.</li>
    <li>When the board fills (or neither side can move), whoever has more discs wins. Equal counts are a draw.</li>
  </ul>

  <h2>Two players over WhatsApp</h2>
  <ul>
    <li>Whoever starts plays <strong>Black</strong> and moves first.</li>
    <li>Tap a highlighted square, then <code>Send on WhatsApp</code>. If your move leaves your friend with no legal move, the game skips their turn for you and you'll see "keep going" instead of a send button.</li>
  </ul>

  <h2>Same device</h2>
  <p class="muted">Pass the device after each move. A skipped turn is handled the same way — the board just tells you whose move it still is.</p>

  <h2>Controls</h2>
  <ul>
    <li><strong>Tap</strong> a highlighted square to place your disc there. Only legal moves are tappable.</li>
  </ul>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. Your friend joins in their browser and you play in real time, with no link-passing.</li>
    <li>If someone drops out they can rejoin with the same link. Rooms are deleted a day after the last move, or an hour after the game ends.</li>
  </ul>
</template>
