<style>
  .rps-choices {
    display: flex;
    justify-content: center;
    gap: 12px;
    flex-wrap: wrap;
    margin: 20px 0;
  }
  /* #choices-prefixed to beat the shared "body[class*='g-'] .panel
     button" rule (specificity 0-2-1 vs a plain class at 0-1-0), which was
     otherwise forcing a 10px radius instead of the intended 4px and a
     40px min-height — same fix as dots-and-boxes's #board .db-edge. */
  #choices .rps-choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    background: var(--panel-2);
    border: 1px solid var(--border-hi);
    border-radius: var(--r-md);
    padding: 16px 22px;
    font-family: inherit;
    font-size: var(--fs-sm);
    color: var(--fg);
    cursor: pointer;
    min-width: 88px;
    min-height: 0;
  }
  /* Hover only where a real pointer exists. On touch screens :hover sticks to
     the last tap, so after Player 1 picked, the identical button under their
     finger stayed highlighted for Player 2 - giving the pick away. */
  @media (hover: hover) and (pointer: fine) {
    #choices .rps-choice:hover { background: var(--panel); border-color: var(--accent); }
  }
  #choices .rps-choice:active { border-color: var(--accent); }
  .rps-hand { display: inline-block; line-height: 0; }
  .rps-hand svg { width: 44px; height: 62px; }
  .rps-hand.flip svg { transform: scaleX(-1); }

  /* The score: one big number a side. The last round sits under it in a
     fixed-height box so the buttons below never move when it fills in. */
  .rps-score { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; margin: 4px 0 8px; text-align: center; }
  .rps-side { display: flex; flex-direction: column; gap: 2px; }
  .rps-name { font-size: var(--fs-sm); color: var(--muted); }
  .rps-num { font-size: 52px; font-weight: 700; line-height: 1; color: var(--accent); }
  .rps-mid { font-size: var(--fs-sm); color: var(--muted); display: flex; flex-direction: column; }
  .rps-last { min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; }
  .rps-faceoff { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .rps-faceoff .rps-hand svg { width: 64px; height: 90px; }
  .rps-fighter { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: var(--fs-xs); color: var(--muted); }
  .rps-vs { color: var(--dim); font-size: var(--fs-sm); }
  .rps-verdict { margin: 0; font-weight: 700; font-size: var(--fs-md); }
  .rps-note { margin: 0; color: var(--muted); font-size: var(--fs-sm); }


  /* chunky look: ocean page, big score numbers, white choice cards */
  html body.fun.g-rock-paper-scissors { --fun-bg: #20405a; --fun-btn: #5a8fb8; --fun-chip: rgba(255,255,255,.1); transition: background-color .35s; }

  html body.fun.g-rock-paper-scissors .topbar h1 { font-size: 17px; line-height: 1.05; text-wrap: balance; padding: 0 4px; }
  /* fun.css styles any #score as a small dark pill; here #score is the real scoreboard */
  html body.fun.g-rock-paper-scissors .panel #score { display: grid; padding: 0; background: none; border-radius: 0; font-size: inherit; text-transform: none; margin: 8px 0; }
  html body.fun.g-rock-paper-scissors .rps-name { color: rgba(255,255,255,.75); font-size: 16px; }
  html body.fun.g-rock-paper-scissors .rps-num { font-size: 64px; font-weight: 400; color: #ffbf2e; }
  html body.fun.g-rock-paper-scissors .rps-last { color: rgba(255,255,255,.75); }
  html body.fun.g-rock-paper-scissors #choices .rps-choice { background: #fff; color: #2f3a46; border: 0; border-radius: 22px; box-shadow: 0 5px 0 #b9c2cc; padding: 18px 22px; font-size: 18px; opacity: 1; }
  @media (hover: hover) and (pointer: fine) { html body.fun.g-rock-paper-scissors #choices .rps-choice:hover { background: #f1f4f8; border: 0; } }
  html body.fun.g-rock-paper-scissors #choices .rps-choice:active { border: 0; transform: translateY(3px); box-shadow: none; }

<template id="man-rock-paper-scissors">
  <h2>Name</h2>
  <p>rock paper scissors — a match of hidden picks.</p>

  <h2>Rules</h2>
  <ul>
    <li>Rock beats scissors, scissors beats paper, paper beats rock. A tie replays the round.</li>
    <li>First to win a majority of rounds (2 of 3, 3 of 5, or 4 of 7) wins the match.</li>
  </ul>

  <h2>Two players over WhatsApp</h2>
  <ul>
    <li>There's no way to pick at the exact same instant over a link, so picks are hidden instead: <strong>Player 1</strong> picks first each round and sends the link without anyone seeing their pick rendered anywhere — <strong>Player 2</strong> then picks, which reveals both and resolves the round.</li>
    <li>Choose the match length before the first pick; it's fixed after that.</li>
    <li>Like Minesweeper's mine positions, the hidden pick technically travels inside the link's data — a determined player could dig it out of devtools. The UI just never shows it, which is enough for a normal game between friends.</li>
  </ul>

  <h2>Same device</h2>
  <p class="muted">Player 1 picks, then looks away (or hands off the device) before Player 2 picks — the app doesn't show Player 1's pick until both are in.</p>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. You both pick <em>at the same time</em>: your choice stays secret on the server until your opponent has picked too, then both are revealed together.</li>
    <li>The host chooses best of 3, 5 or 7 before creating the room. A tie just replays the round.</li>
  </ul>
</template>
