  /* Skull: a plum table, bone discs and a rose-red hand. 320px first. */
  html body.fun.g-skull {
    --fun-bg: #33263f;
    --fun-btn: #7a4a8f;
    --fun-chip: rgba(255,255,255,.1);
    background: radial-gradient(circle at 50% 0%, #463457 0%, #31243e 52%, #241a2d 100%);
    background-attachment: fixed;
  }
  #sk { display: none; }
  #sk.on { display: block; }

  .sk-seats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin: 4px 0 10px; }
  .sk-seat {
    position: relative; min-height: 98px; box-sizing: border-box; padding: 8px 9px 6px;
    border-radius: 16px; border: 2px solid transparent; background: rgba(0,0,0,.24);
    display: flex; flex-direction: column;
  }
  .sk-seat.act { border-color: #ffbf2e; background: rgba(255,191,46,.12); }
  .sk-seat.you { background: rgba(255,255,255,.09); }
  .sk-seat.you.act { background: rgba(255,191,46,.16); }
  .sk-seat.gone { opacity: .55; }
  .sk-seat.win { border-color: #2fb44a; }
  .sk-seat-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .sk-nm { font-size: 14px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sk-pts { font-size: 12px; color: #ffd24a; white-space: nowrap; }
  .sk-meta { font-size: 11px; color: rgba(255,255,255,.62); min-height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sk-stack { display: flex; align-items: center; gap: 3px; min-height: 26px; margin-top: 4px; flex-wrap: nowrap; }
  .sk-none { font-size: 11px; color: rgba(255,255,255,.42); }
  .sk-tag { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: rgba(255,255,255,.55); min-height: 1.2em; margin-top: auto; }

  /* A disc: a face-down ring of plum, or a cream face with a drawn rose / skull. */
  .sk-disc { position: relative; width: 26px; height: 26px; flex: none; border-radius: 50%; box-sizing: border-box; display: grid; place-items: center; }
  .sk-disc svg { width: 76%; height: 76%; display: block; }
  .sk-disc.down { background: repeating-linear-gradient(135deg, #5b3d70 0 3px, #4a305c 3px 6px); border: 2px solid #291936; box-shadow: 0 2px 0 rgba(0,0,0,.32); }
  .sk-disc.down::after { content: ""; width: 34%; height: 34%; border-radius: 50%; border: 2px solid rgba(255,255,255,.22); }
  .sk-disc.up.rose { background: #f6e7cd; color: #b83b4b; border: 2px solid #d8c19e; box-shadow: 0 2px 0 #a88a63; }
  .sk-disc.up.skull { background: #efe9dc; color: #2b2433; border: 2px solid #cfc5b1; box-shadow: 0 2px 0 #a89e8a; }
  .sk-disc.sm { width: 24px; height: 24px; }
  .sk-disc.lg { width: 46px; height: 46px; }
  .sk-disc.lg.up.rose, .sk-disc.lg.up.skull { border-width: 3px; }

  /* Every strip has one fixed height: a status change, a result or the controls
     swapping never moves the table. */
  .sk-banner {
    display: flex; align-items: center; justify-content: center; box-sizing: border-box;
    height: 58px; min-height: 58px; margin: 0 0 6px; padding: 7px 14px; border-radius: 999px;

  .sk-hand { display: flex; align-items: center; gap: 8px; height: 52px; min-height: 52px; overflow: hidden; }
  .sk-note { font-size: 13px; line-height: 1.25; color: rgba(255,255,255,.8); }

  .sk-controls { height: 108px; min-height: 108px; margin: 6px 0 2px; display: flex; flex-direction: column; justify-content: center; gap: 8px; box-sizing: border-box; }
  .sk-controls > .btn { width: 100%; }
  .sk-qty { display: flex; align-items: center; justify-content: center; gap: 14px; }

  .sk-actions { display: flex; gap: 8px; }

  .sk-hint { height: 36px; min-height: 36px; margin: 0; text-align: center; font-size: 13px; line-height: 1.2; color: rgba(255,255,255,.7); overflow: hidden; }

  html body.fun.g-skull .panel .sk-controls > .btn.primary { background: #2fb44a; box-shadow: 0 5px 0 #1c7a31; }

<template id="man-skull">
  <h2>Name</h2>
  <p>skull — the pure bluffing game of roses, skulls and one brave bid.</p>

  <h2>Rules</h2>
  <ul>
    <li>Every player starts with <strong>4 discs</strong>: <strong>3 roses</strong> and <strong>1 skull</strong>. The backs are identical. You only see the faces of your own discs (a challenge turns discs face up for everyone to see).</li>
    <li><strong>Place:</strong> in turn, everyone places at least one disc face down. Once everyone has placed one, a player may add another disc (one per turn, up to all four) or open the bidding. A player with no discs in hand must bid.</li>
    <li><strong>Bid:</strong> a bid says how many discs you can turn without finding a skull. The first bid is <strong>1 or more</strong>; every raise must be higher, and no bid may be more than the discs on the table. A player may pass, and then sits out the rest of the bidding.</li>
    <li>Bidding ends when everyone but one has passed, or when a bid reaches the number of discs on the table. That highest bidder must <strong>turn their bid</strong>.</li>
    <li><strong>Turn:</strong> the bidder turns their own discs first, from the most recently placed down. If the bid is bigger than their own stack, they then turn other players' discs in clockwise order. A <strong>skull</strong> ends the challenge at once: the bidder loses one random disc, permanently. No skull in the bid = the bidder wins the challenge and <strong>scores 1 point</strong>.</li>
    <li><strong>First to 2 points wins.</strong> A player who loses all discs is out; the last player with discs also wins.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>On your placement turn, <strong>tap a disc in your hand</strong> to put it face down. Tap a skull by mistake? It is placed face down; the page never tells the others.</li>
    <li>Once everyone has placed one, use <code>−</code> and <code>+</code> and <code>Bid</code> to open or raise. <code>Pass</code> leaves the bidding.</li>
    <li>If you win the bid, tap <code>Flip a disc</code> one disc at a time. The table shows every disc that has been turned.</li>
    <li>Against the computer, pick <strong>Easy / Medium / Hard</strong> and 2 to 5 computer players (3 to 6 at the table).</li>
  </ul>

  <h2>Playing online</h2>
  <ul>
    <li>Tap <strong>Online room</strong>, create a room and send the invite link. The room has 6 seats; computers fill any empty seats. The host starts the game.</li>
    <li>The server keeps every disc secret and sends you only your own. If you drop out for 90 seconds a computer plays for you until you return.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">A rose on top is a safe disc; a skull underneath is a bluff. Put a skull down early and roses over it, then bid only what you can safely turn. The tension is the bid that is one higher than your own roses: to win it you must reach into someone else's stack.</p>
</template>
