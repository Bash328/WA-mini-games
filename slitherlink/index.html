<template id="man-slitherlink">
  <h2>Name</h2>
  <p>slitherlink — draw one closed loop along the edges of the grid.</p>

  <h2>Rules</h2>
  <ul>
    <li>A <strong>number</strong> in a cell says how many of that cell's four sides are on the loop (0 to 3). A blank cell has no number.</li>
    <li>Draw only along the grid edges. The line is <strong>one closed loop</strong>: it never crosses itself, never branches, and every dot it uses has exactly two loop edges.</li>
    <li>Use every number exactly: a cell with 2 needs two of its sides on the loop, a cell with 0 needs none.</li>
    <li>Every puzzle has exactly one answer.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap or drag an edge to draw. Tap an edge that already has the same mark to erase it.</li>
    <li>The <strong>Line / X</strong> switch under the board chooses what a tap draws. X marks are notes; they do not count as lines.</li>
    <li><code>Hint</code> glows one edge from the answer. <code>Check</code> colours the numbers that are wrong. <code>undo</code> takes back a whole stroke; <code>restart</code> clears the board and the clock.</li>
    <li>The daily puzzle is the same for everyone at each level. The round button in the header starts a random puzzle; the level chips under Options pick 5×5, 7×7 or 10×10.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Start with the 3s: three of their sides must be lines. A 0 has no lines at all. At a dot with two lines already, every other edge there is out. An X is just as useful as a line for remembering what cannot be there.</p>
</template>
