<style>
  /* the board: a pale chart of ten region colours in a heavy dark frame, dark stars */
  .sb-board {
    --n: 8; position: relative; width: 100%; max-width: 460px; aspect-ratio: 1 / 1; box-sizing: border-box;
    display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); grid-template-rows: repeat(var(--n), minmax(0, 1fr));
    margin: 8px auto 6px; border: 6px solid #141024; border-radius: 22px; overflow: hidden; background: #141024;
    box-shadow: 0 5px 0 #0a0715; user-select: none; touch-action: manipulation;
  }
  html body.fun.g-star-battle .panel .sb-cell {
    position: relative; display: flex; align-items: center; justify-content: center;
    width: auto; height: auto; min-width: 0; min-height: 0; margin: 0; padding: 0; box-sizing: border-box;
    border: 0; border-radius: 0; box-shadow: none; background-color: var(--reg, #efe6d6); color: inherit;
    font-size: 0; line-height: 0; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    --wr: 0px; --wb: 0px; --cr: rgba(20, 16, 36, .22); --cb: rgba(20, 16, 36, .22);
    transition: filter .12s ease;
  }
  html body.fun.g-star-battle .panel .sb-cell:active { transform: none; box-shadow: none; filter: brightness(.9); }
  @media (hover: hover) {
    html body.fun.g-star-battle .panel .sb-cell:hover { background-color: var(--reg, #efe6d6); filter: brightness(1.04); }
  }
  /* thin lines inside a region, thick ones between regions; drawn on pseudo-elements so the
     star keeps the same size in every square. Right and bottom only, so no line is doubled. */
  html body.fun.g-star-battle .panel .sb-cell::before,
  html body.fun.g-star-battle .panel .sb-cell::after { content: ""; position: absolute; pointer-events: none; z-index: 1; }
  html body.fun.g-star-battle .panel .sb-cell::after { top: 0; bottom: 0; right: 0; width: var(--wr); background: var(--cr); }
  html body.fun.g-star-battle .panel .sb-cell::before { left: 0; right: 0; bottom: 0; height: var(--wb); background: var(--cb); }
  html body.fun.g-star-battle .panel .sb-cell.g-r { --wr: 1px; }
  html body.fun.g-star-battle .panel .sb-cell.g-b { --wb: 1px; }
  html body.fun.g-star-battle .panel .sb-cell.b-r { --wr: 2px; --cr: #141024; }
  html body.fun.g-star-battle .panel .sb-cell.b-b { --wb: 2px; --cb: #141024; }
  .sb-star {
    display: block; width: 64%; height: 64%; background: #23233f;
    clip-path: polygon(50% 0%, 61% 34%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 34%);
    opacity: 0; transform: scale(.35);
    transition: opacity .12s ease, transform .18s cubic-bezier(.2, .9, .3, 1.3), background-color .2s ease;
  }
  html body.fun.g-star-battle .panel .sb-cell.on .sb-star { opacity: 1; transform: scale(1); }
  /* a star that breaks a rule is tinted red; the region colour still shows through */
  html body.fun.g-star-battle .panel .sb-cell.bad { background-image: linear-gradient(rgba(202, 58, 45, .52), rgba(202, 58, 45, .52)); }
  html body.fun.g-star-battle .panel .sb-cell.bad .sb-star { background: #5c0f07; }
  html body.fun.g-star-battle .panel .sb-cell.hint { box-shadow: inset 0 0 0 3px #ffb21f; }
  html body.fun.g-star-battle .panel .sb-cell.hint .sb-star { opacity: .45; transform: scale(.8); background: #ffb21f; }
  .sb-board.won { box-shadow: 0 0 0 3px #ffd23f, 0 5px 0 #0a0715; }
  /* ten well-separated region colours, warm then cool */
  .sb-cell.c0 { --reg: #f2cf7c; }
  .sb-cell.c1 { --reg: #9ecbe8; }
  .sb-cell.c2 { --reg: #efa07f; }
  .sb-cell.c3 { --reg: #a9d9a1; }
  .sb-cell.c4 { --reg: #c9b8e8; }
  .sb-cell.c5 { --reg: #f1b9ce; }
  .sb-cell.c6 { --reg: #c8dd8b; }
  .sb-cell.c7 { --reg: #e9c9a1; }
  .sb-cell.c8 { --reg: #93d6ce; }
  .sb-cell.c9 { --reg: #f3b36f; }
  .sb-hint { min-height: 2.7em; max-width: 460px; margin: 4px auto 0; padding: 0 4px; text-align: center; font-size: clamp(13px, 4.1vw, 15px); line-height: 1.3; color: var(--muted); }
  .sb-opts { display: flex; gap: 8px; max-width: 460px; margin: 6px auto 0; }

  /* chunky look: a night-blue page, a heavy sand board, flat stars */
  html body.fun.g-star-battle { --fun-bg: #1d2445; --fun-btn: #4f5cae; --fun-chip: rgba(255,255,255,.1); }
  html body.fun.g-star-battle .panel .sb-opts .btn {
    flex: 1 1 0; min-width: 0; min-height: 44px; padding: 0 8px;
    background: var(--fun-chip); color: #fff; box-shadow: none; border-radius: 999px; font-size: 15px;
  }
  html body.fun.g-star-battle .panel .sb-opts .btn:hover { background: var(--fun-chip); filter: brightness(1.2); }
  html body.fun.g-star-battle .panel .sb-opts .btn:active { transform: translateY(2px); box-shadow: none; }
  html body.fun.g-star-battle .panel #chips { flex-wrap: wrap; justify-content: center; max-width: 100%; }
  html body.fun.g-star-battle .panel #chips .chip { min-height: 38px; padding: 4px 8px; font-size: 13px; }
  /* keep the Options bar, the hint line and the toolbar the same width as the board on a desktop */
  html body.fun.g-star-battle .panel .gk-optwrap,
  html body.fun.g-star-battle .panel .gk-slot,
  html body.fun.g-star-battle .panel .toolbar { max-width: 460px; margin-left: auto; margin-right: auto; }
  @media (max-width: 360px) {
    html body.fun.g-star-battle .fun-pills b { font-size: 17px; }
  }
  @media (prefers-reduced-motion: reduce) {
    html body.fun.g-star-battle .panel .sb-cell { transition: none; }
    .sb-star { transition: none; }
  }
</style>

<template id="man-star-battle">
  <h2>Name</h2>
  <p>star battle — a logic puzzle with stars, lines and coloured regions.</p>

  <h2>Rules</h2>
  <ul>
    <li>The <strong>6×6 and 8×8 boards take one star</strong> in every row, every column and every coloured region. The <strong>10×10 board takes two stars</strong> in each.</li>
    <li>No two stars may <strong>touch</strong>, not even at a corner.</li>
    <li>Every puzzle has exactly one answer.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap a square to put a star there; tap it again to take it away.</li>
    <li>A star that breaks a rule — two touching, or too many in one row, column or region — turns red while you play.</li>
    <li><code>Hint</code> marks one square from the answer. <code>Check</code> says what is still wrong. <code>↶ undo</code> takes back your last star; <code>restart</code> clears the board and the clock.</li>
    <li>The puzzle is the same for everyone each day, at each level. The round <code>↻</code> button in the header gives a random one; the level chips under Options pick 6×6, 8×8 or 10×10.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Start with a small region: if it has only as many squares as it needs stars, every square in it is a star. No square touching a star can hold one either, and a line that already has all its stars leaves the rest of that line empty.</p>
</template>
