<style>
  .tb-wrap { width: 100%; margin: 6px 0 0; }
  .tb-board {
    display: grid;
    grid-template-columns: repeat(9, minmax(0, 1fr));
    grid-template-rows: repeat(9, minmax(0, 1fr));
    aspect-ratio: 1;
    width: calc(100% + 22px);
    margin: 4px -11px 8px;
    box-sizing: border-box;
    background: #1c2621;
    border: 6px solid #0e1512;
    border-radius: 10px;
    overflow: hidden;
  }
  #board .tb-cell {
    position: relative;
    min-height: 0;
    min-width: 0;
    margin: 0;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: #ead8b5;
    cursor: default;
    font-size: 0;
    opacity: 1;
    box-shadow: none;
    transform: none;
  }
  #board .tb-cell.dark { background: #d6be93; }
  /* the throne: a ring, so the empty centre still reads as a special square */
  #board .tb-cell.throne::before {
    content: "";
    position: absolute;
    inset: 9%;
    border: 2px solid rgba(92, 64, 26, .38);
    border-radius: 50%;
    pointer-events: none;
    z-index: 0;
  }
  /* the four corners are the king's way out: a warm wash */
  #board .tb-cell.corner::before {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 50%, rgba(255, 190, 60, .42), rgba(255, 190, 60, 0) 72%);
    pointer-events: none;
    z-index: 0;
  }
  #board .tb-cell.mine, #board .tb-cell.dest { cursor: pointer; }
  #board .tb-cell:disabled { opacity: 1; cursor: default; }
  #board .tb-cell.from { box-shadow: inset 0 0 0 2px rgba(40, 46, 60, .3); }
  #board .tb-cell.last { box-shadow: inset 0 0 0 3px rgba(255, 191, 46, .65); }
  #board .tb-cell.sel { box-shadow: inset 0 0 0 4px #ffbf2e; }
  #board .tb-cell.dest::after {
    content: "";
    position: absolute;
    inset: 40%;
    border-radius: 50%;
    background: rgba(24, 28, 38, .55);
    pointer-events: none;
    z-index: 2;
  }
  .tb-pc {
    position: absolute;
    inset: 12%;
    border-radius: 50%;
    box-sizing: border-box;
    pointer-events: none;
    z-index: 1;
  }
  .tb-pc.p1 {
    background: radial-gradient(circle at 36% 30%, #5b6573, #222a32 76%);
    border: 2px solid #0b1014;
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, .22), 0 2px 0 rgba(0, 0, 0, .35);
  }
  .tb-pc.p2 {
    background: radial-gradient(circle at 36% 30%, #fffdf4, #d8c7a4 78%);
    border: 2px solid #6b593a;
    box-shadow: inset 0 3px 0 rgba(255, 255, 255, .7), 0 2px 0 rgba(0, 0, 0, .3);
  }
  .tb-pc.king {
    inset: 7%;
    background: radial-gradient(circle at 36% 30%, #ffe9a6, #db9d1d 78%);
    border: 2px solid #5d3f00;
    box-shadow: inset 0 0 0 2px rgba(94, 64, 0, .4), 0 2px 0 rgba(0, 0, 0, .35);
  }
  .tb-pc.king::after {

    border-radius: 1px;

<template id="man-tablut">
  <h2>Name</h2>
  <p>tablut — a Viking siege game on a 9×9 board: get the king out, or close the ring around him.</p>

  <h2>Rules</h2>
  <ul>
    <li>The board is 9×9. The <strong>king</strong> starts on the centre square, the <strong>throne</strong>, with <strong>eight defenders</strong> around him. <strong>Sixteen attackers</strong> hold the middle of the four edges. <strong>Attackers move first.</strong></li>
    <li>Every piece moves like a rook: any distance along its rank or file, over empty squares, and never through another piece.</li>
    <li>Only the king may stand on the <strong>throne</strong> or on a <strong>corner</strong>. Anyone may slide over the empty throne.</li>
    <li>Capture a soldier by squeezing it between <strong>two of your own soldiers</strong> on a rank or file. The edge, the throne and the corners do not squeeze soldiers. A piece that moves into a gap between two enemies is not captured.</li>
    <li>One move can capture more than one soldier. The king never captures, and the king cannot squeeze a piece for the defenders either.</li>
    <li>The king is captured when <strong>all four of his sides are blocked</strong> by attackers, by the edge of the board, by the empty throne, or by a corner. In the open that takes four attackers; against the throne or an edge, three; with an edge and a corner behind him, two.</li>
    <li><strong>Defenders win</strong> the moment the king stands on any corner. <strong>Attackers win</strong> by capturing the king, or if the defenders have no legal move.</li>
    <li>There is no draw: play on until the king escapes or is surrounded.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap one of your pieces, then tap a marked square. Tap the piece again, or empty space, to let it go.</li>
    <li>The square a piece came from and the square it reached stay marked in amber. The last move is shown for both players.</li>
    <li>Against the computer, pick <strong>Easy / Medium / Hard</strong> and whether you play the attackers (who move first) or the defenders.</li>
    <li><code>undo</code> sits below the board against the computer and on one device. The round arrow in the header always starts a new game.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts the game is the <strong>attackers</strong> and makes the first move; your friend is the <strong>defenders</strong>.</li>
    <li>After each move tap <code>Send on WhatsApp</code>. Your friend opens the link, sees your move marked, moves and sends one back. <code>Copy link</code> works for any other messenger.</li>
    <li>A link opened twice shows the latest move, so a refresh never loses the game.</li>
  </ul>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. You play in real time, with no link-passing. Rooms are deleted a day after the last move, or an hour after the game ends.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Attackers: close the files around the king and use the throne as a wall. Do not trade soldier for soldier — every attacker counts. Defenders: keep a shield beside the king, look for a clear rank or file to a corner, and remember that soldiers are safe beside the throne, the edges and the corners.</p>
</template>
