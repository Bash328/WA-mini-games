<template id="man-ultimate-tic-tac-toe">
  <h2>Name</h2>
  <p>ultimate tic-tac-toe — nine tic-tac-toe boards in one big board.</p>

  <h2>Rules</h2>
  <ul>
    <li>The big board is a 3×3 grid of small boards. <strong>X</strong> opens and may play in any cell of any small board.</li>
    <li><strong>Where you play decides where your opponent must play.</strong> Take the top-right cell of a small board and your opponent has to play in the <em>top-right small board</em>. The board you must play in is highlighted.</li>
    <li>Win a small board with three in a row and it becomes yours (it gets a big X or O). Won or full boards take no more moves.</li>
    <li>If you are sent to a board that is already won or full, you may play in <strong>any</strong> open board.</li>
    <li>Win <strong>three small boards in a row</strong> on the big board to win the game. If every board is decided and nobody has a line, it's a draw.</li>
  </ul>

  <h2>Playing over WhatsApp</h2>
  <ul>
    <li>Whoever starts is <strong>X</strong>. After each move, tap <code>Send on WhatsApp</code>; your friend sees your last mark outlined and which board they must play in.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap a cell in a highlighted board. Use the mode menu to play the computer (Easy / Medium / Hard) or share one device; <code>↶ undo</code> is there in those modes.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Don't just win small boards: look at which board your move sends your opponent to. Sending them to a board where they can win, or to a full board (which frees them to play anywhere), is the usual way to lose.</p>

  <h2>Live online</h2>
  <ul>
    <li>Tap <strong>Online</strong>, create a room and send the invite link. Your friend joins in their browser and you play in real time.</li>
  </ul>
</template>
