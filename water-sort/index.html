<html lang="en">
<head>
<meta charset="utf-8">
<script src="../ga.js"></script>
<title>water sort · games</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Water Sort — pour the coloured water between tubes until every tube holds a single colour. A new daily puzzle in three levels, or a random one.">

<style>
  .ws-tubes { --per: 5; display: grid; grid-template-columns: repeat(var(--per), 1fr); gap: 14px 8px; width: min(480px, 100%); margin: 14px auto 8px; padding: 0 4px; box-sizing: border-box; }
  body.g-water-sort .panel .ws-tube { position: relative; width: 100%; max-width: 64px; margin: 0 auto; aspect-ratio: 1 / 3.5; min-height: 0; min-width: 0; padding: 3px; display: flex; flex-direction: column-reverse; justify-content: flex-start; gap: 2px; box-sizing: border-box; background: color-mix(in srgb, var(--fg) 7%, transparent); border: 2px solid color-mix(in srgb, var(--fg) 35%, transparent); border-radius: 6px 6px 22px 22px; cursor: pointer; transition: transform .12s; }
  body.g-water-sort .panel .ws-tube.sel { transform: translateY(-14px); border-color: var(--accent); }
  body.g-water-sort .panel .ws-tube.hint { border-color: #7fe0a0; box-shadow: 0 0 0 3px rgba(127,224,160,.45); }
  body.g-water-sort .panel .ws-tube.hint.to { box-shadow: 0 0 0 3px rgba(241,210,122,.55); border-color: #f1d27a; }
  body.g-water-sort .panel .ws-tube.done { border-color: #7fe0a0; }
  body.g-water-sort .panel .ws-tube.poured { animation: ws-pop .25s; }
  @keyframes ws-pop { 50% { transform: scale(1.06); } }
  .ws-l { width: 100%; height: calc((100% - 6px) / 4); border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: rgba(0,0,0,.55); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18); }
  .ws-l:first-child { border-radius: 4px 4px 16px 16px; }
  .ws-hint { text-align: center; color: var(--muted); font-size: var(--fs-sm); min-height: 1.6em; }
  .ws-opts { display: flex; justify-content: center; gap: 8px; margin: 4px 0; }
  .ws-opts .btn.on { background: var(--fg); color: var(--bg); }
</style>
<script>try{var t=localStorage.getItem("games:theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>

<body class="g-water-sort">
<main class="wrap">
  <div class="topbar">
    <h1>water sort</h1>
    <a class="back" href="../">← all games</a>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status">Sort the colours.</p>
      <p class="status">Moves: <span id="moves">0</span> · Best: <span id="best">—</span></p>
      <button class="btn ghost tool-btn man-trigger" data-man="water-sort" data-man-title="WATER-SORT(1)" type="button">
        how to <span class="q">?</span>
      </button>
    </div>
    <div class="game-controls">
      <div class="chips" id="chips" role="tablist" aria-label="Difficulty">
        <button class="chip" data-diff="easy" role="tab" type="button">Easy · 5</button>
        <button class="chip" data-diff="medium" role="tab" type="button">Med · 8</button>
        <button class="chip" data-diff="hard" role="tab" type="button">Hard · 12</button>
      </div>
      <button class="btn ghost tool-btn" id="new-btn" type="button"><span class="glyph">↻</span> new</button>
    </div>
    <div class="ws-tubes" id="tubes" role="group" aria-label="Tubes"></div>
    <div class="ws-hint" id="hint"></div>
    <div class="ws-opts">
      <button class="btn ghost" id="hint-btn" type="button">Hint</button>
      <button class="btn ghost" id="sym-btn" type="button">Show letters</button>
    </div>
    <div class="toolbar">
      <button class="btn ghost tool-btn" id="undo-btn" type="button"><span class="glyph">↶</span> undo</button>
      <button class="btn ghost tool-btn" id="reset-btn" type="button"><span class="glyph">↻</span> restart</button>
    </div>
  </div>
</main>

<template id="man-water-sort">
  <h2>Name</h2>
  <p>water sort — pour the colours apart.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each tube holds up to <strong>4 layers</strong> of coloured water. The goal is for every tube to be <strong>empty or full of one colour</strong>.</li>
    <li>Pour from one tube into another. You can pour when the <strong>top colour matches</strong> the top colour of the tube you pour into (or that tube is empty) and there's <strong>room</strong>.</li>
    <li>All the layers of that colour on top pour together, as many as fit.</li>
    <li>Every puzzle can be solved. Fewer moves is better.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap a tube to lift it, then tap the tube to pour into. Tap the same tube again to put it down.</li>
    <li><code>Hint</code> shows a good next pour (green is the tube to pour from, yellow the one to pour into). <code>Show letters</code> puts a letter on every colour. <code>↶ undo</code> takes back a pour; <code>↻ restart</code> starts the same puzzle again.</li>
    <li>The puzzle is the same for everyone each day, at each level. <code>↻ new</code> gives a random one.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Keep an empty tube free as long as you can. Pour onto the same colour first, and uncover colours you need before you bury them. Never pour a layer onto a different colour unless there is room to move it again.</p>
</template>
