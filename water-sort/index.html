<template id="man-water-sort">
  <h2>Name</h2>
  <p>water sort — pour the colours apart.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each tube holds up to <strong>4 layers</strong> of coloured water. The goal is for every tube to be <strong>empty or full of one colour</strong>.</li>
    <li>Pour from one tube into another. You can pour when the <strong>top colour matches</strong> the top colour of the tube you pour into (or that tube is empty) and there's <strong>room</strong>.</li>
    <li>All the layers of that colour on top pour together, as many as fit.</li>
    <li>Every puzzle can be solved. Fewer moves is better.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap a tube to lift it, then tap the tube to pour into. Tap the same tube again to put it down.</li>
    <li><code>Hint</code> shows a good next pour (green is the tube to pour from, yellow the one to pour into). <code>Show letters</code> puts a letter on every colour. <code>↶ undo</code> takes back a pour; <code>↻ restart</code> starts the same puzzle again.</li>
    <li>The puzzle is the same for everyone each day, at each level. <code>↻ new</code> gives a random one.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Keep an empty tube free as long as you can. Pour onto the same colour first, and uncover colours you need before you bury them. Never pour a layer onto a different colour unless there is room to move it again.</p>
</template>
