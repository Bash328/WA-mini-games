<template id="man-word-ladder">
  <h2>Name</h2>
  <p>word ladder — climb from one word to another, one letter at a time.</p>

  <h2>Rules</h2>
  <ul>
    <li>You start with the word at the top and must reach the dashed word at the bottom.</li>
    <li>Each step changes <strong>exactly one letter</strong> and must make a <strong>real word</strong>: <em>COLD → CORD → CARD → WARD → WARM</em>. You can't use a word twice.</li>
    <li>You get a "best possible" number: the fewest steps there is. Reach the target in that many for a <strong>Perfect</strong>.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Type with the keyboard or the on-screen keys and press <code>Enter</code>. The letter that changed is highlighted in each step.</li>
    <li><code>Undo</code> removes your last step. <code>hint</code> fills in the next word of a shortest route: one hint per puzzle, and <code>↻ reset</code> does not give it back (a hinted solve does not count for your best). <code>↻ reset</code> starts the ladder again; <code>↻ new</code> makes a new puzzle.</li>
  </ul>

  <h2>Difficulty</h2>
  <ul>
    <li><strong>Easy</strong>: 3 or 4 steps. <strong>Medium</strong>: 5 or 6. <strong>Hard</strong>: 7 or more. Every puzzle can be solved.</li>
  </ul>

  <h2>Strategy</h2>
  <p class="muted">Work from both ends: look at the target and think of words next to it, then try to meet in the middle. Changing a vowel is often the way to reach a new neighbourhood of words.</p>
</template>
