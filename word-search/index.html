<style>
  /* the board: a white paper grid in a heavy black frame, letters straight on it.
     The cell size (and font) follow the grid size, so 12x12 still fits a 320px phone. */
  .ws-board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(var(--n, 8), 1fr);
    grid-template-rows: repeat(var(--n, 8), 1fr);
    width: min(430px, 100%);
    aspect-ratio: 1;
    margin: 4px auto 0;
    background: #fff;
    border: 5px solid #000;
    border-radius: 20px;
    overflow: hidden;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  .ws-cell {
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    min-width: 0;
    min-height: 0;
    font-size: clamp(12px, calc(min(430px, 100vw - 22px) / var(--n, 8) * 0.62), 28px);
    line-height: 1;
    color: #2f3a46;
    text-transform: uppercase;
    box-shadow: inset -1px -1px 0 #e3e8ef;
    transition: background-color .08s linear, color .08s linear;
    cursor: pointer;
  }
  .ws-cell.sel { background: #243b55; color: #fff; }
  .ws-cell.found { background: var(--wc, #2f8f63); color: #fff; }
  .ws-cell.found.sel { background: #243b55; color: #fff; }
  .ws-cell.hint { box-shadow: inset 0 0 0 3px #ffbf2e, inset -1px -1px 0 #e3e8ef; }
  .ws-cell.found.hint { box-shadow: inset 0 0 0 3px #ffbf2e, inset 0 0 0 5px rgba(255,255,255,.55); }

  /* the words to find: a plain list of pills, filled in when found */
  .ws-count {
    margin: 9px 0 0;
    text-align: center;
    color: rgba(255,255,255,.75);
    font-size: 13px;
    letter-spacing: .08em;
    text-transform: uppercase;
  }
  .ws-count b { color: #fff; font-weight: 400; }
  .ws-words {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    width: min(430px, 100%);
    margin: 6px auto 0;
  }
  .ws-word {
    padding: 5px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,.14);
    color: #fff;
    font-size: 13px;
    line-height: 1.2;
    letter-spacing: .06em;
    text-transform: uppercase;
  }
  .ws-word.found { background: var(--wc, #2f8f63); text-decoration: line-through; text-decoration-thickness: 2px; }
  .ws-word.hinted { box-shadow: 0 0 0 2px #ffbf2e; }

  /* the three size chips share the row, so "Med 10×10" still fits the Options popover on a 320px phone */
  #chips { display: flex; width: 100%; max-width: 360px; }
  #chips .chip { flex: 1 1 0; min-width: 0; padding: 6px 4px; font-size: 12px; white-space: nowrap; }

  /* chunky look: a green page, a white board with a black frame, amber for a hint */
  html body.fun.g-word-search { --fun-bg: #234e3b; --fun-btn: #3f8a5f; --fun-chip: rgba(255,255,255,.1); }
  /* the header keeps the restart and how-to circles, so the two pills get a narrow share of 320px */
  body.fun.g-word-search .fun-pills div { padding: 0 2px; }
  body.fun.g-word-search .fun-pills b { font-size: 18px; }

  @media (prefers-reduced-motion: reduce) { .ws-cell { transition: none; } }
</style>

<body class="g-word-search fun" data-fun-zone="mini" data-fun-reset data-next="Next puzzle">
<main class="wrap">
  <div class="topbar">
    <h1>word search</h1>
    <a class="back" href="../">← all games</a>
    <div class="fun-pills">
      <div><small>Time</small><b id="time">0:00</b></div>
      <div class="best"><small>Best</small><b id="best">—</b></div>
    </div>
  </div>
  <div class="panel">
    <div class="row">
      <p class="status" id="status" aria-live="polite">Find the words.</p>
      <button class="btn ghost tool-btn man-trigger" data-man="word-search" data-man-title="WORD-SEARCH(1)" type="button">
        how to <span class="q">?</span>
      </button>
    </div>
    <div class="game-controls">
      <div class="chips" id="mode-chips" role="tablist" aria-label="Daily or random">
        <button class="chip" data-diff="daily" role="tab" type="button">Daily</button>
        <button class="chip" data-diff="random" role="tab" type="button">Random</button>
      </div>
      <div class="chips" id="chips" role="tablist" aria-label="Difficulty">
        <button class="chip" data-diff="easy" role="tab" type="button">Easy 8×8</button>
        <button class="chip" data-diff="medium" role="tab" type="button">Med 10×10</button>
        <button class="chip" data-diff="hard" role="tab" type="button">Hard 12×12</button>
      </div>
      <button class="btn ghost tool-btn" id="new-btn" type="button"><span class="glyph">↻</span> new</button>
    </div>
    <div class="ws-board" id="board" aria-label="Word search board"></div>
    <p class="ws-count">Found <b id="found">0/0</b></p>
    <div class="ws-words" id="words" aria-label="Words to find"></div>
    <div class="toolbar">
      <button class="btn ghost tool-btn" id="hint-btn" type="button">hint</button>
      <button class="btn ghost tool-btn" id="reset-btn" type="button"><span class="glyph">↻</span> restart</button>
    </div>
  </div>
</main>

<template id="man-word-search">
  <h2>Name</h2>
  <p>word search — find every word hidden in the grid.</p>

  <h2>Rules</h2>
  <ul>
    <li>Every word in the list is in the grid exactly once.</li>
    <li>Words run in a <strong>straight line</strong>: across, down or diagonally, and either forwards or backwards.</li>
    <li>Words may cross each other, and two words can share a letter.</li>
    <li>Find them all to finish. The timer stops when the last word is found.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Press the first letter of a word and <strong>drag</strong> to its last letter, then let go. The dragged line is always the straight row, column or diagonal nearest your finger.</li>
    <li>You can drag a word backwards too, from its last letter to its first.</li>
    <li><code>hint</code> rings the first letter of one word you haven't found, up to three times. <code>↻ restart</code> clears the board and the clock for another go at the same puzzle.</li>
    <li>Your best time at each grid size is kept on this device.</li>
  </ul>

  <h2>Daily and random</h2>
  <ul>
    <li><strong>Daily</strong> is the same puzzle for everyone on the same day, at each size. <strong>Random</strong> gives a fresh one whenever you like.</li>
    <li><strong>Easy</strong> is 8×8 with six words, <strong>Medium</strong> is 10×10 with eight, and <strong>Hard</strong> is 12×12 with ten.</li>
    <li>Leaving or refreshing the page keeps the puzzle, the words you have found and your time.</li>
  </ul>

  <h2>Word list</h2>
  <p class="muted">About 500 common English words of four to seven letters, grouped by theme. No proper nouns, no rude words.</p>
</template>
