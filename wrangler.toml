# Cloudflare Workers config — serves the site and rewrites link previews.
#
# The repo root IS the site, exactly as GitHub Pages served it, so the
# assets directory is "./" and .assetsignore keeps the non-site files
# (this config, worker/, the READMEs) from being published.
#
# Deploy:  npx wrangler deploy
# Local:   npx wrangler dev --persist-to ../.wrangler-state
#          (then open http://localhost:8787/tic-tac-toe/)
#
# --persist-to is REQUIRED for dev, and the reason is worth knowing. The
# assets directory is the repo root, so wrangler's file watcher watches the
# repo root — including the .wrangler/ folder wrangler itself writes into
# it. Its local state is a set of SQLite databases with WAL files that are
# rewritten continuously, so the watcher sees a change, reloads, writes
# again, and never stops: measured at 978 reload cycles with the server
# accepting connections but never answering a single request.
#
# .assetsignore does NOT prevent this — it controls what gets uploaded, not
# what gets watched. Pointing --persist-to outside the repo moves those
# databases out of the watched tree and the loop stops (measured: 1 reload).
# What stays in .wrangler/ is bundle output, written once per build.
#
# `wrangler deploy` does not watch anything, so it needs no flag.

name = "wa-minigames"
main = "worker/index.mjs"
compatibility_date = "2026-09-12"

[assets]
directory = "./"
binding = "ASSETS"

# The Worker only has to see requests it changes: the pages (to rewrite the link-preview tags for a ?s= link and to
# redirect www), the API, and the service worker. Scripts, styles, pictures and fonts are served straight from the
# assets store, which is faster and is NOT billed as a Worker request (with run_worker_first = true every one of them
# was: about 20 requests for a first visit, which is what eats a daily request limit). Caching for those files is in
# _headers. A game page is "/<game>/", the hub is "/".
run_worker_first = ["/", "/*/", "/api/*", "/sw.js"]

# ---- Live online play (worker/live-room.mjs) ------------------------------
# One Durable Object per room holds the game state and relays moves between
# the two players over a hibernating WebSocket. WhatsApp link-passing mode
# needs none of this and keeps working if live play is switched off.
[[durable_objects.bindings]]
name = "ROOMS"
class_name = "LiveRoom"

# SQLite-backed storage, the type new Durable Objects should use.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["LiveRoom"]

# ---- Usernames, pokes and push (worker/user-registry.mjs) ------------------
# One object holds every username, push subscription and block list.
[[durable_objects.bindings]]
name = "USERS"
class_name = "UserRegistry"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UserRegistry"]

# ---- Crazy 8 rooms (worker/card-room.mjs): 2-4 seats, hidden hands, computer players ----
[[durable_objects.bindings]]
name = "CARDS"
class_name = "CardRoom"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CardRoom"]

[vars]
# Kill switch for the offline storage in sw.js: set to "1" and deploy, and every phone deletes what it stored and stops
# using it the next time it loads a page online. Set back to "0" and deploy to turn it on again. See the header of sw.js.
SW_KILL = "0"

# Kill switch: set to "0" and redeploy. The API answers 503, open rooms are
# closed, and the games hide the "live online" option on their next probe.
LIVE_ENABLED = "1"

# Web Push (poke a friend). Leave VAPID_PUBLIC_KEY empty to switch pokes off:
# usernames keep working, the notification controls just don't appear. Make a
# key pair, put the public half here and the private half in a secret:
#   node worker/vapid-keys.mjs
#   npx wrangler secret put VAPID_PRIVATE_KEY
VAPID_PUBLIC_KEY = "BBePVwqqxoS7r0xnMd0oPfso9Aer8vyWKL1Z0nKRvHdd3n0jDqJ4sWkqy0XL3eyMun5U6lKx2pAXHwpDyjDiGIU"
VAPID_SUBJECT = "https://wa-minigames.online"

# At most 20 new rooms per minute per IP.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 20
  period = 60

# Claiming or checking a username: at most 30 a minute per IP.
[[ratelimits]]
name = "CLAIM_LIMITER"
namespace_id = "1002"
  [ratelimits.simple]
  limit = 30
  period = 60

# Asking whether a room exists: each one wakes a room object, so a script trying
# codes would be billed per guess. 120 a minute per IP is far above any player.
[[ratelimits]]
name = "LOOKUP_LIMITER"
namespace_id = "1003"
  [ratelimits.simple]
  limit = 120
  period = 60
