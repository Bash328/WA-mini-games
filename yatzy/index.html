<template id="man-yatzy">
  <h2>Name</h2>
  <p>yatzy — the dice game, scored the Yahtzee way. 13 turns, 13 boxes.</p>

  <h2>Rules</h2>
  <ul>
    <li>Each turn, roll five dice, then roll again up to <strong>twice</strong> more, keeping any dice you like and re-rolling the rest. Then write the result in <strong>one box</strong> you haven't used. If nothing fits, you have to cross a box out for 0.</li>
    <li><strong>Ones to Sixes:</strong> the sum of the dice showing that number. Score <strong>63 or more</strong> in these six and you get a <strong>35 bonus</strong>.</li>
    <li><strong>Three / four of a kind:</strong> that many alike, and you score the total of all five dice. <strong>Full house</strong> (three of one, two of another): 25. <strong>Small straight</strong> (four in a row): 30. <strong>Large straight</strong> (five in a row): 40. <strong>Yatzy</strong> (all five alike): 50. <strong>Chance:</strong> the total, any dice.</li>
    <li>A second Yatzy when the Yatzy box already holds 50 earns <strong>+100</strong>, and it's a <strong>joker</strong>: it goes in its own number's box if that's free; otherwise any free lower box (a full house or straight scores in full); otherwise any free upper box.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Tap <code>Roll the dice</code>. Tap a die to <strong>keep</strong> it (it lifts up); tap it again to let it go. Then tap a box to pick it, and tap it again to score.</li>
    <li>Boxes show what your dice would score there. The game is <strong>13 turns</strong>; your final total is shown at the end.</li>
  </ul>

  <h2>Daily game</h2>
  <p class="muted"><code>today's game</code> deals the same dice to everyone for the day: the face of each die at each roll is fixed in advance, so rolling the same die in the same place always shows the same number. <code>new random game</code> is a fresh one. <code>replay this game</code> starts the same dice again.</p>
</template>
