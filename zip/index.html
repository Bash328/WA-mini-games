<style>
  .zp-grid {
    position: relative;
    display: grid;
    gap: 0;
    width: min(480px, 100%);
    aspect-ratio: 1;
    margin: 8px auto;
    border: 2px solid var(--fg);
    background: var(--bg-2);
    touch-action: none;
    user-select: none;
  }
  .zp-cell {
    position: relative;
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: clamp(0.9rem, 4.2vw, 1.3rem);
    color: var(--fg);
    background: transparent;
  }
  .zp-cell.on { background: rgba(245,197,66,0.18); }
  .zp-cell .wp {
    display: inline-flex; width: 2em; height: 2em;
    border-radius: 999px; background: var(--fg); color: var(--bg);
    align-items: center; justify-content: center; font-size: 0.9em;
  }
  .zp-cell.start .wp { background: var(--accent); }
  .zp-cell.end .wp { background: var(--accent-2); color: #0a0a0a; }
  .zp-svg { position: absolute; inset: 0; pointer-events: none; }
  .zp-wall-h, .zp-wall-v {
    position: absolute; background: var(--danger); pointer-events: none; z-index: 2;
  }
  .game-controls { display: flex; justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap; margin: 8px 0; }
  @keyframes zp-shake {
    0%,100% { transform: translateX(0); }
    20%,60% { transform: translateX(-3px); }
    40%,80% { transform: translateX(3px); }
  }
  .zp-cell.invalid { animation: zp-shake 0.3s ease; background: rgba(255,107,107,0.15); }

  html body.fun.g-zip { --accent: #ff9500; --fun-bg: #1f3b4d; --fun-btn: #4a7ea0; --fun-chip: rgba(255,255,255,.1); }

  /* chunky look: sea page, a white grid in a heavy frame, round numbered stops */
  html body.fun.g-zip .panel .zp-grid { width: calc(100% + 22px); margin: 8px -11px; box-sizing: border-box; max-width: none; border: 6px solid #000; border-radius: 22px; overflow: hidden; background: #fff; }
  html body.fun.g-zip .zp-cell { border-color: #d5dbe3; color: #2f3a46; font-weight: 400; }
  html body.fun.g-zip .zp-cell.on { background: rgba(255,176,0,.5); }
  html body.fun.g-zip .zp-cell .wp { background: #5b3df5; color: #fff; }
  html body.fun.g-zip .zp-cell.start .wp { background: #ff3d5a; } html body.fun.g-zip .zp-cell.end .wp { background: #00d4a8; color: #06231d; }
  html body.fun.g-zip .zp-wall-h, html body.fun.g-zip .zp-wall-v { background: #ff1f4b; box-shadow: 0 0 0 1px #fff; }
  /* the path glides (zip/game.js animates the head); cells fill softly as it passes, and the whole line pulses when you finish */
  .zp-cell { transition: background-color .2s ease; }
  html body.fun.g-zip .zp-svg { filter: drop-shadow(0 2px 2px rgba(0,0,0,.22)); }
  .zp-svg.win polyline { animation: zp-pulse .8s ease; }
  @keyframes zp-pulse { 0% { stroke-width: 10; } 40% { stroke-width: 19; } 100% { stroke-width: 10; } }
  @media (prefers-reduced-motion: reduce) { .zp-svg.win polyline { animation: none; } }
  .zp-halo { animation: zp-halo .9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes zp-halo { 50% { transform: scale(1.15); opacity: .7; } }
  @media (prefers-reduced-motion: reduce) { .zp-halo { animation: none; } }
</style>

    </div>
  </div>
</main>

<template id="man-zip">
  <h2>Name</h2>
  <p>zip — draw one continuous path through every cell, hitting the numbered waypoints in order.</p>

  <h2>Rules</h2>
  <ul>
    <li>Start on cell <strong>1</strong>. End on the highest number.</li>
    <li>Visit waypoints in ascending order: 1 → 2 → 3 → ….</li>
    <li>Move only between orthogonally-adjacent cells.</li>
    <li>Every cell must be visited <strong>exactly once</strong>.</li>
    <li>Red lines mark walls — you cannot cross them.</li>
  </ul>

  <h2>Controls</h2>
  <ul>
    <li>Touch / click-and-drag from cell 1 to paint the path.</li>
    <li>Or tap cells one by one — each tap extends from the current end, or truncates back if you tap a cell already on the path.</li>
    <li><code>↶ undo</code> removes the last cell. <code>↻ reset</code> clears the path.</li>
  </ul>
</template>
